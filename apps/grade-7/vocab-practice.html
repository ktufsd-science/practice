ep, much of it is given off as heat, so only a small part reaches the top."},{"id":"MSV-09-11","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Cycling of matter","kw":"nutrients, recycle","q":"A deer dies in a forest. Over time, decomposers break down its body, and tree roots take up the nutrients. What does this show?","c":["Matter is destroyed when organisms die and break down.","Energy is recycled by the trees and used again by new deer.","Matter cycles between the living and non-living parts of an ecosystem.","Decomposers create new matter that the trees use to grow."],"a":2,"ex":"Matter is recycled through ecosystems. It is not created or destroyed."},{"id":"MSV-09-12","bank":"Ecosystems","pe":"MS-LS2-2","topic":"Ecosystem interactions","term":"Interdependent relationship","kw":null,"q":"Sea otters eat sea urchins, and sea urchins eat kelp. When otters were overhunted, urchin numbers grew and kelp forests shrank. What does this show?","c":["Only abiotic factors affect kelp.","Organisms in an ecosystem depend on each other.","Sea urchins are producers.","Kelp and otters do not affect each other."],"a":1,"ex":"In interdependent relationships, a change in one population affects other populations."},{"id":"MSV-09-13","bank":"Ecosystems","pe":"MS-LS2-2","topic":"Ecosystem interactions","term":"Competition","kw":"compete, limited resources","q":"Lions and hyenas both hunt zebras on the same savanna. When zebras are scarce, both populations struggle. What type of interaction exists between the lions and hyenas?","c":["Competition","Mutualism","Pollination","Predation"],"a":0,"ex":"Competition happens when organisms need the same limited resource."},{"id":"MSV-09-14","bank":"Ecosystems","pe":"MS-LS2-2","topic":"Ecosystem interactions","term":"Predation","kw":"predator, prey","q":"A hawk dives and catches a mouse in a field. What type of interaction is this?","c":["Decomposition","Predation","Mutualism","Competition"],"a":1,"ex":"Predation is when a predator hunts and eats its prey."},{"id":"MSV-09-15","bank":"Ecosystems","pe":"MS-LS2-2","topic":"Ecosystem interactions","term":"Mutualism","kw":"mutually beneficial, symbiosis","q":"Clownfish live among a sea anemone's stinging tentacles, which protect them from predators. The clownfish clean the anemone and chase away fish that eat it. What type of interaction is this?","c":["Extinction","Predation","Mutualism","Competition"],"a":2,"ex":"In mutualism, both organisms benefit."},{"id":"MSV-09-16","bank":"Ecosystems","pe":"MS-LS2-5","topic":"Biodiversity solutions","term":"Biodiversity","kw":"variety of species","q":"Rain forest A has 300 tree species. Forest B has 12 tree species. Which statement is correct?","c":["The forests have equal biodiversity.","Forest B has greater biodiversity.","Biodiversity only counts animals, not trees.","Rain forest A has greater biodiversity."],"a":3,"ex":"Biodiversity is the variety of species in an area."},{"id":"MSV-09-17","bank":"Ecosystems","pe":"MS-LS2-4","topic":"Ecosystem disruptions","term":"Ecosystem stability","kw":"disruption, recovery","q":"After a small fire, a forest with many species of plants and animals recovers quickly, while a forest with only one tree species recovers slowly. What is the many-species forest showing?","c":["Lower biodiversity","Artificial selection","Less resource availability","Greater ecosystem stability"],"a":3,"ex":"Biodiversity contributes to ecosystem stability, which helps ecosystems recover after a disruption."},{"id":"MSV-09-18","bank":"Ecosystems","pe":"MS-LS2-5","topic":"Biodiversity solutions","term":"Ecosystem services","kw":"benefits, wetland","q":"A city protects a wetland because it filters water, reduces flooding, and provides habitat for fish that people catch. What are these benefits called?","c":["Constraints","Mutations","Ecosystem services","Abiotic factors"],"a":2,"ex":"Ecosystem services are benefits that healthy ecosystems provide to people."},{"id":"MSV-10-01","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Trait","kw":"characteristic","q":"A student has curly hair like her father and dimples like her mother. What are curly hair and dimples?","c":["Traits","Chromosomes","Mutations","Stimuli"],"a":0,"ex":"A trait is a characteristic of an organism."},{"id":"MSV-10-02","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Inheritance","kw":"inherit, heredity","q":"The puppies in a litter have coat colors similar to their parents. What explains this?","c":["Natural selection acting on the puppies after birth","Homeostasis keeping the puppies' bodies stable","Environmental factors in the puppies' first home","Inheritance of genetic information from the parents"],"a":3,"ex":"Inheritance is the passing of traits from parents to offspring through genetic information."},{"id":"MSV-10-03","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Genetic information","kw":"DNA, instructions","q":"Before a cell divides, it makes a copy of its DNA so each new cell gets the same instructions. What is being copied?","c":["The cell wall","Thermal energy","Genetic information","Glucose"],"a":2,"ex":"Genetic information is the set of instructions stored in DNA."},{"id":"MSV-10-04","bank":"Heredity","pe":"MS-LS3-1","topic":"Mutations and proteins","term":"Chromosome","kw":"DNA, nucleus","q":"Inside the nucleus, DNA is packaged into structures that each carry many genes. Most human body cells have 46 of these structures. What are they?","c":["Proteins","Mitochondria","Alleles","Chromosomes"],"a":3,"ex":"Chromosomes are structures in the nucleus that contain genes."},{"id":"MSV-10-05","bank":"Heredity","pe":"MS-LS3-1","topic":"Mutations and proteins","term":"Gene","kw":"DNA","q":"A section of DNA carries the instructions for making a protein that determines whether a pea plant's seeds are wrinkled or smooth. What is this section of DNA?","c":["A tissue","A gene","A Punnett square","A chromosome pair"],"a":1,"ex":"A gene is a segment of DNA that carries instructions for making a protein."},{"id":"MSV-10-06","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Allele","kw":"gene version","q":"A pea plant gene for flower color comes in two versions: one for purple flowers and one for white flowers. What is each version called?","c":["An allele","A species","A tissue","A chromosome"],"a":0,"ex":"Alleles are different versions of the same gene."},{"id":"MSV-10-07","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Dominant allele","kw":"dominant trait, capital letter","q":"A pea plant has one allele for purple flowers and one allele for white flowers, and its flowers are purple. What does this suggest about the purple allele?","c":["It came from asexual reproduction.","It is dominant.","It is recessive.","It is a mutation."],"a":1,"ex":"A dominant allele's trait shows up even when only one copy is present."},{"id":"MSV-10-08","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Recessive allele","kw":"recessive trait, lowercase letter","q":"Two guinea pigs with black fur have a baby with white fur. The white-fur allele was hidden in both parents. What type of allele is the white-fur allele?","c":["Dominant","Recessive","Synthetic","Environmental"],"a":1,"ex":"A recessive trait appears only when an organism inherits two copies of the allele, one from each parent."},{"id":"MSV-10-09","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Punnett square","kw":"genetic cross, probability","q":"Two parent plants each have the alleles Bb. In a Punnett square for this cross, how many of the 4 boxes will show offspring with the recessive trait (bb)?","c":["1 out of 4","2 out of 4","3 out of 4","4 out of 4"],"a":0,"ex":"The cross Bb × Bb gives BB, Bb, Bb, and bb. Only bb, 1 out of 4, shows the recessive trait."},{"id":"MSV-10-10","bank":"Heredity","pe":"MS-LS3-1","topic":"Mutations and proteins","term":"Protein","kw":null,"q":"A gene carries instructions for making a molecule that helps a flower make its red color. If the gene changes, the flower may be white instead. What type of molecule do genes carry instructions for?","c":["Proteins","Water","Minerals","Glucose"],"a":0,"ex":"Genes provide instructions for making proteins. Here the protein helps the flower make its red color, so a change in the gene can change the trait."},{"id":"MSV-10-11","bank":"Heredity","pe":"MS-LS3-1","topic":"Mutations and proteins","term":"Mutation","kw":"gene change, harmful, beneficial, neutral","q":"A change in a gene causes a moth to be born with darker wings than its parents. In a sooty forest, the dark wings help it hide from birds. What is the change in the gene called?","c":["Homeostasis","A mutation","Pollination","Artificial selection"],"a":1,"ex":"A mutation is a change in a gene. It can be harmful, beneficial, or neutral."},{"id":"MSV-10-12","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Reproduction","kw":null,"q":"A strawberry plant sends out runners that grow into new plants, and it also makes seeds from its flowers. What do both of these accomplish?","c":["Reproduction","Homeostasis","Decomposition","Photosynthesis"],"a":0,"ex":"Reproduction is how organisms produce offspring."},{"id":"MSV-10-13","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Asexual reproduction","kw":"one parent, identical, clone","q":"A small piece broken from a potato grows into a whole new plant with exactly the same genetic information as the original. What type of reproduction is this?","c":["Sexual reproduction","Artificial selection","Asexual reproduction","Pollination"],"a":2,"ex":"Asexual reproduction involves one parent and produces offspring with identical genetic information."},{"id":"MSV-10-14","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Sexual reproduction","kw":"two parents, variation","q":"Two rabbits mate, and each baby rabbit in the litter looks a little different from its parents and from the others. What type of reproduction explains the differences?","c":["Cloning","Sexual reproduction","Photosynthesis","Asexual reproduction"],"a":1,"ex":"Sexual reproduction combines genetic information from two parents, which produces variation."},{"id":"MSV-10-15","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Offspring","kw":null,"q":"A farmer crosses a tall pea plant with a short pea plant and plants the seeds that form. What are the plants that grow from these seeds?","c":["Offspring","Parents","Species","Mutations"],"a":0,"ex":"Offspring are the young produced through reproduction."},{"id":"MSV-10-16","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Variation","kw":"differences","q":"In a field of sunflowers grown from seeds of the same parents, some plants are taller and some have larger flower heads than others. What does this describe?","c":["Variation","Extinction","Homeostasis","Conservation of mass"],"a":0,"ex":"Variation is the differences among individuals in a population."},{"id":"MSV-10-17","bank":"Heredity","pe":"MS-LS3-2","topic":"Asexual and sexual reproduction","term":"Genetic variation","kw":null,"q":"A population of beetles includes green beetles and brown beetles because individuals carry different alleles for color. Why is this important if the environment changes?","c":["It stops natural selection from happening.","It means all the beetles will die at the same time.","It makes it more likely that some individuals will survive and reproduce.","It only happens in asexual reproduction."],"a":2,"ex":"Genetic variation gives natural selection traits to act on, so some individuals may survive a change."},{"id":"MSV-11-01","bank":"Evolution and Natural Selection","pe":"MS-LS4-1","topic":"Fossil record","term":"Species","kw":null,"q":"Horses and donkeys can mate and produce mules, but mules cannot reproduce. Why are horses and donkeys considered different species?","c":["Their offspring are not fertile.","They eat different foods.","They live in different places.","They are different colors."],"a":0,"ex":"A species is a group of organisms that can reproduce and produce fertile offspring."},{"id":"MSV-11-02","bank":"Evolution and Natural Selection","pe":"MS-LS4-1","topic":"Fossil record","term":"Fossil","kw":"remains, imprint","q":"A scientist finds the imprint of a leaf in a layer of shale. What has the scientist found?","c":["An extended structure","A mineral resource","A fossil","A mutation"],"a":2,"ex":"Fossils are the preserved remains or traces of organisms that lived in the past."},{"id":"MSV-11-03","bank":"Evolution and Natural Selection","pe":"MS-LS4-1","topic":"Fossil record","term":"Fossil record","kw":null,"q":"Scientists compare the preserved remains of ancient organisms found in rock layers around the world. Simpler life forms appear in older layers, and more complex ones appear in younger layers. What are they studying?","c":["A food web","A Punnett square","The fossil record","The water cycle"],"a":2,"ex":"The fossil record is the collection of fossils and their placement in rock layers over time."},{"id":"MSV-11-04","bank":"Evolution and Natural Selection","pe":"MS-LS4-1","topic":"Fossil record","term":"Extinction","kw":"extinct","q":"Trilobite fossils are common in older rock layers, but none are found in younger layers or living today. What does this suggest?","c":["Trilobites are still living in large numbers.","Trilobites are a mineral resource.","Trilobites went extinct.","Trilobites turned into rocks."],"a":2,"ex":"Extinction is the complete disappearance of a species."},{"id":"MSV-11-05","bank":"Evolution and Natural Selection","pe":"MS-LS4-1","topic":"Fossil record","term":"Diversity","kw":null,"q":"During one period in the fossil record, the number of different kinds of organisms increased rapidly. What increased?","c":["The density of the rock","The diversity of life","The amplitude of waves","The frequency of eclipses"],"a":1,"ex":"Diversity is the range of different types of organisms."},{"id":"MSV-11-06","bank":"Evolution and Natural Selection","pe":"MS-LS4-2","topic":"Anatomical similarities","term":"Common ancestor","kw":"common ancestry, descent","q":"Lions, tigers, and house cats share many skeletal features and have similar DNA. What is the best explanation?","c":["They live in the same habitat.","They were produced by artificial selection.","They descended from a common ancestor.","They chose to look alike."],"a":2,"ex":"Shared features are evidence that species descended from a common ancestor."},{"id":"MSV-11-07","bank":"Evolution and Natural Selection","pe":"MS-LS4-2","topic":"Anatomical similarities","term":"Evolutionary relationship","kw":null,"q":"DNA and bone structure show that whales are more closely related to hippos than to fish, even though whales live in water like fish. What are scientists describing?","c":["An environmental factor","Mutualism","A predator and prey relationship","An evolutionary relationship"],"a":3,"ex":"Evolutionary relationships are connections between organisms based on common ancestry."},{"id":"MSV-11-08","bank":"Evolution and Natural Selection","pe":"MS-LS4-2","topic":"Anatomical similarities","term":"Anatomical similarity","kw":"anatomical, homologous structures, bones","q":"A human arm, a bat wing, and a whale flipper contain the same set of bones in the same order, even though they are used in different ways. What is this evidence called?","c":["Genetic engineering","Anatomical similarity","Extinction","Artificial selection"],"a":1,"ex":"Similar body structures in different organisms are evidence of common ancestry."},{"id":"MSV-11-09","bank":"Evolution and Natural Selection","pe":"MS-LS4-3","topic":"Embryo similarities","term":"Embryological development","kw":"embryo","q":"Drawings show fish, chickens, and humans at a very early stage, before hatching or birth. All three have tails and similar structures near the neck. What is being compared?","c":["Adult anatomy","Embryological development","Adult behavior","Ecosystem services"],"a":1,"ex":"Similar patterns in how embryos develop are evidence of evolutionary relationships."},{"id":"MSV-11-10","bank":"Evolution and Natural Selection","pe":"MS-LS4-6","topic":"Traits change over time","term":"Adaptation","kw":"adapt, survival","q":"Arctic foxes grow thick white fur in winter that keeps them warm and helps them hide in the snow. Foxes with this trait survive and reproduce more. What is the thick white fur?","c":["A learned behavior","An adaptation","An abiotic factor","A trait each fox chose to develop"],"a":1,"ex":"An adaptation is an inherited trait that helps an organism survive and reproduce."},{"id":"MSV-11-11","bank":"Evolution and Natural Selection","pe":"MS-LS4-4","topic":"Natural selection","term":"Natural selection","kw":"survival of the fittest, evolution","q":"In a population of mice living on dark soil, owls catch dark-furred mice less often than light-furred mice. After many generations, most mice in the population have dark fur. What process explains this change?","c":["Artificial selection","Asexual reproduction","Genetic engineering","Natural selection"],"a":3,"ex":"In natural selection, individuals with helpful traits survive and reproduce more, so the trait becomes more common."},{"id":"MSV-11-12","bank":"Evolution and Natural Selection","pe":"MS-LS4-4","topic":"Natural selection","term":"Probability","kw":"chance, likelihood","q":"A rabbit with fur that matches the snow is less likely to be seen by predators. How does the fur color affect the rabbit?","c":["It guarantees the rabbit will survive.","It increases the rabbit's probability of surviving and reproducing.","It has no effect on survival.","It decreases the rabbit's chance of survival."],"a":1,"ex":"Helpful traits increase the probability of survival, but they do not guarantee it."},{"id":"MSV-11-13","bank":"Evolution and Natural Selection","pe":"MS-LS4-5","topic":"Selection technologies","term":"Artificial selection","kw":"selective breeding","q":"For thousands of years, farmers planted seeds only from the corn plants with the largest ears. Today's corn has much bigger ears than wild corn. What process is this?","c":["Natural selection","Artificial selection","Extinction","Mutation"],"a":1,"ex":"In artificial selection, humans choose which organisms reproduce to increase a desired trait."},{"id":"MSV-11-14","bank":"Evolution and Natural Selection","pe":"MS-LS4-5","topic":"Selection technologies","term":"Genetic engineering","kw":"genetic modification, GMO, gene therapy","q":"Scientists insert a gene from a bacterium into a corn plant so that the corn makes its own insect-killing protein. What technology is this?","c":["Natural selection","Pollination","Genetic engineering","Artificial selection"],"a":2,"ex":"Genetic engineering directly changes an organism's genes using technology."},{"id":"MSV-12-01","bank":"Space Systems","pe":"MS-ESS1-2","topic":"Gravity in space","term":"Solar system","kw":null,"q":"A model includes the Sun, eight planets and their moons, and the asteroids and comets that orbit the Sun. What does the model represent?","c":["An ecosystem","A galaxy","The Earth-Sun-Moon system only","The solar system"],"a":3,"ex":"The solar system is the Sun and all the objects that orbit it."},{"id":"MSV-12-02","bank":"Space Systems","pe":"MS-ESS1-2","topic":"Gravity in space","term":"Galaxy","kw":"Milky Way, stars","q":"The Sun is one of billions of stars held together by gravity, along with gas and dust, in the Milky Way. What is the Milky Way?","c":["A galaxy","A solar system","A planet","An orbit"],"a":0,"ex":"A galaxy is a huge collection of stars, gas, and dust held together by gravity."},{"id":"MSV-12-03","bank":"Space Systems","pe":"MS-ESS1-2","topic":"Gravity in space","term":"Orbit","kw":"path, gravity","q":"The International Space Station circles Earth about every 90 minutes. Earth's gravity keeps pulling it into a curved path instead of letting it fly off into space. What is this curved path?","c":["An axis","An eclipse","An orbit","A rotation"],"a":2,"ex":"An orbit is the curved path of one object around another, held by gravity."},{"id":"MSV-12-04","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Axis","kw":"tilt, poles","q":"A globe is mounted on a rod that passes through the North and South Poles at a slant. What does the rod represent?","c":["Earth's orbit","Earth's axis","Earth's equator","Earth's revolution"],"a":1,"ex":"The axis is the imaginary line through the poles that Earth spins on."},{"id":"MSV-12-05","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Rotation","kw":"spin, day and night","q":"It is nighttime in Asia while it is daytime in North America. What causes day and night on Earth?","c":["The Moon blocking the Sun","Changes in Earth's distance from the Sun","Earth's rotation on its axis","Earth's revolution around the Sun"],"a":2,"ex":"Earth's rotation turns each place toward and then away from the Sun about every 24 hours."},{"id":"MSV-12-06","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Revolution","kw":"year, revolve","q":"It takes Earth about 365 days to travel once around the Sun. What is this trip called?","c":["One eclipse","One rotation","One revolution","One lunar phase"],"a":2,"ex":"A revolution is one complete trip around an orbit."},{"id":"MSV-12-07","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Earth-Sun-Moon system","kw":null,"q":"A student uses a lamp, a large ball, and a small ball to explain day and night, Moon phases, and eclipses. What system is the student modeling?","c":["A galaxy","The rock cycle","A food web","The Earth-Sun-Moon system"],"a":3,"ex":"The Earth-Sun-Moon system explains cyclic patterns such as lunar phases, eclipses, and seasons."},{"id":"MSV-12-08","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Lunar phase","kw":"moon phase, crescent, full moon, new moon","q":"Over about two weeks, the Moon seems to change from a thin crescent to a full circle. What causes this change?","c":["Clouds block parts of the Moon.","Earth's shadow covers less of the Moon each night.","The Moon makes more of its own light.","We see different amounts of the Moon's sunlit half as it orbits Earth."],"a":3,"ex":"Lunar phases come from the changing positions of Earth, the Sun, and the Moon."},{"id":"MSV-12-09","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Eclipse","kw":"solar eclipse, lunar eclipse, shadow","q":"During the day, the sky suddenly darkens as the Moon passes directly between the Sun and Earth, blocking the Sun's light. What event is this?","c":["A lunar eclipse","A full moon","A change of season","A solar eclipse"],"a":3,"ex":"A solar eclipse happens when the Moon blocks sunlight from reaching part of Earth."},{"id":"MSV-12-10","bank":"Space Systems","pe":"MS-ESS1-1","topic":"Earth-Sun-Moon patterns","term":"Season","kw":"tilt, summer, winter","q":"In June, the Northern Hemisphere has summer while the Southern Hemisphere has winter. What causes this?","c":["Earth's tilted axis points the Northern Hemisphere toward the Sun in June.","Earth is much closer to the Sun in June.","The Moon blocks sunlight from the Southern Hemisphere.","The Sun gives off more energy in June."],"a":0,"ex":"Seasons are caused by the tilt of Earth's axis as Earth orbits the Sun."},{"id":"MSV-12-11","bank":"Space Systems","pe":"MS-ESS1-3","topic":"Solar system scale","term":"Scale","kw":"size, distance","q":"A table shows that Jupiter's diameter is about 11 times Earth's and that Neptune is about 30 times farther from the Sun than Earth is. What does this data help students understand about the solar system?","c":["Its rate of mutation","Its scale","Its frequency","Its rate of erosion"],"a":1,"ex":"Scale describes the relative sizes of objects and the distances between them."},{"id":"MSV-13-01","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-2","topic":"Changing surface","term":"Geologic process","kw":null,"q":"Over millions of years, the Colorado River carved the Grand Canyon. What kind of process is this?","c":["Pollination","A lunar phase","A geologic process","A chemical reaction in a test tube"],"a":2,"ex":"Geologic processes shape Earth's surface or interior over time."},{"id":"MSV-13-02","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-2","topic":"Changing surface","term":"Weathering","kw":"break down, frost wedging","q":"Water seeps into cracks in a rock, freezes, and expands. After many winters, the rock breaks into smaller pieces. What process is this?","c":["Erosion","Condensation","Weathering","Deposition"],"a":2,"ex":"Weathering is the breaking down of rock into smaller pieces."},{"id":"MSV-13-03","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-2","topic":"Changing surface","term":"Erosion","kw":"transport, carry away","q":"After a heavy rainstorm, a stream carries soil and pebbles from a hillside down into the valley. What process moved the soil?","c":["Weathering","Erosion","Superposition","Deposition"],"a":1,"ex":"Erosion moves weathered rock and soil from one place to another."},{"id":"MSV-13-04","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-2","topic":"Changing surface","term":"Deposition","kw":"sediment, delta","q":"Where a river flows into the ocean, it slows down and drops sand and mud, building a delta. What process builds the delta?","c":["Weathering","Deposition","Erosion","Plate motion"],"a":1,"ex":"Deposition is when sediment is dropped in a new place."},{"id":"MSV-13-05","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-2","topic":"Changing surface","term":"Spatial scale","kw":"size, area","q":"A landslide changes the land on one hillside in a few minutes. A large earthquake changes the land across a whole region in a few minutes. What do these examples differ in?","c":["Temporal scale","Frequency","Spatial scale","Density"],"a":2,"ex":"Spatial scale is the size of the area a process affects. Both events take minutes, but one affects a hillside and the other a whole region."},{"id":"MSV-13-06","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-2","topic":"Changing surface","term":"Temporal scale","kw":"time, duration","q":"An earthquake shakes a region for a few seconds. The mountains in that same region took millions of years to form. What do these examples differ in?","c":["Population","Spatial scale","Amplitude","Temporal scale"],"a":3,"ex":"Temporal scale is the length of time over which a process happens."},{"id":"MSV-13-07","bank":"Earth's History and Changing Surface","pe":"MS-ESS1-4","topic":"Geologic time","term":"Rock strata","kw":"rock layers, stratum","q":"A road cut through a hill shows layers of sandstone, shale, and limestone stacked on top of each other. What are these layers called?","c":["Seafloor structures","Rock strata","Continental shapes","Tissues"],"a":1,"ex":"Rock strata are layers of rock deposited over time."},{"id":"MSV-13-08","bank":"Earth's History and Changing Surface","pe":"MS-ESS1-4","topic":"Geologic time","term":"Superposition","kw":"law of superposition, oldest at bottom","q":"A cliff has three undisturbed rock layers: Layer A on top, Layer B in the middle, and Layer C on the bottom. Which layer is the oldest?","c":["Layer A, because it is on top","Layer B, because it is in the middle","All the layers are the same age.","Layer C, because older layers are on the bottom"],"a":3,"ex":"By superposition, the oldest undisturbed layer is on the bottom."},{"id":"MSV-13-09","bank":"Earth's History and Changing Surface","pe":"MS-ESS1-4","topic":"Geologic time","term":"Relative age","kw":"older, younger","q":"In a set of undisturbed rock layers, a fossil is found in a layer below a layer that contains dinosaur bones. Without knowing exact dates, what can scientists say?","c":["Nothing can be said about its age.","The fossil is exactly 100 million years old.","The fossil is younger than the dinosaur bones.","The fossil is older than the dinosaur bones."],"a":3,"ex":"Relative age compares the ages of layers or fossils without giving an exact number of years."},{"id":"MSV-13-10","bank":"Earth's History and Changing Surface","pe":"MS-ESS1-4","topic":"Geologic time","term":"Geologic time scale","kw":"eras, periods, Earth's history","q":"Scientists divide Earth's 4.6-billion-year history into eras and periods based on major events, such as mass extinctions, in the rock and fossil record. What have they created?","c":["The geologic time scale","A food web","A Punnett square","A weather map"],"a":0,"ex":"The geologic time scale organizes Earth's history into divisions based on major events."},{"id":"MSV-13-11","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-3","topic":"Plate motion evidence","term":"Plate motion","kw":"plate tectonics, tectonic plates, continental drift","q":"Scientists measure that North America and Europe are moving apart a few centimeters each year as new seafloor forms in the Atlantic Ocean. What is happening?","c":["Plate motion","A lunar phase","Erosion","Deposition"],"a":0,"ex":"Plate motion is the slow movement of large sections of Earth's crust and upper mantle."},{"id":"MSV-13-12","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-3","topic":"Plate motion evidence","term":"Continental shape","kw":"puzzle fit, Pangaea","q":"The east coast of South America and the west coast of Africa look like they could fit together like puzzle pieces. What type of evidence is this for past plate motion?","c":["Seafloor structure","Superposition","Weathering","Continental shape"],"a":3,"ex":"Matching continental shapes are evidence that the continents were once joined."},{"id":"MSV-13-13","bank":"Earth's History and Changing Surface","pe":"MS-ESS2-3","topic":"Plate motion evidence","term":"Seafloor structure","kw":"mid-ocean ridge, trench","q":"Scientists map a long underwater mountain range down the middle of the Atlantic Ocean where new crust forms. The rocks get older the farther they are from the center. What evidence is this?","c":["Continental shape","Seafloor structure","The fossil record","The rock cycle"],"a":1,"ex":"Features of the ocean floor, such as mid-ocean ridges, are evidence of plate motion."},{"id":"MSV-14-01","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-1","topic":"Rock cycle","term":"Rock cycle","kw":"cycling of Earth's materials","q":"Over millions of years, a granite boulder weathers into sand, the sand becomes sandstone, and the sandstone is buried and heated until it becomes quartzite. What does this sequence show?","c":["The rock cycle","Lunar phases","A food web","The water cycle"],"a":0,"ex":"The rock cycle describes how rocks change from one type to another over time."},{"id":"MSV-14-02","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-1","topic":"Rock cycle","term":"Igneous rock","kw":"magma, lava","q":"Lava from a volcano flows onto the land, cools, and hardens into black rock. What type of rock forms?","c":["Metamorphic rock","Igneous rock","Sedimentary rock","A fossil"],"a":1,"ex":"Igneous rock forms when molten rock cools and hardens."},{"id":"MSV-14-03","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-1","topic":"Rock cycle","term":"Sedimentary rock","kw":"sediment, layers","q":"Layers of mud and sand settle at the bottom of a lake, get buried, and are pressed and cemented together over millions of years. What type of rock forms?","c":["Magma","Sedimentary rock","Metamorphic rock","Igneous rock"],"a":1,"ex":"Sedimentary rock forms from layers of sediment that are compacted and cemented."},{"id":"MSV-14-04","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-1","topic":"Rock cycle","term":"Metamorphic rock","kw":"heat and pressure","q":"Limestone buried deep underground is changed by intense heat and pressure into marble, without melting. What type of rock is marble?","c":["Metamorphic rock","Igneous rock","Sedimentary rock","Lava"],"a":0,"ex":"Metamorphic rock forms when existing rock is changed by heat and pressure."},{"id":"MSV-14-05","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-1","topic":"Rock cycle","term":"Earth's internal heat","kw":"internal energy, interior, mantle","q":"Deep underground, rock melts into magma that rises and erupts from volcanoes. What is the main energy source that melts this rock?","c":["Ocean tides","Earth's internal heat","Wind","Sunlight"],"a":1,"ex":"Heat inside Earth, from its formation and radioactive decay, melts rock and drives volcanoes and plate motion."},{"id":"MSV-14-06","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-4","topic":"Water cycle","term":"Water cycle","kw":"hydrologic cycle","q":"A water molecule evaporates from the ocean, becomes part of a cloud, falls as rain on a mountain, and flows back to the ocean in a river. What does this path describe?","c":["The water cycle","The rock cycle","A food web","A revolution"],"a":0,"ex":"The water cycle is the continuous movement of water between the land, oceans, and atmosphere."},{"id":"MSV-14-07","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-4","topic":"Water cycle","term":"Evaporation","kw":"water vapor, separate","q":"A student leaves a dish of salt water on a sunny windowsill. A week later, the water is gone and salt crystals remain. What happened to the water?","c":["It condensed.","It precipitated.","It was filtered.","It evaporated."],"a":3,"ex":"Evaporation changes liquid water into water vapor and can separate dissolved salt from water."},{"id":"MSV-14-08","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-4","topic":"Water cycle","term":"Condensation","kw":"clouds, dew","q":"On a humid day, drops of water form on the outside of a glass of ice water. Where does the water come from?","c":["The glass absorbs water from the table.","Water leaks through the glass.","Water vapor in the air condenses on the cold glass.","The ice melts through the glass."],"a":2,"ex":"Condensation is when water vapor cools and changes into liquid water."},{"id":"MSV-14-09","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-4","topic":"Water cycle","term":"Precipitation","kw":"rain, snow","q":"Water droplets in a cloud combine until they are too heavy to stay up, and gravity pulls them to the ground as rain. What step of the water cycle is this?","c":["Condensation","Transpiration","Evaporation","Precipitation"],"a":3,"ex":"Precipitation is water falling from clouds to Earth's surface."},{"id":"MSV-14-10","bank":"Earth's Materials and the Water Cycle","pe":"MS-ESS2-4","topic":"Water cycle","term":"Transpiration","kw":"plants, leaves, water vapor","q":"A student ties a clear plastic bag around a leafy branch on a sunny day. Hours later, water droplets cover the inside of the bag. Where did the water come from?","c":["Groundwater rising through the bag","Transpiration from the leaves","Precipitation inside the bag","Erosion of the branch"],"a":1,"ex":"Transpiration is the release of water vapor from plant leaves."},{"id":"MSV-15-01","bank":"Weather and Climate","pe":"MS-ESS2-5","topic":"Air masses and weather","term":"Weather condition","kw":"weather","q":"At 3:00 p.m. in Buffalo, it is 18°C, cloudy, and windy with light rain. What does this describe?","c":["The climate","The weather conditions","The geologic time scale","Oceanic circulation"],"a":1,"ex":"Weather conditions describe the atmosphere at a specific time and place."},{"id":"MSV-15-02","bank":"Weather and Climate","pe":"MS-ESS2-5","topic":"Air masses and weather","term":"Weather variable","kw":"humidity, wind speed, temperature","q":"A weather station records temperature, humidity, wind speed, and air pressure every hour. What are these measurements?","c":["Weather variables","Greenhouse gases","Climate zones","Controlled variables"],"a":0,"ex":"Weather variables are measurable factors that describe weather conditions."},{"id":"MSV-15-03","bank":"Weather and Climate","pe":"MS-ESS2-5","topic":"Air masses and weather","term":"Air pressure","kw":"barometer, barometric pressure","q":"A barometer shows that air pressure has been falling quickly all morning. What weather is most likely on the way?","c":["Stormy weather","A solar eclipse","No change in the weather","Clear, sunny skies"],"a":0,"ex":"Falling air pressure often signals stormy weather."},{"id":"MSV-15-04","bank":"Weather and Climate","pe":"MS-ESS2-5","topic":"Air masses and weather","term":"Air mass","kw":null,"q":"A large body of cold, dry air moves south from Canada into New York. What is this body of air?","c":["A front","An air mass","A greenhouse gas","A climate"],"a":1,"ex":"An air mass is a large body of air with similar temperature and moisture throughout."},{"id":"MSV-15-05","bank":"Weather and Climate","pe":"MS-ESS2-5","topic":"Air masses and weather","term":"Front","kw":"cold front, warm front, boundary","q":"A cold, dry air mass pushes into a warm, humid air mass. Along the boundary, the warm air is forced upward, and thunderstorms form. What is this boundary called?","c":["A front","An air mass","A climate zone","An orbit"],"a":0,"ex":"A front is the boundary between two different air masses, where the weather often changes."},{"id":"MSV-15-06","bank":"Weather and Climate","pe":"MS-ESS2-6","topic":"Circulation and climate","term":"Atmospheric circulation","kw":"wind patterns, uneven heating","q":"Uneven heating of Earth's surface makes warm air near the equator rise and flow toward the poles, while cooler air moves toward the equator. What is this large-scale movement of air?","c":["Transpiration","Atmospheric circulation","Plate motion","Oceanic circulation"],"a":1,"ex":"Atmospheric circulation is the large-scale movement of air, driven by unequal heating and Earth's rotation."},{"id":"MSV-15-07","bank":"Weather and Climate","pe":"MS-ESS2-6","topic":"Circulation and climate","term":"Oceanic circulation","kw":"ocean currents, Gulf Stream","q":"The Gulf Stream carries warm water from the Gulf of Mexico across the Atlantic Ocean, keeping parts of Western Europe milder than other places at the same latitude. What is the Gulf Stream part of?","c":["Oceanic circulation","The rock cycle","Atmospheric circulation","A food web"],"a":0,"ex":"Oceanic circulation moves water through the oceans and affects regional climates."},{"id":"MSV-15-08","bank":"Weather and Climate","pe":"MS-ESS2-6","topic":"Circulation and climate","term":"Climate","kw":null,"q":"A travel guide says: \"Based on 30 years of records, Phoenix, Arizona, usually has hot, dry summers and mild winters.\" What does this describe?","c":["An air mass","A front","Climate","Weather conditions"],"a":2,"ex":"Climate is the long-term pattern of weather in a region."},{"id":"MSV-15-09","bank":"Weather and Climate","pe":"MS-ESS3-5","topic":"Rising global temperature","term":"Greenhouse gas","kw":"carbon dioxide, methane, greenhouse effect","q":"Carbon dioxide released by burning gasoline traps thermal energy in the atmosphere and warms Earth's surface. What is carbon dioxide an example of?","c":["A weather variable","A greenhouse gas","An air mass","A mineral resource"],"a":1,"ex":"Greenhouse gases trap thermal energy in the atmosphere."},{"id":"MSV-15-10","bank":"Weather and Climate","pe":"MS-ESS3-5","topic":"Rising global temperature","term":"Climate change","kw":"global warming, global temperature","q":"Data show that Earth's average surface temperature has risen over the past century while the amount of carbon dioxide in the atmosphere has increased. What does this evidence describe?","c":["Climate change linked to rising greenhouse gases","Seasons caused by Earth's tilt","A single day of unusual weather","A change in lunar phases"],"a":0,"ex":"Climate change is a long-term change in average temperatures, mainly caused by human activities that add greenhouse gases."},{"id":"MSV-16-01","bank":"Earth and Human Activity","pe":"MS-ESS3-1","topic":"Resource distribution","term":"Natural resource","kw":null,"q":"A town relies on a nearby river for drinking water and a forest for lumber. What are the water and the trees?","c":["Weather variables","Natural resources","Synthetic materials","Constraints"],"a":1,"ex":"Natural resources are materials found in nature that people use."},{"id":"MSV-16-02","bank":"Earth and Human Activity","pe":"MS-ESS3-3","topic":"Reducing human impact","term":"Renewable resource","kw":"solar, wind, renewable energy","q":"A school installs solar panels to make electricity from sunlight, which will keep shining every day. What type of resource is sunlight?","c":["A renewable resource","A nonrenewable resource","A fossil fuel","A mineral resource"],"a":0,"ex":"Renewable resources are replaced naturally within a human lifetime."},{"id":"MSV-16-03","bank":"Earth and Human Activity","pe":"MS-ESS3-1","topic":"Resource distribution","term":"Nonrenewable resource","kw":"coal, oil, limited","q":"Coal takes millions of years to form, but people mine and burn it much faster than it forms. What type of resource is coal?","c":["An ecosystem service","A synthetic material","A nonrenewable resource","A renewable resource"],"a":2,"ex":"Nonrenewable resources form much more slowly than people use them."},{"id":"MSV-16-04","bank":"Earth and Human Activity","pe":"MS-ESS3-1","topic":"Resource distribution","term":"Fossil fuel","kw":"coal, oil, natural gas, petroleum","q":"Natural gas formed over millions of years from the remains of tiny ocean organisms buried under layers of sediment. What is natural gas?","c":["An igneous rock","A renewable resource","A synthetic material","A fossil fuel"],"a":3,"ex":"Fossil fuels formed over millions of years from the remains of ancient organisms."},{"id":"MSV-16-05","bank":"Earth and Human Activity","pe":"MS-ESS3-1","topic":"Resource distribution","term":"Mineral resource","kw":"ore, mining","q":"The copper used in electrical wires is mined from deposits found in only certain parts of Earth's crust. What is copper an example of?","c":["A synthetic material","A fossil fuel","A renewable resource","A mineral resource"],"a":3,"ex":"Mineral resources are naturally occurring, nonliving substances in Earth's crust that have value."},{"id":"MSV-16-06","bank":"Earth and Human Activity","pe":"MS-ESS3-1","topic":"Resource distribution","term":"Groundwater","kw":"aquifer, well","q":"A farmer drills a well to reach water stored in the spaces between rocks and soil deep underground. What water is the farmer using?","c":["Groundwater","Precipitation","Water vapor","Ocean water"],"a":0,"ex":"Groundwater is water found beneath Earth's surface in soil and rock."},{"id":"MSV-16-07","bank":"Earth and Human Activity","pe":"MS-ESS3-2","topic":"Natural hazards","term":"Natural hazard","kw":"hurricane, earthquake, volcano, flood","q":"A coastal city prepares for hurricanes, which can damage homes and threaten lives. What is a hurricane an example of?","c":["An ecosystem service","A renewable resource","A natural hazard","A natural resource"],"a":2,"ex":"A natural hazard is a natural event that threatens human life or property."},{"id":"MSV-16-08","bank":"Earth and Human Activity","pe":"MS-ESS3-2","topic":"Natural hazards","term":"Catastrophic event","kw":"natural disaster","q":"A huge volcanic eruption destroys forests and buries nearby towns in ash in a single day. How is this best described?","c":["A catastrophic event","A seasonal change","A slow geologic process","Weathering"],"a":0,"ex":"A catastrophic event is a sudden, large-scale natural disaster."},{"id":"MSV-16-09","bank":"Earth and Human Activity","pe":"MS-ESS3-2","topic":"Natural hazards","term":"Forecast","kw":"predict, warning","q":"Scientists study data from past hurricanes, ocean temperatures, and wind patterns to predict where a new hurricane will reach land. What are they doing?","c":["Causing a natural hazard","Building a Punnett square","Measuring biodiversity","Forecasting a natural hazard"],"a":3,"ex":"To forecast is to use data and patterns to predict a future event."},{"id":"MSV-16-10","bank":"Earth and Human Activity","pe":"MS-ESS3-2","topic":"Natural hazards","term":"Mitigate","kw":"reduce, lessen","q":"A town in an earthquake zone requires new buildings to have flexible steel frames so they are less likely to collapse. What is the town trying to do to earthquake damage?","c":["Forecast it","Encode it","Mitigate it","Increase it"],"a":2,"ex":"To mitigate is to reduce the severity or impact of something harmful."},{"id":"MSV-16-11","bank":"Earth and Human Activity","pe":"MS-ESS3-3","topic":"Reducing human impact","term":"Human impact","kw":"human activity, pollution, habitat loss","q":"After a forest is cleared to build a shopping center, nearby streams fill with mud and some animal species leave the area. What does this describe?","c":["A natural hazard","Natural selection","A lunar phase","Human impact on the environment"],"a":3,"ex":"Human impact is the effect of human activities on the natural environment."},{"id":"MSV-16-12","bank":"Earth and Human Activity","pe":"MS-ESS3-4","topic":"Population and consumption","term":"Per capita consumption","kw":"per person, consumption","q":"Country A and Country B have the same population, but the average person in Country A uses twice as much electricity. What is higher in Country A?","c":["Population size","Per capita consumption","Renewable resources","Biodiversity"],"a":1,"ex":"Per capita consumption is the average amount of a resource used per person."},{"id":"MSV-16-13","bank":"Earth and Human Activity","pe":"MS-ESS3-3","topic":"Reducing human impact","term":"Sustainability","kw":"sustainable, future generations","q":"A fishing town limits how many fish can be caught each year so that fish populations stay healthy for future generations. What is the town practicing?","c":["Extinction","Sustainability","Erosion","Artificial selection"],"a":1,"ex":"Sustainability means meeting today's needs without harming the ability of future generations to meet theirs."},{"id":"MSV-17-01","bank":"Engineering Design","pe":"MS-ETS1-1","topic":"Criteria and constraints","term":"Design solution","kw":"engineering, solution","q":"A town needs to keep a river from flooding nearby homes. Engineers propose building a levee along the riverbank. What is the levee?","c":["A criterion","A natural hazard","A design solution","A constraint"],"a":2,"ex":"A design solution is an engineered answer to a problem."},{"id":"MSV-17-02","bank":"Engineering Design","pe":"MS-ETS1-1","topic":"Criteria and constraints","term":"Criteria","kw":"criterion, requirements","q":"A class is designing a phone stand. It must hold a phone upright, keep the screen visible, and support at least 300 g. What are these requirements?","c":["Criteria","Trade-offs","Prototypes","Constraints"],"a":0,"ex":"Criteria are the requirements a design must meet to be successful."},{"id":"MSV-17-03","bank":"Engineering Design","pe":"MS-ETS1-1","topic":"Criteria and constraints","term":"Constraint","kw":"limits, budget","q":"Students designing a water filter can spend only $10 on materials and must finish in two class periods. What are the $10 limit and the time limit?","c":["Criteria","Constraints","Design solutions","Prototypes"],"a":1,"ex":"Constraints are limits on a design, such as cost, time, and materials."},{"id":"MSV-17-04","bank":"Engineering Design","pe":"MS-ETS1-4","topic":"Iterative testing","term":"Prototype","kw":"model, test version","q":"Before making 1,000 new bike helmets, a company builds on ve trait."},"MSV-11-08":{"meaning":"An anatomical similarity is a likeness in body structure between different organisms. It is evidence of common ancestry.","model":"The similar bones in a whale flipper and a human arm are an anatomical similarity that is evidence of common ancestry."},"MSV-11-09":{"meaning":"Embryological development is how an embryo grows and changes before birth or hatching. Similar patterns in different organisms are evidence of evolutionary relationships.","model":"Fish and human embryos look alike early in embryological development, which is evidence that they share a common ancestor."},"MSV-13-13":{"meaning":"Seafloor structure means the features of the ocean floor, such as mid-ocean ridges. These features are evidence of plate motion.","model":"The seafloor structure of a mid-ocean ridge is evidence of plate motion because new crust forms where plates move apart."},"MSV-14-05":{"meaning":"Earth's internal heat is the heat inside Earth, from its formation and from radioactive decay. It melts rock and drives volcanoes and plate motion.","model":"Earth's internal heat melts rock deep underground, which can erupt as a volcano."},"MSV-01-06":{"model":"A quantitative observation is a measurement expressed as a number, such as a mass of 12 grams."},"MSV-02-02":{"model":"An element, such as oxygen, is made of only one type of atom and cannot be broken down further."},"MSV-02-14":{"model":"Adding thermal energy to a substance increases the motion of its particles, so they move faster."},"MSV-05-09":{"model":"A good insulator slows the transfer of thermal energy, which is why foam cups keep hot drinks warm."},"MSV-07-03":{"model":"An organism is an individual living thing, such as one oak tree, one deer, or one bacterium."},"MSV-09-07":{"model":"A consumer gets energy by eating other organisms, so a deer is a consumer that eats plants."},"MSV-09-15":{"model":"In mutualism, both organisms benefit, such as a bee that gets food while it pollinates a flower."},"MSV-10-12":{"model":"Reproduction is how organisms produce offspring, and plants can do it with seeds or with runners."},"MSV-10-15":{"model":"The offspring are the young produced through reproduction, and they inherit traits from their parents."},"MSV-15-03":{"model":"Falling air pressure often signals stormy weather because it can mean a low pressure system is moving in."}};

const STOP=new Set("about after again also because before being between could does each from have into just made make many more most much only other over same should some such than that their them then there these they this those through very were what when where which while will with would your the and only type kind one two make like such take takes gets get give for are was has had its not but can out use used using".split(" "));
function stemOf(w){w=w.toLowerCase().replace(/[^a-z]/g,"");if(w.length<=4)return w;return w.replace(/(ing|ed|es|s|ly|al)$/,"").slice(0,Math.max(4,w.length-3))}
function words(t){return (t.toLowerCase().match(/[a-z']+/g)||[])}
function hasStem(textWords,stem){return textWords.some(w=>w.replace(/'/g,"").indexOf(stem)===0)}
function termStems(term){return term.toLowerCase().replace(/\(.*?\)/g," ").split(/[^a-z]+/).filter(w=>w.length>3&&!STOP.has(w)).map(stemOf)}
function kwStems(it){
  const tw=new Set(termStems(it.term));
  const src=[(it.kw||"").replace(/,/g," "),it.ex].join(" ");
  const out=new Set();
  words(src).forEach(w=>{if(w.length>=4&&!STOP.has(w)){const s=stemOf(w);if(!tw.has(s))out.add(s)}});
  return Array.from(out);
}
function checkSentence(it,text){
  const w=words(text);
  const ts=termStems(it.term);
  const usesTerm = ts.length>0 && ts.every(s=>hasStem(w,s));
  const longEnough = w.length>=8;
  const own=new Set(ts);
  const rel=kwStems(it).filter(s=>!own.has(s));
  const hasRel = rel.some(s=>hasStem(w,s)) ;
  return {usesTerm,longEnough,hasRel,count:w.length};
}

    if(u1)r.appendChild(paperDocLink("Open as a Google Doc",u1));
    if(u2)r.appendChild(paperDocLink("Open the answer key as a Google Doc",u2));
    if(u1||u2){docRow.appendChild(r);docRow.appendChild(h("p",{style:"margin:6px 0 0;font-size:.9rem"},"The Google Doc can be copied and edited. File, then Make a copy."))}
  };
  pick.addEventListener("change",upd);ck.addEventListener("change",upd);
  const go=print=>{
    const topics=cbs.filter(x=>x[1].checked).map(x=>x[0]);
    if(!topics.length){msg.textContent="Choose at least one topic.";return}
    if(!cq.checked&&!cs.checked&&!cu.checked){msg.textContent="Choose at least one thing to print.";return}
    msg.textContent="";
    const label=topics.length===1?topics[0]:(topics.length===TOPICS.length?"All topics":"Selected topics");
    renderPaper(topics,label,ck.checked,{quiz:cq.checked,study:cs.checked,use:cu.checked});
    if(print)paperReady.then(()=>window.print());
  };
  panel.append(
    h("h3",{style:"margin:0 0 6px"},"Topics to include"),
    h("div",{class:"row",style:"margin-bottom:8px"},
      h("button",{type:"button",class:"btn alt sm",onclick:()=>{cbs.forEach(x=>x[1].checked=true);upd()}},"Select all"),
      h("button",{type:"button",class:"btn alt sm",onclick:()=>{cbs.forEach(x=>x[1].checked=false);upd()}},"Clear")),
    pick,
    h("h3",{style:"margin:12px 0 6px"},"What to print"),
    h("p",null,lq,ls,lu),
    h("p",null,lk),
    h("div",{class:"row"},h("button",{type:"button",class:"btn",onclick:()=>go(true)},"Print"),h("button",{type:"button",class:"btn alt",onclick:()=>go(false)},"Preview")),
    docRow,msg);
  upd();
  card.append(h("p",{style:"margin:0"},"Want students off the computer? ",btn),panel);
  return card;
}

document.getElementById("startover").addEventListener("click",()=>{
  if(confirm("Clear your saved mastery and settings on this device?")){
    try{localStorage.removeItem(MKEY);localStorage.removeItem(PKEY)}catch(e){}
    mastery={};prefs={};sel={preset:DEFAULT_PRESET,topics:new Set(PRESETS[DEFAULT_PRESET].topics()),n:15};startScreen();
  }
});
if(typeof document!=="undefined"&&document.getElementById("app"))startScreen();
window.addEventListener("hashchange",paperFromHash);paperFromHash();
</script>

<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex"><!--fs-scaled-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Vocab Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{--bg:#F5F5F5;--ink:#273540;--muted:#4F4A5C;--mast:#0033A0;--lav:#0E68B3;--lav-deep:#0033A0;--lav-soft:#EEF2FA;--blue:#0E68B3;--blue-ink:#0B5A9C;--blue-soft:#E3EEF8;--line:#C7CDD1;--card:#fff;--ok:#1F6B3A;--ok-soft:#E1F1E6;--warn:#8A4B00;--warn-soft:#FBEBD3;--font:"Lato","Lato Extended","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mast{background:var(--mast);color:#fff}
.mast .in{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mast h1{font-size:1.25rem;margin:0;font-weight:600;letter-spacing:.2px}
.mast .org{font-size:.9rem;color:#FFFFFF}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin:0 0 16px}
.card h2{margin:0 0 8px;font-size:1.2rem;color:var(--lav-deep)}
.card h3{margin:14px 0 6px;font-size:1.02rem;color:var(--blue-ink)}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-left:1.3em}
li{margin-bottom:4px}
.btn{display:inline-block;border:2px solid var(--lav-deep);background:var(--lav-deep);color:#fff;border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{background:#3C3169}
.btn.alt{background:#fff;color:var(--lav-deep)}
.btn.alt:hover{background:var(--lav-soft)}
.btn.sm{padding:4px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--lav-soft);color:var(--lav-deep);border-radius:99px;padding:2px 11px;font-size:.85rem;font-weight:500;margin:0 6px 4px 0}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.bar{height:14px;background:var(--lav-soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--lav-deep);width:0;transition:width .3s}
textarea,input[type=text],input[type=date],input[type=number],select{background:#fff;border:2px solid #000;border-radius:4px;padding:8px 10px;width:100%}
input[type=number]{width:auto}
textarea{resize:vertical;min-height:90px}
label{font-weight:500}
.foot{max-width:1100px;margin:0 auto;padding:10px 16px 30px;color:var(--muted);font-size:.9rem}
.note{background:var(--blue-soft);border-left:5px solid var(--blue-ink);border-radius:4px;padding:10px 14px;margin:10px 0}
.warnbox{background:var(--warn-soft);border-left:5px solid var(--warn);border-radius:4px;padding:10px 14px;margin:10px 0}
table{border-collapse:collapse;max-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--lav-soft);color:var(--lav-deep)}
details>summary{cursor:pointer;font-weight:500;color:var(--lav-deep);padding:6px 0}
@media (max-width:600px){.card{padding:14px}.wrap{padding:14px 12px 30px}}

.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.preset{text-align:left;background:#fff;border:2px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;min-height:44px}
.preset b{display:block;color:var(--lav-deep)}
.preset span{font-size:.92rem;color:var(--muted)}
.preset[aria-pressed=true]{border-color:var(--lav-deep);background:var(--lav-soft);box-shadow:inset 0 0 0 1px var(--lav-deep)}
.preset[aria-pressed=true] b::before{content:"\2713  "}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;background:#fff;border:2px solid var(--blue-ink);border-radius:4px;padding:14px;cursor:pointer}
.mode:hover{background:var(--blue-soft)}
.mode b{display:block;color:var(--blue-ink);font-size:1.05rem}
.topics{columns:2 280px;column-gap:24px}
.topics label{display:block;font-weight:400;margin-bottom:6px;break-inside:avoid}
.topics input{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
.q{font-size:1.15rem;margin:8px 0 14px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;width:100%;min-height:48px}
.choice .l{flex:none;font-weight:700;color:var(--lav-deep);width:1.4em}
.choice:hover:not(:disabled){border-color:var(--lav-deep);background:var(--lav-soft)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .l::after{content:" \2713"}
.choice.wrong{border-color:var(--warn);background:var(--warn-soft)}
.choice.wrong .l::after{content:" \2715"}
.fb{margin-top:14px;padding:12px 14px;border-radius:4px;border-left:6px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.no{background:var(--warn-soft);border-color:var(--warn)}
.fb b.t{display:block}
.flip{width:100%;min-height:220px;background:#fff;border:3px solid var(--lav-deep);border-radius:4px;padding:24px;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.flip .term{font-size:2rem;font-weight:600;color:var(--lav-deep)}
.flip.back{background:var(--lav-soft)}
.flip .mean{font-size:1.2rem}
.flip .hint{font-size:.9rem;color:var(--muted)}
.crit{list-style:none;padding:0}
.crit li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.crit .ic{flex:none;font-weight:700;width:1.5em}
.modelbox{background:var(--blue-soft);border-left:5px solid var(--blue-ink);border-radius:4px;padding:10px 14px;margin:10px 0}
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.big{font-size:2rem;font-weight:600;color:var(--lav-deep)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.92rem;margin-bottom:8px}
.again li{margin-bottom:8px}
</style>
<style id="paper-css">
/* ===== Paper version (printable worksheet view, burple look, Calibri, 6-8 grade band) ===== */
#paper[hidden]{display:none!important}
body.paper-on{background:#8a8f94}
body.paper-on .mast,body.paper-on #app,body.paper-on .foot{display:none!important}
body.paper-on #paper{display:block}
.paper{font-family:Calibri,Carlito,"Lato",Arial,sans-serif;font-size:10.5pt;line-height:1.3;color:#1A160D;padding:16px 12px 40px}
.paper,.paper *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .ptools{max-width:8.5in;margin:0 auto 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:#fff;font-size:11pt}
.paper .ptools .btn{min-height:40px;text-decoration:none}
.paper .pdoc{background:#fff;max-width:8.5in;margin:0 auto;padding:.35in .5in;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.paper h1,.paper h2,.paper h3{font-family:inherit;font-weight:700;letter-spacing:0;line-height:1.25;margin:0 0 3px;text-shadow:none}
.paper h2{font-size:13pt;color:#6B9BCC;border-bottom:1px solid #6B9BCC;padding:0 0 2px;margin:6px 0 3px}
.paper h3{font-size:10.5pt;color:#7B6BAF;border:0;padding:0}
.paper p{margin:0 0 4px}
.paper ul{margin:0 0 4px;padding-left:1.3em;font-size:10pt}
.paper li{margin-bottom:1px}
.paper .pbar{background:#6B9BCC;color:#fff;padding:3px 14px;margin:0 0 2px;border:0;break-inside:avoid;page-break-inside:avoid}
.paper .pbar .l1{font-size:14pt;font-weight:700;line-height:1.25}
.paper .pbar .l2{font-size:10pt;font-weight:400;line-height:1.25;white-space:pre-wrap;margin-top:1px}
.paper .pchips{display:flex;gap:2px;margin:2px 0 4px;break-inside:avoid;page-break-inside:avoid}
.paper .pchip{flex:1 1 0;background:#E4DFEF;text-align:center;padding:3px 6px;border:0}
.paper .pchip .cl{font-size:9pt;font-weight:700;color:#7B6BAF;line-height:1.2}
.paper .pchip .cv{font-size:9pt;font-weight:700;color:#1A160D;line-height:1.2;margin-top:1px}
.paper .pname{margin:2px 0 6px;font-size:10.5pt;white-space:nowrap;color:#1A160D}
.paper .pdirs{font-size:10pt;margin:0 0 6px}
.paper .pdir{font-size:10pt;font-weight:400}
.paper .ptag{font-size:10pt;margin:0 0 3px}
.paper .ptask,.paper .pshort{margin:0 0 8px}
.paper .pq{margin:5px 0}
.paper .pq b,.paper .plabel b,.paper .pshort .pdir b{color:#7B6BAF}
.paper .pavoid,.paper .pblock,.paper .pcheck,.paper .pshort,.paper .pq{break-inside:avoid;page-break-inside:avoid}
.paper .plabel{margin:0 0 2px}
.paper .pcall{background:#E4DFEF;border:1px solid #E4DFEF;border-left:3px solid #7B6BAF;padding:2px 8px;font-size:10pt}
.paper .pcall b{color:#7B6BAF}
.paper .pstart{font-size:10pt;margin:0 0 3px}
.paper .wbox{background:#fff;border:1px solid #000;width:100%}
.paper .pblock{margin:0 0 6px}
.paper table{border-collapse:collapse;width:auto;max-width:100%;margin:0 0 5px;font-size:10pt}
.paper caption{caption-side:top;text-align:left;font-weight:700;padding:0 0 2px;color:#1A160D}
.paper th,.paper td{border:1px solid #CCCCCC;padding:2px 7px;text-align:left;background:#fff;color:#1A160D;font-weight:400;font-size:10pt}
.paper th{background:#D6E5F2;color:#6B9BCC;font-weight:700}
.paper td.plbl,.paper td.term{background:#D6E5F2;color:#1A160D;font-weight:700}
.paper .pgraph{margin:4px 0 5px}
.paper .pgraph svg{display:block;width:100%;max-width:4.6in;height:auto;background:#fff;border:1px solid #CCCCCC;margin:0 0 4px}
.paper .ptick{display:flex;gap:8px;align-items:flex-start;font-size:10pt;margin:0 0 2px}
.paper .pcheck h3{color:#7B6BAF}
.paper .tick{flex:none;display:inline-block;width:10px;height:10px;border:1px solid #000;margin-top:3px;background:#fff}
.paper .popt{margin:0 0 2px;padding-left:1.8em;text-indent:-1.8em;color:#1A160D;font-size:10pt}
.paper .popt b{color:#1A160D}
.paper .pkey,.paper .pkey p,.paper .pkey li{font-size:10pt}
.paper .pkey h3{font-size:13pt;color:#6B9BCC;border-bottom:1px solid #6B9BCC;padding-bottom:2px;margin:6px 0 3px;break-after:avoid;page-break-after:avoid}
.paper .pkey b{color:#7B6BAF}
.paper .pkey b.pans{color:#1A160D}
.paper .pkey .pcall{margin:0 0 4px}
.paper .pkitem{margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #E3DACB;break-inside:auto;page-break-inside:auto}
.paper .pkitem p,.paper .pkitem li,.paper .pkline,.paper .pkitem .pavoid,.paper .pkitem .pcall{break-inside:avoid;page-break-inside:avoid}
.paper .pforce{break-before:page;page-break-before:always}
.paper .ptask:not(.pspan) .pcont,.paper .ptask:not(.pspan) .ptwo,.paper .ptask.pspan .pone{display:none}
.paper .ppage2 .pcont,.paper .ppage2 .pblock{break-after:avoid;page-break-after:avoid}
.paper.pmeasure .pdoc{padding:0;max-width:none;width:7.5in;margin:0;box-shadow:none}
.paper .pcont{break-after:avoid;page-break-after:avoid}
.paper .ptask:not(.pvb) .pthree{display:none}
.paper .ptask.pvb .ptwo{display:none}
.paper .pshort{margin:0 0 5px}
.paper .pshort h2{margin:3px 0 2px}
.paper .pshort .popt{margin:0 0 1px}
@page{size:letter;margin:0.35in 0.5in 0.5in 0.5in;@bottom-center{content:counter(page);font-family:Calibri,Carlito,Arial,sans-serif;font-size:9pt;color:#666666;border-top:1px solid #E3DACB;width:7.5in;padding-top:2px;vertical-align:top}}
@media print{
 html,body.paper-on{background:#fff!important}
 body.paper-on .paper{padding:0}
 body.paper-on .paper .pdoc{box-shadow:none;padding:0;max-width:none;margin:0}
 body.paper-on .paper .ptools{display:none!important}
 .paper .pbreak{break-before:page;page-break-before:always}
}
@media screen{.paper:not(.pmeasure) .pbreak:not(tr),.paper:not(.pmeasure) .pforce:not(tr){margin-top:.5in;border-top:2px dashed #999;padding-top:.25in}}
.paper h2.ppart{margin:8px 0 3px;break-after:avoid;page-break-after:avoid}
.paper table.pstudy{width:100%;table-layout:fixed;margin:3px 0 6px;font-size:10pt}
.paper table.pstudy th,.paper table.pstudy td{vertical-align:top;padding:2px 6px}
.paper table.pstudy tr{break-inside:avoid;page-break-inside:avoid}
.paper table.pstudy thead{display:table-header-group}
.paper table.pstudy td.own{height:0.5in;background:#fff}
.paper table.puse td.own{height:0.7in}
.paper table.puse{break-inside:avoid;page-break-inside:avoid}
.paper .pqitem{margin:0 0 5px;break-inside:avoid;page-break-inside:avoid}
.paper .pqtext{margin:0 0 2px}
.paper .pqitem .popt{margin:0}
.paper .pkgrid{margin:2px 0 5px}
.paper .pkgrid th,.paper .pkgrid td{text-align:center;min-width:.36in;padding:1px 5px}
.paper .pkgrid td{font-weight:700}
.paper .pkline{margin:0 0 2px;padding-left:2.2em;text-indent:-2.2em}
.paper .ppick{columns:2 2.6in;column-gap:.3in}
.paper .ppick label{display:block;font-weight:400}
</style>
<style id="canvas-theme">

/* ====== CONFIG ====== */
const GRADE_LABEL = "Grade 7";            // header text, e.g. "Grade 8"
const DEFAULT_PRESET = "g7";      // one of: g8, rev, g7, qw, all
/* ====== DATA ====== */
const ITEMS = [{"id":"MSV-00-01","bank":"Question Words","pe":"SEP 4","topic":"Analyzing data","term":"Analyze","kw":null,"q":"A question says: \"Analyze the graph of plant height over 10 days.\" What should a strong answer do?","c":["Draw a new graph with different data","Describe the pattern in the data and use specific values from the graph","Copy the title of the graph and its axis labels","Explain why plants need sunlight without using the graph"],"a":1,"ex":"Analyzing means finding patterns or relationships in the data and supporting them with values from the source."},{"id":"MSV-00-02","bank":"Question Words","pe":"SEP 5","topic":"Math and computation","term":"Calculate","kw":null,"q":"A question asks you to calculate the density of a rock with a mass of 60 g and a volume of 20 cm³. Which response does what the question asks?","c":["Density is mass divided by volume.","The rock is dense because it sinks in water.","The rock has more mass than volume.","60 g ÷ 20 cm³ = 3 g/cm³"],"a":3,"ex":"Calculate asks for a number. A complete answer shows the setup, the result, and the units."},{"id":"MSV-00-03","bank":"Question Words","pe":"SEP 4","topic":"Analyzing data","term":"Compare","kw":null,"q":"Which response best compares a solid and a gas?","c":["A solid keeps its own shape and volume, and it is usually hard to the touch.","A gas spreads out to fill its whole container, and its particles move quickly.","Solids and gases are both states of matter, and both are made of tiny particles.","Both are made of particles, but particles in a solid vibrate in place while particles in a gas move freely and spread apart."],"a":3,"ex":"A comparison names how the things are alike and how they differ, and it describes both of them."},{"id":"MSV-00-04","bank":"Question Words","pe":"SEP 6","topic":"Constructing explanations","term":"Construct an explanation","kw":null,"q":"A question says: \"Construct an explanation for why the ice melted faster on the metal tray than on the plastic tray.\" Which response does this best?","c":["Metal is a good conductor, so thermal energy moved from the room-temperature tray into the ice faster than it did through plastic, and the ice melted faster.","Metal trays get colder than plastic trays, so cold from the metal moved into the ice and melted it faster.","Metal is shiny and reflects light onto the ice, and that extra light energy made the ice melt faster.","The ice on the metal tray melted in 4 minutes, but the ice on the plastic tray took 11 minutes."],"a":0,"ex":"An explanation tells what happened and uses a science idea to explain why it happened."},{"id":"MSV-00-05","bank":"Question Words","pe":"SEP 6","topic":"Constructing explanations","term":"Describe","kw":null,"q":"A question asks you to describe what happens to the temperature of water heated for 10 minutes, using the data table. Which response does what the question asks?","c":["Water is a liquid at room temperature and a gas when it boils.","The temperature rises from 20°C to 100°C and then stays at 100°C while the water boils.","The water boils because thermal energy from the stove is added to the water.","The temperature of the water changes during the 10 minutes."],"a":1,"ex":"Describe asks you to tell what happens, using details from the data."},{"id":"MSV-00-06","bank":"Question Words","pe":"SEP 7","topic":"Argument from evidence","term":"Evaluate","kw":null,"q":"A question says: \"Evaluate the two bridge designs using the criteria.\" What should the response include?","c":["A step-by-step description of how the team built each bridge","A judgment of which design better meets the criteria, with reasons tied to the test data","A drawing of a new bridge that combines parts of both designs","A list of the materials used to build each bridge and what each one cost"],"a":1,"ex":"Evaluating means making a judgment and supporting it with the criteria and the evidence."},{"id":"MSV-00-07","bank":"Question Words","pe":"SEP 3","topic":"Planning investigations","term":"Identify","kw":null,"q":"Students change the height of a ramp and measure how far a toy car rolls. A question asks you to identify the variable the students changed. What is the best response?","c":["The height of the ramp","Ramps make cars roll.","The distance the car rolls","The car went farther because the ramp was steeper."],"a":0,"ex":"Identify asks you to name the specific thing. The ramp height is what the students changed on purpose."},{"id":"MSV-00-08","bank":"Question Words","pe":"SEP 6","topic":"Constructing explanations","term":"Infer","kw":null,"q":"Scientists find fossils of fish and seashells in rock layers near the top of a mountain. Which statement is an inference?","c":["Seashell fossils were found on the mountain.","The rock layers contain fish fossils.","The mountain is made of rock.","The rock layers on the mountain were once under water."],"a":3,"ex":"The fossils are observations. Concluding that the area was once under water goes beyond what was observed, so it is an inference."},{"id":"MSV-00-09","bank":"Question Words","pe":"SEP 4","topic":"Analyzing data","term":"Interpret","kw":null,"q":"A graph shows that as the number of wolves in a park increased, the number of elk decreased. Which statement best interprets the graph?","c":["The y-axis shows the number of animals counted each year.","In the last year shown, about 100 wolves were counted in the park.","The graph has two lines, one for wolves and one for elk.","More wolves were likely eating more elk, so the elk population went down."],"a":3,"ex":"Interpreting means explaining what the data means, not just reading the labels or values."},{"id":"MSV-00-10","bank":"Question Words","pe":"SEP 7","topic":"Argument from evidence","term":"Justify","kw":null,"q":"A student chooses Design B for a lunch cooler. Which response justifies the choice?","c":["Design B used more foam than Design A, and it also took the longest to build.","Design B is the best choice because it worked better than Design A did.","Design B kept the drink coldest, 6°C after 3 hours compared to 12°C for Design A, so it best meets the goal of keeping food cold.","Coolers are designed to keep food and drinks cold, so Design B should be used."],"a":2,"ex":"Justifying means backing up a choice with evidence and reasoning."},{"id":"MSV-00-11","bank":"Question Words","pe":"SEP 2","topic":"Using models","term":"Predict","kw":null,"q":"Data show that a plant grows 2 cm each week. Which response is a prediction based on the data?","c":["Plants need sunlight to grow.","After 3 more weeks, the plant will be about 6 cm taller.","The plant is green.","The plant grew because it got water."],"a":1,"ex":"A prediction uses the pattern in the data to tell what will happen in the future."},{"id":"MSV-00-12","bank":"Question Words","pe":"SEP 7","topic":"Argument from evidence","term":"Support a claim","kw":null,"q":"Claim: Salt water freezes at a lower temperature than fresh water. Which evidence best supports the claim?","c":["Ocean water is salty, and people spread salt on icy roads in winter.","Fresh water and salt water were placed in the same freezer at the same time.","Ice cubes made from tap water are used to keep drinks cold at parties.","In the test, fresh water froze at 0°C, but salt water was still liquid at -5°C."],"a":3,"ex":"Supporting a claim means giving specific evidence that shows the claim is true."},{"id":"MSV-00-13","bank":"Question Words","pe":"SEP 2","topic":"Using models","term":"Use the model","kw":null,"q":"A model shows the Sun, Earth, and Moon. A question asks you to use the model to explain a lunar eclipse. Which response uses the model?","c":["Lunar eclipses happen a few times a year and can only be seen at night.","In the model, the Moon is between the Sun and Earth, so the Moon's shadow falls on Earth.","In the model, the Moon is smaller than Earth, and the Sun is the largest object.","In the model, Earth is directly between the Sun and the Moon, so Earth's shadow falls on the Moon."],"a":3,"ex":"Using a model means pointing to the parts of the model and their arrangement to explain what happens."},{"id":"MSV-00-14","bank":"Question Words","pe":"SEP 4","topic":"Analyzing data","term":"Based on the data","kw":null,"q":"A table shows that seeds watered daily grew 8 cm and seeds watered weekly grew 3 cm. Based on the data, which conclusion is best?","c":["Watering plants too much will kill them.","Seeds grow best in sunny windows.","All plants need fertilizer to grow.","Seeds watered daily grew more than seeds watered weekly."],"a":3,"ex":"\"Based on the data\" means the answer must come from the information given."},{"id":"MSV-01-01","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 3","topic":"Planning investigations","term":"Investigation","kw":null,"q":"Students wonder whether cup color affects how fast water warms in sunlight. They fill three cups of different colors with the same amount of water, set them in the sun, and record the temperature every 5 minutes. What are the students doing?","c":["Making a claim without evidence","Building an optimal design","Making a model of the Sun","Carrying out an investigation"],"a":3,"ex":"An investigation is a planned process of collecting data to answer a scientific question."},{"id":"MSV-01-02","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 3","topic":"Planning investigations","term":"Independent variable","kw":"manipulated variable, x-axis","q":"A student tests how the height of a ramp affects how far a toy car rolls. She uses ramp heights of 10 cm, 20 cm, and 30 cm and measures the distance the car travels. What is the ramp height in this investigation?","c":["The independent variable","A constraint","The dependent variable","A controlled variable"],"a":0,"ex":"The ramp height is the factor the student changes on purpose."},{"id":"MSV-01-03","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 3","topic":"Planning investigations","term":"Dependent variable","kw":"responding variable, y-axis","q":"Students give plants different amounts of fertilizer and measure each plant's height after two weeks. What is the plant height in this investigation?","c":["The independent variable","A criterion","A controlled variable","The dependent variable"],"a":3,"ex":"Plant height is measured to see how it responds to the change in fertilizer."},{"id":"MSV-01-04","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 3","topic":"Planning investigations","term":"Controlled variable","kw":"constant, fair test","q":"Students test which brand of paper towel absorbs the most water. To make the test fair, they use the same size towel and the same amount of water for every brand. What are the towel size and the amount of water?","c":["Independent variables","Claims","Controlled variables","Dependent variables"],"a":2,"ex":"Controlled variables are kept the same in every trial so that only the brand affects the results."},{"id":"MSV-01-05","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 4","topic":"Analyzing data","term":"Qualitative","kw":"observation, describe","q":"During a lab, a student writes: \"The solution turned cloudy and smelled like rotten eggs.\" What type of observation is this?","c":["Quantitative","Qualitative","Digitized","Calculated"],"a":1,"ex":"Qualitative observations describe qualities such as color, texture, or smell, not numbers."},{"id":"MSV-01-06","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 4","topic":"Analyzing data","term":"Quantitative","kw":"measurement, numbers","q":"A student examines a rock. Which observation is quantitative?","c":["The rock has a mass of 45 grams.","The rock feels heavy.","The rock sparkles in sunlight.","The rock is gray and rough."],"a":0,"ex":"Quantitative observations are measurements expressed as numbers."},{"id":"MSV-01-07","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 7","topic":"Argument from evidence","term":"Empirical evidence","kw":null,"q":"Two students disagree about which brand of insulated bottle keeps water cold longer. Which would give them empirical evidence to settle the question?","c":["Measuring the water temperature in each bottle every hour for a day","Reading the advertisements for each bottle","Asking classmates which bottle looks better","Choosing the bottle that costs more"],"a":0,"ex":"Empirical evidence comes from observations and measurements, like recorded temperatures."},{"id":"MSV-01-08","bank":"Science Practices and Crosscutting Ideas","pe":"CCC 1","topic":"Patterns","term":"Pattern","kw":"trend, cycle","q":"A student sketches the Moon every few days for two months and notices that the same sequence of shapes repeats about every 29 days. What has the student identified?","c":["A trade-off","A constraint","A controlled variable","A pattern"],"a":3,"ex":"A pattern is something that repeats in a predictable way, like the cycle of lunar phases."},{"id":"MSV-01-09","bank":"Science Practices and Crosscutting Ideas","pe":"CCC 2","topic":"Cause and effect","term":"Cause and effect","kw":"correlation, causation","q":"A town notices that ice cream sales and sunburns both rise in July. A student claims that eating ice cream causes sunburns. Which is the best reason this claim is weak?","c":["The claim is weak because more ice cream was sold than the number of sunburns reported.","Sunburns are caused by sunlight and ice cream is a food, so the two can never be related.","Both are likely caused by a third factor, hot sunny weather, so the data do not show cause and effect.","The claim must be strong, because both numbers rise during the same month every year."],"a":2,"ex":"Two things happening together does not prove that one causes the other. Sunny weather causes both."},{"id":"MSV-01-10","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 2","topic":"Using models","term":"Model","kw":"diagram, simulation, representation","q":"A student uses a lamp, a foam ball, and a pencil to show how the Moon's appearance changes as it orbits Earth. What is the student using?","c":["Empirical evidence","A constraint","A model","A controlled variable"],"a":2,"ex":"A model represents a system or process so it can be explained or used to make predictions."},{"id":"MSV-01-11","bank":"Science Practices and Crosscutting Ideas","pe":"CCC 4","topic":"Systems","term":"System","kw":null,"q":"A sealed jar contains soil, plants, insects, water, and air. Each part affects the others. How is the jar best described?","c":["A controlled variable","A system","A pattern","A single organism"],"a":1,"ex":"A system is a group of related parts that interact and work together as a whole."},{"id":"MSV-01-12","bank":"Science Practices and Crosscutting Ideas","pe":"CCC 7","topic":"Stability and change","term":"Stability","kw":null,"q":"A forest has had about the same numbers of deer, trees, and wolves for 50 years, even though the numbers rise and fall a little each year. What does this show?","c":["Stability","Erosion","Mutation","Extinction"],"a":0,"ex":"Stability means a system stays mostly the same over time."},{"id":"MSV-01-13","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 7","topic":"Argument from evidence","term":"Claim","kw":"CER","q":"A student writes: \"Plants grow taller with more light. In our test, plants given 12 hours of light grew 9 cm, but plants given 4 hours grew 3 cm. Light gives plants the energy they need for photosynthesis.\" Which sentence is the claim?","c":["Plants given 12 hours of light grew 9 cm.","Plants given 4 hours grew 3 cm.","Light gives plants the energy they need for photosynthesis.","Plants grow taller with more light."],"a":3,"ex":"The claim is the statement that answers the question. The measurements are evidence, and the last sentence is reasoning."},{"id":"MSV-01-14","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 7","topic":"Argument from evidence","term":"Evidence","kw":"CER, data","q":"Claim: Metal is a better conductor of thermal energy than wood. Which statement is the strongest evidence for this claim?","c":["Conductors are materials that let thermal energy move through them easily.","Metal is used to make pots and pans because cooks want food to heat up quickly.","Wooden spoons are often used for stirring because they do not scratch pots.","In a test, a metal spoon in hot water warmed by 15°C in 2 minutes, while a wooden spoon warmed by 2°C."],"a":3,"ex":"Evidence is specific data or observations that support the claim."},{"id":"MSV-01-15","bank":"Science Practices and Crosscutting Ideas","pe":"SEP 7","topic":"Argument from evidence","term":"Reasoning","kw":"CER, science idea","q":"Claim: A rock will sink in water. Evidence: The rock has a density of 2.7 g/cm³, and water has a density of 1 g/cm³. Which statement is the best reasoning?","c":["Density is found by dividing mass by volume.","Rocks are hard and heavy, so they always sink in water.","The rock's density is 2.7 g/cm³, which is 1.7 g/cm³ more than the density of water.","An object sinks in a liquid when its density is greater than the liquid's density, and 2.7 g/cm³ is greater than 1 g/cm³."],"a":3,"ex":"Reasoning uses a science idea to explain why the evidence supports the claim."},{"id":"MSV-02-01","bank":"Structure and Properties of Matter","pe":"MS-PS1-1","topic":"Atoms and molecules","term":"Atom","kw":null,"q":"A model shows the smallest particle of gold that still has the properties of gold. What does the model show?","c":["A cell","A compound","A mixture","An atom"],"a":3,"ex":"An atom is the smallest unit of an element that keeps the properties of that element."},{"id":"MSV-02-02","bank":"Structure and Properties of Matter","pe":"MS-PS1-1","topic":"Atoms and molecules","term":"Element","kw":"periodic table","q":"A sample of pure copper is examined, and every atom in it is a copper atom. How should the copper be classified?","c":["Mixture","Element","Compound","Solution"],"a":1,"ex":"An element is made of only one type of atom."},{"id":"MSV-02-03","bank":"Structure and Properties of Matter","pe":"MS-PS1-1","topic":"Atoms and molecules","term":"Molecule","kw":null,"q":"A model shows two hydrogen atoms bonded to one oxygen atom to form a single particle of water. What does the model represent?","c":["An extended structure","A mixture","An element","A molecule"],"a":3,"ex":"A molecule is a group of two or more atoms held together by chemical bonds."},{"id":"MSV-02-04","bank":"Structure and Properties of Matter","pe":"MS-PS1-1","topic":"Atoms and molecules","term":"Compound","kw":null,"q":"Carbon dioxide is made of carbon atoms and oxygen atoms chemically bonded together in a fixed ratio. How should carbon dioxide be classified?","c":["Mixture","Element","Compound","Solution"],"a":2,"ex":"A compound is a pure substance made of two or more types of atoms chemically bonded together."},{"id":"MSV-02-05","bank":"Structure and Properties of Matter","pe":"MS-PS1-1","topic":"Atoms and molecules","term":"Atomic composition","kw":null,"q":"Each molecule of methane (CH₄) has one carbon atom and four hydrogen atoms. What does \"one carbon atom and four hydrogen atoms\" describe?","c":["The density of methane","The phase of methane","The temperature of methane","The atomic composition of methane"],"a":3,"ex":"Atomic composition is the types and numbers of atoms that make up a substance."},{"id":"MSV-02-06","bank":"Structure and Properties of Matter","pe":"MS-PS1-1","topic":"Atoms and molecules","term":"Extended structure","kw":"crystal, lattice","q":"A model of table salt shows sodium and chlorine atoms arranged in a repeating pattern that continues in every direction, forming a crystal. What does the model show?","c":["A simple molecule","An extended structure","A mixture","A single atom"],"a":1,"ex":"An extended structure is a large, repeating arrangement of atoms, like a crystal."},{"id":"MSV-02-07","bank":"Structure and Properties of Matter","pe":"MS-PS1-2","topic":"Evidence of chemical reactions","term":"Substance","kw":null,"q":"Iron, water, and sugar each have a specific makeup and their own set of properties that are the same in every sample. What is each one?","c":["A solution","A mixture","An organism","A substance"],"a":3,"ex":"A substance is a type of matter with a specific composition and set of properties."},{"id":"MSV-02-08","bank":"Structure and Properties of Matter","pe":"MS-PS1-4","topic":"Particle motion and phase change","term":"Pure substance","kw":null,"q":"A student measures the melting point of a white solid. Every sample melts at exactly 80°C. What does this evidence suggest about the solid?","c":["It is a pure substance.","It is a gas.","It is a solution.","It is a mixture of several solids."],"a":0,"ex":"A pure substance has properties, like melting point, that stay the same in every sample."},{"id":"MSV-02-09","bank":"Structure and Properties of Matter","pe":"MS-PS1-2","topic":"Evidence of chemical reactions","term":"Property","kw":"characteristic, identify","q":"To identify an unknown liquid, a student measures its boiling point and density and observes its color. What is the student measuring and observing?","c":["Properties","Mutations","Constraints","Reactants"],"a":0,"ex":"Properties are characteristics that can be observed or measured and used to identify substances."},{"id":"MSV-02-10","bank":"Structure and Properties of Matter","pe":"MS-PS1-7","topic":"Density (NYS-only)","term":"Density","kw":"mass, volume, g/cm3","q":"Two cubes are the same size. Cube A has a mass of 20 g, and Cube B has a mass of 80 g. Which statement is correct?","c":["The cubes have the same density because they are the same size.","Density cannot be compared without knowing the colors.","Cube A has the greater density.","Cube B has the greater density."],"a":3,"ex":"Density is mass divided by volume. With the same volume, more mass means greater density."},{"id":"MSV-02-11","bank":"Structure and Properties of Matter","pe":"MS-PS1-8","topic":"Mixtures (NYS-only)","term":"Mixture","kw":"separate, magnet","q":"A student combines sand, salt, and iron filings in a cup. She separates them using a magnet, then water and a filter, and then evaporation. What does this show about the original material?","c":["It was a new substance formed by a chemical reaction.","It was a mixture of substances that were physically combined.","It was a single pure substance.","It was an element."],"a":1,"ex":"A mixture can be separated by physical means because its substances are not chemically bonded."},{"id":"MSV-02-12","bank":"Structure and Properties of Matter","pe":"MS-PS1-8","topic":"Mixtures (NYS-only)","term":"Solution","kw":"dissolve","q":"A spoonful of sugar is stirred into water until it disappears and the liquid looks the same throughout. What has formed?","c":["A solution","A new compound","A pure substance","An element"],"a":0,"ex":"A solution is a mixture in which one substance dissolves evenly in another."},{"id":"MSV-02-13","bank":"Structure and Properties of Matter","pe":"MS-PS1-8","topic":"Mixtures (NYS-only)","term":"Filtration","kw":"filter, separate","q":"A student pours muddy water through a coffee filter. Clear water drips through, and the soil stays on the filter. What separation method is this?","c":["Condensation","Evaporation","Filtration","Magnetic attraction"],"a":2,"ex":"Filtration separates a mixture by trapping larger particles while smaller ones pass through."},{"id":"MSV-02-14","bank":"Structure and Properties of Matter","pe":"MS-PS1-4","topic":"Particle motion and phase change","term":"Particle motion","kw":null,"q":"A pot of water is heated on a stove. The water is still made of the same molecules, but a thermometer shows its temperature rising. What is changing?","c":["Atomic composition","The number of atoms","Particle motion","The type of substance"],"a":2,"ex":"Adding thermal energy increases particle motion."},{"id":"MSV-02-15","bank":"Structure and Properties of Matter","pe":"MS-PS1-4","topic":"Particle motion and phase change","term":"Phase (state of matter)","kw":"solid, liquid, gas, state of matter","q":"A particle model shows molecules that are close together but sliding past one another. Which phase does the model show?","c":["Mixture","Solid","Gas","Liquid"],"a":3,"ex":"In a liquid, particles are close together but can move past each other."},{"id":"MSV-02-16","bank":"Structure and Properties of Matter","pe":"MS-PS1-4","topic":"Particle motion and phase change","term":"Pressure","kw":null,"q":"A scuba diver's ears hurt more as she swims deeper, because more water is pushing on each square centimeter of her body. What is increasing?","c":["The density of her ears","Pressure","Mass","Temperature"],"a":1,"ex":"Pressure is the amount of force applied over an area."},{"id":"MSV-02-17","bank":"Structure and Properties of Matter","pe":"MS-PS1-3","topic":"Synthetic materials","term":"Synthetic material","kw":"human-made, plastic","q":"Nylon is made in factories from chemicals that come from petroleum. It does not occur in nature. What is nylon?","c":["A synthetic material","An element","A mineral resource","A natural resource"],"a":0,"ex":"Synthetic materials are made by humans through chemical processes, often from natural resources."},{"id":"MSV-03-01","bank":"Chemical Reactions","pe":"MS-PS1-2","topic":"Evidence of chemical reactions","term":"Chemical reaction","kw":null,"q":"Baking soda and vinegar are mixed. Bubbles of gas form, and the substances left over have different properties from the starting materials. What happened?","c":["A physical process","A phase change","Filtration","A chemical reaction"],"a":3,"ex":"In a chemical reaction, substances change into new substances with different properties."},{"id":"MSV-03-02","bank":"Chemical Reactions","pe":"MS-PS1-5","topic":"Conservation of mass","term":"Reactant","kw":null,"q":"In the reaction iron + oxygen → rust, what are iron and oxygen?","c":["Solutions","Mixtures","Reactants","Products"],"a":2,"ex":"Reactants are the starting substances in a chemical reaction."},{"id":"MSV-03-03","bank":"Chemical Reactions","pe":"MS-PS1-5","topic":"Conservation of mass","term":"Product","kw":null,"q":"When wood burns, it combines with oxygen and forms carbon dioxide, water vapor, and ash. What are the carbon dioxide, water vapor, and ash?","c":["Reactants","Controlled variables","Products","Elements"],"a":2,"ex":"Products are the new substances formed by a chemical reaction."},{"id":"MSV-03-04","bank":"Chemical Reactions","pe":"MS-PS1-5","topic":"Conservation of mass","term":"Conservation of mass","kw":"conserved, law of conservation","q":"A sealed bag holding baking soda and vinegar has a total mass of 50 g before the two react. After the reaction, the bag is puffed up with gas. What will the mass of the sealed bag most likely be?","c":["50 g, because no atoms entered or left the bag","More than 50 g, because new gas was created","0 g, because the reactants were used up","Less than 50 g, because gas has no mass"],"a":0,"ex":"Atoms are rearranged, not created or destroyed, so the mass stays the same in a closed system."},{"id":"MSV-03-05","bank":"Chemical Reactions","pe":"MS-PS1-2","topic":"Evidence of chemical reactions","term":"Physical process","kw":"physical change","q":"Ice cream left on a counter melts into a puddle. The puddle is still made of the same substances as the ice cream. What kind of change is this?","c":["Photosynthesis","A mutation","A chemical reaction","A physical process"],"a":3,"ex":"A physical process changes the form of matter without making a new substance."},{"id":"MSV-04-01","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Force","kw":"push, pull","q":"A soccer player kicks a ball, and the ball speeds up and changes direction. What caused the change in the ball's motion?","c":["The ball's speed","The ball's mass","A force","A frame of reference"],"a":2,"ex":"A force is a push or pull. It can change an object's speed or direction."},{"id":"MSV-04-02","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Net force","kw":"total force, newtons","q":"Two students pull on opposite sides of a box. One pulls right with 50 N, and the other pulls left with 30 N. What is the net force on the box?","c":["0 N","20 N to the right","30 N to the left","80 N to the right"],"a":1,"ex":"Net force combines all the forces: 50 N right minus 30 N left equals 20 N to the right."},{"id":"MSV-04-03","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Balanced forces","kw":"Newton's First Law, net force zero","q":"A book rests on a table without moving. Gravity pulls it down, and the table pushes up with the same strength. Which describes the forces on the book?","c":["A net force downward","A collision","Balanced forces","Unbalanced forces"],"a":2,"ex":"Balanced forces are equal and opposite, so the net force is zero and the motion does not change."},{"id":"MSV-04-04","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Unbalanced forces","kw":"Newton's Second Law, acceleration","q":"A sled at rest at the top of a hill starts sliding faster and faster down the hill. What must be acting on the sled?","c":["Balanced forces","No forces","Unbalanced forces","A frame of reference"],"a":2,"ex":"Unbalanced forces produce a net force that changes an object's motion."},{"id":"MSV-04-05","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Mass","kw":null,"q":"The same push is given to an empty shopping cart and a full shopping cart. The empty cart speeds up much more. What explains the difference?","c":["The full cart has more mass.","The full cart has less mass.","The forces on the empty cart are balanced.","The empty cart has more gravity."],"a":0,"ex":"With the same force, an object with more mass has a smaller change in motion."},{"id":"MSV-04-06","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Speed","kw":"distance, time, m/s","q":"A runner travels 100 meters in 20 seconds. What is the runner's speed?","c":["0.2 meters per second","5 meters per second","120 meters per second","2,000 meters per second"],"a":1,"ex":"Speed equals distance divided by time: 100 m ÷ 20 s = 5 m/s."},{"id":"MSV-04-07","bank":"Forces and Motion","pe":"MS-PS2-2","topic":"Forces and motion","term":"Frame of reference","kw":"reference point, relative motion","q":"A passenger sits still on a moving train. To the passenger, the person in the next seat is not moving. To someone standing on the platform, both passengers are moving fast. Why do the two observers describe the motion differently?","c":["They are using different frames of reference.","The passengers have different masses.","The forces on the passengers are unbalanced.","The train has no net force on it."],"a":0,"ex":"Whether something is moving depends on the frame of reference used to describe it."},{"id":"MSV-04-08","bank":"Forces and Motion","pe":"MS-PS2-1","topic":"Newton's Third Law","term":"Collision","kw":"collide, crash, impact","q":"A small car and a large truck collide head-on. Which statement about the forces during the collision is correct?","c":["The truck pushes on the car with a larger force.","The car and the truck push on each other with forces of equal strength.","Only the truck exerts a force.","The car pushes on the truck with a larger force."],"a":1,"ex":"In a collision, the objects exert equal and opposite forces on each other. The car's motion changes more because it has less mass."},{"id":"MSV-04-09","bank":"Forces and Motion","pe":"MS-PS2-1","topic":"Newton's Third Law","term":"Newton's Third Law","kw":"action reaction, equal and opposite","q":"A swimmer pushes backward on the wall of a pool and glides forward. Which idea best explains why the swimmer moves forward?","c":["Newton's Third Law: the wall pushes forward on the swimmer with an equal force.","Gravity: Earth pulls the swimmer forward.","Conservation of mass: the swimmer's mass stays the same.","Balanced forces: the forces on the swimmer cancel out."],"a":0,"ex":"When the swimmer pushes on the wall, the wall pushes back on the swimmer with an equal and opposite force."},{"id":"MSV-04-10","bank":"Forces and Motion","pe":"MS-PS2-4","topic":"Gravity and mass","term":"Gravity","kw":null,"q":"An astronaut drops a hammer on the Moon, and it falls toward the Moon's surface. What force pulls the hammer down?","c":["Magnetic force","Electric force","Air pressure","Gravity"],"a":3,"ex":"Gravity is an attractive force between all objects that have mass."},{"id":"MSV-04-11","bank":"Forces and Motion","pe":"MS-PS2-4","topic":"Gravity and mass","term":"Gravitational interaction","kw":null,"q":"Which change would increase the gravitational pull between two objects?","c":["Changing the color of the objects","Decreasing the mass of both objects","Increasing the mass of one of the objects","Moving the objects farther apart"],"a":2,"ex":"Gravitational interactions are stronger when the objects have more mass and when they are closer together."},{"id":"MSV-04-12","bank":"Forces and Motion","pe":"MS-PS2-3","topic":"Electric and magnetic forces","term":"Electric charge","kw":"static electricity, positive, negative","q":"After a student rubs a balloon on her hair, the balloon and her hair attract each other. What best explains this?","c":["The balloon and her hair now have opposite electric charges.","The balloon and her hair now have the same electric charge.","The balloon became a magnet.","Gravity between the balloon and her hair increased."],"a":0,"ex":"Opposite charges attract. Rubbing moves charge so the balloon and hair become oppositely charged."},{"id":"MSV-04-13","bank":"Forces and Motion","pe":"MS-PS2-3","topic":"Electric and magnetic forces","term":"Electric force","kw":null,"q":"Two charged balloons hanging from strings push apart. When they are moved closer together, they push apart even more. What does this show?","c":["Electric force gets stronger as charged objects get closer.","Electric force gets weaker as charged objects get closer.","Electric force only acts when objects touch.","Electric force depends on the color of the objects."],"a":0,"ex":"The strength of an electric force depends on the amount of charge and the distance between the objects."},{"id":"MSV-04-14","bank":"Forces and Motion","pe":"MS-PS2-3","topic":"Electric and magnetic forces","term":"Magnetic force","kw":"magnet, attract, repel","q":"A paper clip jumps to a magnet before the magnet touches it. What causes this?","c":["Magnetic force","Electric current","Air pressure","Thermal energy"],"a":0,"ex":"A magnetic force is a push or pull that can act at a distance."},{"id":"MSV-04-15","bank":"Forces and Motion","pe":"MS-PS2-3","topic":"Electric and magnetic forces","term":"Electromagnet","kw":"coil, motor, generator","q":"A student wraps wire around an iron nail and connects the wire to a battery. The nail picks up paper clips. When she adds more coils of wire, it picks up even more. What did she build?","c":["A prototype of a battery","An electromagnet","A parallel circuit","An insulator"],"a":1,"ex":"An electromagnet uses electric current through a coil of wire. More coils make it stronger."},{"id":"MSV-04-16","bank":"Forces and Motion","pe":"MS-PS2-5","topic":"Fields","term":"Field","kw":"magnetic field, electric field, gravitational field, non-contact","q":"Iron filings sprinkled around a bar magnet form curved lines from one end of the magnet to the other, even though the filings are not touching the magnet. What do the lines show?","c":["The electric current in the magnet","The mass of the magnet","The magnetic field around the magnet","The thermal energy of the magnet"],"a":2,"ex":"A field is a region where a force can act on objects without contact."},{"id":"MSV-05-01","bank":"Energy","pe":"MS-PS3-5","topic":"Energy transfer and motion","term":"Energy","kw":null,"q":"Wind spins a turbine, and the turbine's generator lights homes in a town. What does the moving air give to the turbine that makes this possible?","c":["Density","Energy","Atoms","Mass"],"a":1,"ex":"Energy is the ability to cause change. The moving air transfers energy to the turbine."},{"id":"MSV-05-02","bank":"Energy","pe":"MS-PS3-1","topic":"Kinetic energy","term":"Kinetic energy","kw":"motion energy","q":"Two bowling balls have the same mass. Ball A rolls at 2 m/s, and Ball B rolls at 6 m/s. Which statement is correct?","c":["Ball A has more kinetic energy because it is moving slower.","Both balls have the same kinetic energy because they have the same mass.","Neither ball has kinetic energy because they are on the ground.","Ball B has more kinetic energy because it is moving faster."],"a":3,"ex":"Kinetic energy depends on mass and speed. With equal mass, the faster ball has more."},{"id":"MSV-05-03","bank":"Energy","pe":"MS-PS3-2","topic":"Potential energy","term":"Potential energy","kw":"stored energy, position","q":"A roller coaster car is pulled to the top of a tall hill and pauses before dropping. Which type of energy does the car have more of at the top than at any other point on the ride?","c":["Electric energy","Kinetic energy","Gravitational potential energy","Thermal energy from friction"],"a":2,"ex":"Gravitational potential energy depends on position. The higher the car, the more it has."},{"id":"MSV-05-04","bank":"Energy","pe":"MS-PS3-5","topic":"Energy transfer and motion","term":"Work","kw":null,"q":"A student pushes a heavy box 3 meters across the floor. Which describes what happened?","c":["No work was done, because the box was too heavy to lift off the floor.","Work was done, because a force moved the box in the direction of the force.","No energy was transferred, because the box stopped moving at the end.","Work was done only if the student felt tired after pushing the box."],"a":1,"ex":"Work is done when a force moves an object in the direction of the force, which transfers energy."},{"id":"MSV-05-05","bank":"Energy","pe":"MS-PS3-3","topic":"Thermal energy transfer design","term":"Energy transfer","kw":null,"q":"A metal spoon is placed in a cup of hot cocoa. After a minute, the handle of the spoon feels warm. What happened?","c":["Mass moved from the cocoa into the spoon.","Cold moved from the spoon into the cocoa.","Thermal energy was transferred from the cocoa to the spoon.","The spoon created new thermal energy."],"a":2,"ex":"Thermal energy moves from warmer objects to cooler ones. \"Cold\" is not something that moves."},{"id":"MSV-05-06","bank":"Energy","pe":"MS-PS3-4","topic":"Temperature and thermal energy","term":"Thermal energy","kw":"heat","q":"A bathtub of warm water (40°C) is compared to a cup of hot water (80°C). Which has more thermal energy?","c":["The cup, because it has a higher temperature","The bathtub, because it has far more moving particles","They have the same thermal energy.","Neither, because liquids have no thermal energy"],"a":1,"ex":"Thermal energy is the total energy of all the particles, so a large amount of water can have more even at a lower temperature."},{"id":"MSV-05-07","bank":"Energy","pe":"MS-PS3-4","topic":"Temperature and thermal energy","term":"Temperature","kw":"thermometer, degrees, average kinetic energy","q":"A thermometer in a pot of soup rises from 30°C to 70°C. What does this tell you about the particles in the soup?","c":["They became a different substance.","Their average motion increased.","Their mass decreased.","Their number increased."],"a":1,"ex":"Temperature measures the average kinetic energy of the particles."},{"id":"MSV-05-08","bank":"Energy","pe":"MS-PS3-3","topic":"Thermal energy transfer design","term":"Conductor","kw":"metal, conduct","q":"A cook wants a pot that heats food quickly and evenly. Which material should the pot be made of?","c":["Glass, because the cook can see the food through it","Foam, because it is light and easy to lift","Copper, because it is a good conductor of thermal energy","Wood, because it does not get hot to the touch"],"a":2,"ex":"Conductors let thermal energy move through them easily."},{"id":"MSV-05-09","bank":"Energy","pe":"MS-PS3-3","topic":"Thermal energy transfer design","term":"Insulator","kw":"insulation, insulate","q":"Students are designing a lunch box that keeps food cold for 4 hours. Which material should they use for the walls?","c":["Thin glass, because it lets light through","Iron, because it is heavy","Aluminum, because it is a conductor","Foam, because it is an insulator that slows thermal energy transfer"],"a":3,"ex":"Insulators slow the transfer of thermal energy."},{"id":"MSV-05-10","bank":"Energy","pe":"MS-PS3-6","topic":"Electric circuits (NYS-only)","term":"Electric current","kw":"electricity, flow of charge","q":"When a switch is closed, a light bulb in a circuit turns on. What is flowing through the wires to light the bulb?","c":["Electric current","Thermal insulation","Air pressure","A magnetic field"],"a":0,"ex":"Electric current is the flow of electric charge, which transfers energy to the bulb."},{"id":"MSV-05-11","bank":"Energy","pe":"MS-PS3-6","topic":"Electric circuits (NYS-only)","term":"Circuit component","kw":"battery, wire, switch, bulb, resistor","q":"A flashlight has a bulb, wires, a switch, and one battery. A student adds a second battery, and the bulb glows brighter. What did the student add?","c":["The wavelength","The medium","A circuit component","An insulator"],"a":2,"ex":"Circuit components include batteries, wires, switches, and bulbs. Changing them changes how energy is transferred."},{"id":"MSV-05-12","bank":"Energy","pe":"MS-PS3-6","topic":"Electric circuits (NYS-only)","term":"Series circuit","kw":null,"q":"Three bulbs and a battery are connected in a single loop. When one bulb burns out, all the bulbs go dark. What type of circuit is this?","c":["Parallel circuit","Electromagnet","Series circuit","Digitized signal"],"a":2,"ex":"A series circuit has only one path, so a break anywhere stops the current."},{"id":"MSV-05-13","bank":"Energy","pe":"MS-PS3-6","topic":"Electric circuits (NYS-only)","term":"Parallel circuit","kw":null,"q":"The lights in a house are wired so that when one bulb burns out, the other lights stay on. What type of circuit is this?","c":["Parallel circuit","Insulator","Electromagnet","Series circuit"],"a":0,"ex":"A parallel circuit has more than one path for current, so the other paths keep working."},{"id":"MSV-06-01","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Wave","kw":null,"q":"A pebble dropped into a pond makes ripples that spread outward. A floating leaf bobs up and down but does not move toward the shore. What do the ripples carry across the pond?","c":["Energy, not the water itself","The leaf to the shore","Water from the center of the pond to the shore","Mass from the pebble to the leaf"],"a":0,"ex":"A wave is a disturbance that transfers energy without carrying matter along with it."},{"id":"MSV-06-02","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Medium","kw":null,"q":"Astronauts on a spacewalk cannot hear each other talk without radios, even when they are very close. Why?","c":["Sound travels much too fast in space for human ears to hear it.","Sound needs a medium to travel through, and space has almost no air.","Sound waves are electromagnetic waves, which space suits block.","Space reflects sound waves away before they can reach another person."],"a":1,"ex":"Sound is a mechanical wave, so it needs a medium to travel through."},{"id":"MSV-06-03","bank":"Waves and Information","pe":"MS-PS4-2","topic":"Light and waves in materials","term":"Mechanical wave","kw":"sound, seismic","q":"During an earthquake, energy travels through rock and shakes buildings far away. What kind of wave moves through the rock?","c":["Light from the Sun","A radio wave","A digitized signal","A mechanical wave"],"a":3,"ex":"Mechanical waves travel through a medium, such as rock, water, or air."},{"id":"MSV-06-04","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Transverse wave","kw":"crest, trough","q":"A student shakes one end of a rope up and down. The rope moves up and down while the wave travels along it toward a wall. What type of wave is this?","c":["Electric current","Digitized signal","Transverse wave","Longitudinal wave"],"a":2,"ex":"In a transverse wave, the material moves at a right angle to the direction the wave travels."},{"id":"MSV-06-05","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Longitudinal wave","kw":"compression, sound wave","q":"A student pushes and pulls one end of a stretched spring toy. Sections of the coils bunch together and spread apart as the wave moves along the spring. What type of wave is this?","c":["Electromagnetic wave","Transverse wave","Longitudinal wave","Analog signal"],"a":2,"ex":"In a longitudinal wave, the material moves back and forth in the same direction the wave travels."},{"id":"MSV-06-06","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Amplitude","kw":"wave height, loudness, energy","q":"A musician plucks a guitar string gently, then plucks it hard. The second sound is louder. What property of the sound wave increased?","c":["Frequency","Amplitude","Medium","Wavelength"],"a":1,"ex":"A greater amplitude means the wave carries more energy, which makes a louder sound."},{"id":"MSV-06-07","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Wavelength","kw":"crest to crest","q":"On a diagram of a wave, a student measures the distance from one crest to the next crest. What is the student measuring?","c":["Wavelength","Frequency","Amplitude","Speed"],"a":0,"ex":"Wavelength is the distance from one point on a wave to the same point on the next wave."},{"id":"MSV-06-08","bank":"Waves and Information","pe":"MS-PS4-1","topic":"Wave properties","term":"Frequency","kw":"waves per second, pitch, hertz","q":"A student shakes a rope so that 4 waves pass a point each second. Then she shakes it faster, so that 8 waves pass the point each second. What changed?","c":["The amplitude increased.","The medium changed.","The wave became longitudinal.","The frequency increased."],"a":3,"ex":"Frequency is the number of waves that pass a point each second."},{"id":"MSV-06-09","bank":"Waves and Information","pe":"MS-PS4-2","topic":"Light and waves in materials","term":"Electromagnetic radiation","kw":"light, electromagnetic wave","q":"Energy from the Sun reaches Earth by traveling through the nearly empty space between them. What form does this energy travel in?","c":["Ocean currents","Sound waves","Electromagnetic radiation","Mechanical waves"],"a":2,"ex":"Electromagnetic radiation, such as light, can travel through empty space."},{"id":"MSV-06-10","bank":"Waves and Information","pe":"MS-PS4-2","topic":"Light and waves in materials","term":"Reflect","kw":"reflection, mirror","q":"A student sees her face in a still pond. What is the light doing at the surface of the water?","c":["Reflecting","Being encoded","Turning into sound","Being completely absorbed"],"a":0,"ex":"To reflect means to bounce back from a surface."},{"id":"MSV-06-11","bank":"Waves and Information","pe":"MS-PS4-2","topic":"Light and waves in materials","term":"Absorb","kw":"absorption","q":"On a sunny day, a black car feels much hotter than a white car. What best explains this?","c":["The black car absorbs more light energy.","The black car has more mass.","The white car transmits more heat.","The black car reflects more light energy."],"a":0,"ex":"Dark surfaces absorb more light, and the absorbed energy becomes thermal energy."},{"id":"MSV-06-12","bank":"Waves and Information","pe":"MS-PS4-2","topic":"Light and waves in materials","term":"Transmit","kw":"transmission, transparent","q":"Sunlight passes through a clear glass window and lights up a room. What is the glass doing to the light?","c":["Transmitting it","Absorbing all of it","Reflecting all of it","Encoding it"],"a":0,"ex":"To transmit is to let energy, such as light, pass through a material."},{"id":"MSV-06-13","bank":"Waves and Information","pe":"MS-PS4-2","topic":"Light and waves in materials","term":"Refract","kw":"refraction, bend","q":"A pencil standing in a glass of water looks bent where it enters the water. What causes this?","c":["Light is absorbed by the water.","Sound waves travel through the water.","Light refracts as it passes from water into air.","The pencil actually bends in water."],"a":2,"ex":"Light bends when it passes from one material into another."},{"id":"MSV-06-14","bank":"Waves and Information","pe":"MS-PS4-3","topic":"Digital and analog signals","term":"Analog signal","kw":null,"q":"A vinyl record stores music as a groove whose shape changes smoothly and continuously, matching the sound wave. What type of signal is this?","c":["Field","Digitized signal","Analog signal","Electric charge"],"a":2,"ex":"An analog signal varies continuously and smoothly, like the original wave."},{"id":"MSV-06-15","bank":"Waves and Information","pe":"MS-PS4-3","topic":"Digital and analog signals","term":"Digitized signal","kw":"digital, binary","q":"Photos from a Mars rover are stored as numbers and sent to Earth. Even with some interference, the images arrive clearly. Why is this type of signal used?","c":["Digitized signals have a larger amplitude.","Analog signals cannot travel through space.","Digitized signals do not need energy.","Digitized signals are a more reliable way to send information."],"a":3,"ex":"Digitized signals encode information as numbers, which makes them more reliable to send and store."},{"id":"MSV-06-16","bank":"Waves and Information","pe":"MS-PS4-3","topic":"Digital and analog signals","term":"Encode","kw":"encoding","q":"A phone turns a person's voice into a pattern of numbers so it can be sent to another phone. What is the phone doing to the voice?","c":["Encoding it","Absorbing it","Refracting it","Reflecting it"],"a":0,"ex":"To encode is to convert information into a format for storing or sending."},{"id":"MSV-07-01","bank":"Cells and Body Systems","pe":"MS-LS1-1","topic":"Cells and living things","term":"Living thing","kw":"characteristics of life, alive","q":"A student finds a small green spot on a rock. Which evidence would best show that it is alive?","c":["It is green.","It is attached to a rock.","It is made of cells and grows over time.","It feels wet."],"a":2,"ex":"Living things are made of cells, use energy, grow, reproduce, and respond to their environment."},{"id":"MSV-07-02","bank":"Cells and Body Systems","pe":"MS-LS1-1","topic":"Cells and living things","term":"Non-living thing","kw":"nonliving","q":"A crystal in a cave gets larger over hundreds of years as minerals build up on it. Why is the crystal still classified as non-living?","c":["It grows too slowly over the years to count as being alive.","It is too hard and rigid for anything inside it to be alive.","It is not made of cells and does not use energy or reproduce.","It is found underground, where living things cannot survive."],"a":2,"ex":"Non-living things lack the characteristics of life, such as being made of cells. Getting bigger is not enough."},{"id":"MSV-07-03","bank":"Cells and Body Systems","pe":"MS-LS1-1","topic":"Cells and living things","term":"Organism","kw":null,"q":"A pond sample contains an amoeba, a frog, some algae, and a water lily. What is each of these?","c":["An organism","An organ","A body system","A tissue"],"a":0,"ex":"An organism is an individual living thing."},{"id":"MSV-07-04","bank":"Cells and Body Systems","pe":"MS-LS1-1","topic":"Cells and living things","term":"Cell","kw":null,"q":"Using a microscope, a student sees that onion skin, cheek lining, and pond algae are all made of tiny units, each surrounded by a membrane. What are these units?","c":["Molecules","Cells","Atoms","Organs"],"a":1,"ex":"Cells are the basic unit of structure and function in all living things."},{"id":"MSV-07-05","bank":"Cells and Body Systems","pe":"MS-LS1-1","topic":"Cells and living things","term":"Unicellular","kw":"single-celled, one cell","q":"Under a microscope, a student watches a paramecium. Its entire body is a single cell that eats, moves, and reproduces. How is the paramecium described?","c":["A tissue","Unicellular","Multicellular","Non-living"],"a":1,"ex":"A unicellular organism is made of only one cell."},{"id":"MSV-07-06","bank":"Cells and Body Systems","pe":"MS-LS1-1","topic":"Cells and living things","term":"Multicellular","kw":"many cells","q":"An oak tree is made of trillions of cells, including root cells, leaf cells, and bark cells that do different jobs. How is the oak tree described?","c":["Multicellular","Non-living","A single organ","Unicellular"],"a":0,"ex":"Multicellular organisms are made of many cells, often of different types."},{"id":"MSV-07-07","bank":"Cells and Body Systems","pe":"MS-LS1-2","topic":"Cell parts and function","term":"Cell membrane","kw":"plasma membrane, organelle","q":"A cell takes in water and nutrients and gets rid of waste through its outer boundary, which controls what goes in and out. What cell part is this?","c":["Nucleus","Chloroplast","Mitochondria","Cell membrane"],"a":3,"ex":"The cell membrane controls what enters and leaves the cell."},{"id":"MSV-07-08","bank":"Cells and Body Systems","pe":"MS-LS1-2","topic":"Cell parts and function","term":"Cell wall","kw":"plant cell, organelle","q":"Plant cells keep their boxy shape, but animal cells do not. Which cell part gives plant cells this extra support?","c":["Cell membrane","Nucleus","Mitochondria","Cell wall"],"a":3,"ex":"The cell wall is a stiff layer that supports plant cells. Animal cells do not have one."},{"id":"MSV-07-09","bank":"Cells and Body Systems","pe":"MS-LS1-2","topic":"Cell parts and function","term":"Nucleus","kw":"DNA, organelle, nuclei","q":"Scientists remove a structure from a cell, and the cell can no longer direct its activities or divide. The structure held the cell's DNA. Which part was removed?","c":["Cell membrane","Chloroplast","Cell wall","Nucleus"],"a":3,"ex":"The nucleus holds genetic information and directs the cell's activities."},{"id":"MSV-07-10","bank":"Cells and Body Systems","pe":"MS-LS1-2","topic":"Cell parts and function","term":"Chloroplast","kw":"photosynthesis, organelle","q":"Cells from a leaf have green structures that capture light energy to make sugar. Cells from the plant's roots, which grow underground, do not have them. What are these structures?","c":["Cell walls","Mitochondria","Nuclei","Chloroplasts"],"a":3,"ex":"Chloroplasts are where photosynthesis happens, so they are found in the parts of a plant that get light."},{"id":"MSV-07-11","bank":"Cells and Body Systems","pe":"MS-LS1-2","topic":"Cell parts and function","term":"Mitochondria","kw":"mitochondrion, cellular respiration, organelle","q":"Muscle cells, which use a lot of energy, have many more of a certain cell part than skin cells do. Which part is it most likely to be?","c":["Chloroplasts","Mitochondria","Cell membranes","Cell walls"],"a":1,"ex":"Mitochondria release energy from food through cellular respiration, so cells that use a lot of energy have more of them."},{"id":"MSV-07-12","bank":"Cells and Body Systems","pe":"MS-LS1-3","topic":"Body systems","term":"Tissue","kw":null,"q":"A group of similar muscle cells works together to contract and help the heart pump. What is this group of cells?","c":["An organ","An organism","A tissue","A body system"],"a":2,"ex":"A tissue is a group of similar cells that work together to do one job."},{"id":"MSV-07-13","bank":"Cells and Body Systems","pe":"MS-LS1-3","topic":"Body systems","term":"Organ","kw":null,"q":"The stomach is made of muscle tissue, nerve tissue, and lining tissue working together to break down food. What is the stomach?","c":["A tissue","An organ","A cell","An organism"],"a":1,"ex":"An organ is made of different tissues working together."},{"id":"MSV-07-14","bank":"Cells and Body Systems","pe":"MS-LS1-3","topic":"Body systems","term":"Body system","kw":"organ system, subsystem","q":"The heart, blood vessels, and blood work together to carry oxygen and nutrients around the body. What do these parts make up?","c":["A single tissue","A single cell","An ecosystem","A body system"],"a":3,"ex":"A body system is a group of organs that work together to do a major job."},{"id":"MSV-07-15","bank":"Cells and Body Systems","pe":"MS-LS1-3","topic":"Body systems","term":"Homeostasis","kw":"stable internal conditions, balance","q":"During a long run, a person's body temperature starts to rise. The person sweats, and the heart pumps more blood to the skin, which cools the body. What is the body doing?","c":["Carrying out photosynthesis","Reproducing","Undergoing a mutation","Maintaining homeostasis"],"a":3,"ex":"Homeostasis is keeping internal conditions stable. Several body systems work together to do it."},{"id":"MSV-07-16","bank":"Cells and Body Systems","pe":"MS-LS1-8","topic":"Senses and the brain","term":"Stimulus","kw":"stimuli, response","q":"A cat's pupils shrink when a bright flashlight shines in its eyes. What is the bright light?","c":["A stimulus","A sensory receptor","A body system","A trait"],"a":0,"ex":"A stimulus is something in the environment that causes a response."},{"id":"MSV-07-17","bank":"Cells and Body Systems","pe":"MS-LS1-8","topic":"Senses and the brain","term":"Sensory receptor","kw":"senses, nerve, brain","q":"Special cells in a person's nose detect the smell of smoke and send signals to the brain. The person gets up to check the kitchen. What are these special cells?","c":["Stimuli","Muscle tissue","Sensory receptors","Chloroplasts"],"a":2,"ex":"Sensory receptors detect stimuli and send signals to the brain."},{"id":"MSV-08-01","bank":"Growth and Energy in Organisms","pe":"MS-LS1-6","topic":"Photosynthesis","term":"Photosynthesis","kw":"sunlight, carbon dioxide, oxygen, sugar","q":"A plant in a sealed jar placed in sunlight takes in carbon dioxide and water and releases oxygen while making sugar. What process is the plant carrying out?","c":["Condensation","Photosynthesis","Erosion","Cellular respiration"],"a":1,"ex":"Photosynthesis uses light energy to turn carbon dioxide and water into sugar and oxygen."},{"id":"MSV-08-02","bank":"Growth and Energy in Organisms","pe":"MS-LS1-6","topic":"Photosynthesis","term":"Glucose","kw":"sugar, food molecule","q":"A plant stores energy from sunlight in molecules it makes from carbon dioxide and water. A rabbit eats the plant and breaks down those molecules for energy. What are these molecules?","c":["Oxygen","Water","Glucose","Carbon dioxide"],"a":2,"ex":"Glucose is the sugar made during photosynthesis that stores energy organisms can later release."},{"id":"MSV-08-03","bank":"Growth and Energy in Organisms","pe":"MS-LS1-7","topic":"Food and cellular respiration","term":"Cellular respiration","kw":"respiration, mitochondria, energy release","q":"During exercise, a student breathes faster, taking in more oxygen and giving off more carbon dioxide. Her muscle cells use the oxygen to release energy from food. What process is happening in her cells?","c":["Evaporation","Pollination","Cellular respiration","Photosynthesis"],"a":2,"ex":"Cellular respiration uses oxygen to break down food and release energy, producing carbon dioxide."},{"id":"MSV-08-04","bank":"Growth and Energy in Organisms","pe":"MS-LS1-5","topic":"Factors in growth","term":"Environmental factor","kw":null,"q":"Two genetically identical bean plants are grown. One gets plenty of water, and the other gets very little. The well-watered plant grows twice as tall. What best explains the difference?","c":["An environmental factor, the amount of water","Artificial selection by the person growing them","A mutation that happened in the taller plant","A genetic factor, the genes the plants inherited"],"a":0,"ex":"The plants have the same genes, so the difference in growth comes from an environmental factor."},{"id":"MSV-08-05","bank":"Growth and Energy in Organisms","pe":"MS-LS1-5","topic":"Factors in growth","term":"Genetic factor","kw":null,"q":"A Great Dane puppy and a Chihuahua puppy get the same food, care, and space. The Great Dane grows much larger. What best explains the difference?","c":["An environmental factor","Homeostasis","A genetic factor","Pollination"],"a":2,"ex":"With the same environment, the difference in size comes from inherited genes."},{"id":"MSV-08-06","bank":"Growth and Energy in Organisms","pe":"MS-LS1-4","topic":"Reproductive success","term":"Pollination","kw":"pollen, flower, pollinator, reproduction","q":"A hummingbird visits a red flower to drink nectar. Pollen sticks to its head and is carried to the next flower it visits. How does this help the plant?","c":["It protects the plant's seeds from harmful mutations.","It removes extra nectar so the flower does not rot.","It gives the plant the glucose it needs to grow taller.","It pollinates the plant, increasing the chance that seeds will form."],"a":3,"ex":"Pollination moves pollen between flowers so that seeds can form."},{"id":"MSV-09-01","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Ecosystem","kw":null,"q":"A coral reef includes fish, coral, algae, sea turtles, sunlight, salt water, and sand, all interacting. What is the coral reef?","c":["An ecosystem","A single organism","A body system","A population"],"a":0,"ex":"An ecosystem is a community of organisms interacting with each other and with the non-living parts of their environment."},{"id":"MSV-09-02","bank":"Ecosystems","pe":"MS-LS2-1","topic":"Resources and populations","term":"Biotic factor","kw":"living factor","q":"A student lists parts of a forest: oak trees, mushrooms, deer, rocks, and rainfall. Which group contains only biotic factors?","c":["Oak trees, mushrooms, deer","Rocks, rainfall","Oak trees, rocks, rainfall","Mushrooms, rocks, deer"],"a":0,"ex":"Biotic factors are the living parts of an ecosystem."},{"id":"MSV-09-03","bank":"Ecosystems","pe":"MS-LS2-1","topic":"Resources and populations","term":"Abiotic factor","kw":"non-living factor","q":"A pond's water temperature rises 5°C during a heat wave, and the fish population drops. What kind of factor affected the fish?","c":["A genetic factor","A biotic factor","A producer","An abiotic factor"],"a":3,"ex":"Water temperature is a non-living, or abiotic, factor."},{"id":"MSV-09-04","bank":"Ecosystems","pe":"MS-LS2-1","topic":"Resources and populations","term":"Population","kw":null,"q":"A scientist counts all the gray squirrels living in a city park this year. What is the scientist counting?","c":["An ecosystem","Biodiversity","A population","A community of many species"],"a":2,"ex":"A population is a group of the same species living in the same area."},{"id":"MSV-09-05","bank":"Ecosystems","pe":"MS-LS2-1","topic":"Resources and populations","term":"Resource availability","kw":"limiting factor, food, water, space","q":"After two years of drought, there is less grass on a prairie, and the number of prairie dogs drops. What caused the change in the prairie dog population?","c":["Lower resource availability","Mutualism","Higher biodiversity","Artificial selection"],"a":0,"ex":"When resources such as food and water are limited, populations often decrease."},{"id":"MSV-09-06","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Producer","kw":"autotroph, plant","q":"In a pond, algae use sunlight to make their own food, and tiny animals eat the algae. What role do the algae play?","c":["Decomposer","Producer","Consumer","Predator"],"a":1,"ex":"Producers make their own food using energy from sunlight."},{"id":"MSV-09-07","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Consumer","kw":"herbivore, carnivore, omnivore","q":"An owl gets its energy by eating mice. What role does the owl play in the ecosystem?","c":["Decomposer","Abiotic factor","Consumer","Producer"],"a":2,"ex":"Consumers get energy by eating other organisms."},{"id":"MSV-09-08","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Decomposer","kw":"fungi, bacteria, decay","q":"A fallen log slowly breaks apart as mushrooms grow on it, and nutrients return to the soil. What role do the mushrooms play?","c":["Producer","Predator","Decomposer","Abiotic factor"],"a":2,"ex":"Decomposers break down dead matter and return nutrients to the soil."},{"id":"MSV-09-09","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Food web","kw":"food chain, energy flow, arrows","q":"A model shows arrows from grass to rabbits, from grass to mice, from rabbits to foxes, and from mice to foxes. What does the model show?","c":["A water cycle showing how water moves through an ecosystem","A rock cycle showing how rocks change over long periods","A Punnett square showing how traits pass to offspring","A food web showing how energy moves through an ecosystem"],"a":3,"ex":"A food web shows feeding relationships, and the arrows show the direction energy flows."},{"id":"MSV-09-10","bank":"Ecosystems","pe":"MS-LS2-3","topic":"Matter and energy in ecosystems","term":"Flow of energy","kw":"energy pyramid, one direction","q":"In the food chain grass → grasshopper → frog → snake, only a small part of the energy in the grass reaches the snake. Which best describes how energy moves in this ecosystem?","c":["Energy moves from the snake back to the grasshopper.","Energy is recycled back to the grass by the snake.","Each consumer creates new energy.","Energy flows in one direction, and much of it leaves the food chain as heat at each step."],"a":3,"ex":"Energy flows one way through an ecosystem. At each st

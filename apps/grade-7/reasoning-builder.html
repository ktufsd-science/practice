<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex"><!--fs-scaled-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reasoning Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{
  --bg:#F5F5F5; --ink:#273540; --muted:#58526A; --mast:#0033A0; --lav:#0E68B3; --lav-deep:#0033A0; --lav-soft:#EEF2FA;
  --blue:#0E68B3; --blue-ink:#0B5A9C; --blue-soft:#E3EEF8; --line:#C7CDD1; --sand:#EFE6D6; --sand-line:#B9A987;
  --ok:#1F6B45; --ok-soft:#DCEFE3; --warn-soft:#FBEFD5; --warn-ink:#7A4B00;
  --font:"Lato","Lato Extended","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
.mast{background:var(--mast);color:#fff}
.mast .in{max-width:940px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand small{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#FFFFFF;font-weight:500}
.brand b{font-size:19px;font-weight:700}
.mnav{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{background:transparent;border:1.5px solid #FFFFFF;color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;min-height:40px}
.mbtn:hover{background:rgba(255,255,255,.14)}
main{max-width:940px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{line-height:1.2;margin:0 0 8px}
h2{font-size:19px} h3{font-size:16px}
p{margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-bottom:16px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--lav-deep);color:#fff;border:2px solid var(--lav-deep);border-radius:4px;padding:10px 18px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{background:#3d3269}
.btn.ghost{background:#fff;color:var(--lav-deep)}
.btn.ghost:hover{background:var(--lav-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;border:1px solid var(--line);background:#fff;white-space:nowrap}
.chip.unit{background:var(--lav-soft);border-color:var(--lav-soft);color:var(--lav-deep)}
.chip.pe{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue-ink)}
.chip.done{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.ic{width:18px;height:18px;vertical-align:-3px;flex:0 0 auto}
/* home */
.units{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.unitbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:42px}
.unitbtn[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:#fff;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--lav-deep);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 16px;cursor:pointer;font-weight:500;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--lav-deep);color:#fff;font-weight:600}
.prog{height:12px;border-radius:999px;background:var(--lav-soft);overflow:hidden;margin:6px 0}
.prog span{display:block;height:100%;background:var(--lav-deep)}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.trow{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:#fff}
.trow h3{margin:0 0 4px;font-size:15px}
details.tnote{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 18px}
details.tnote summary{cursor:pointer;font-weight:600;color:var(--blue-ink)}
/* task */
.setup .label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lav-deep);margin:12px 0 2px}
.given{border-left:5px solid var(--blue);background:var(--blue-soft);border-radius:0 4px 4px 0;padding:10px 14px;margin:6px 0}
.given.claim{border-left-color:var(--lav);background:var(--lav-soft)}
.given ul{margin:4px 0 0;padding-left:20px}
table.data{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
table.data caption{text-align:left;font-weight:600;padding-bottom:6px}
table.data th,table.data td{border:1px solid #8a84a0;padding:6px 10px;text-align:left}
table.data thead th{background:var(--lav-soft)}
.tablewrap{overflow-x:auto}
.chartwrap{margin:8px 0}
.chartwrap svg{width:100%;height:auto;max-width:620px;display:block;background:#fff;border:1px solid var(--line);border-radius:4px}
.steps{display:flex;gap:8px;list-style:none;margin:0 0 14px;padding:0;flex-wrap:wrap}
.steps li{flex:1 1 150px;border:1.5px solid var(--line);border-radius:4px;padding:8px 12px;background:#fff;font-weight:500;font-size:13px;display:flex;gap:8px;align-items:center}
.steps li .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--lav-soft);font-weight:700;font-size:12px;flex:0 0 auto}
.steps li[aria-current="step"]{border-color:var(--lav-deep);background:var(--lav-soft)}
.steps li[aria-current="step"] .n{background:var(--lav-deep);color:#fff}
.steps li.done .n{background:var(--ok);color:#fff}
.choices{display:grid;gap:10px;margin:10px 0}
.choice{display:flex;gap:12px;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:4px;padding:12px 14px;cursor:pointer;min-height:56px;align-items:flex-start}
.choice:hover{border-color:var(--lav)}
.choice .k{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--lav-soft);font-weight:700;flex:0 0 auto}
.choice.tried{border-style:dashed;border-color:#8a84a0}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice .st{display:block;font-size:12px;font-weight:600;margin-top:4px}
.fb{border-radius:4px;padding:12px 16px;margin:10px 0;border:2px solid var(--line);background:#fff}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.try{border-color:var(--warn-ink);background:var(--warn-soft)}
.fb:focus{outline:3px solid var(--blue-ink)}
.fb b.h{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.pieces{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.piece{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:4px;padding:10px 12px}
.piece.locked{border-color:var(--ok);background:var(--ok-soft)}
.piece .pos{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--lav-deep);color:#fff;font-weight:700}
.mv{display:flex;gap:6px}
.mv button{border:1.5px solid var(--lav-deep);background:#fff;border-radius:4px;min-width:44px;min-height:44px;cursor:pointer;font-weight:600;color:var(--lav-deep);padding:0 10px}
.mv button:hover:not([disabled]){background:var(--lav-soft)}
.mv button[disabled]{opacity:.35;cursor:not-allowed}
.rolechip{display:block;font-size:12px;font-weight:600;color:var(--ok)}
textarea.write{width:100%;min-height:150px;background:#fff;border:2px solid #000;border-radius:4px;padding:12px;font-size:15px;line-height:1.55;resize:vertical}
.starters{background:var(--sand);border:1px solid var(--sand-line);border-radius:4px;padding:10px 14px;margin:8px 0}
.starters ul{margin:4px 0 0;padding-left:20px}
.crit{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:22px 1fr;gap:10px;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:#fff}
.crit li.met{border-color:var(--ok);background:var(--ok-soft)}
.crit li.notyet{border-color:var(--warn-ink);background:var(--warn-soft)}
.crit .lab{font-weight:600}
.band{border-radius:4px;padding:10px 14px;margin:8px 0;border:2px solid}
.band .t{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.band.e{background:var(--blue-soft);border-color:var(--blue)}
.band.i{background:var(--lav-soft);border-color:var(--lav)}
.band.l{background:var(--sand);border-color:var(--sand-line)}
.selfchk{list-style:none;padding:0;margin:8px 0}
.selfchk li{margin:6px 0}
.selfchk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:36px}
.selfchk input{width:22px;height:22px;accent-color:var(--lav-deep);flex:0 0 auto;margin-top:2px}
.weak{background:var(--warn-soft);border:2px solid var(--warn-ink);border-radius:4px;padding:12px 16px;margin:8px 0;font-size:15px}
.note{font-size:12px;color:var(--muted)}
.limit{font-size:12px;border:1px dashed #8a84a0;border-radius:4px;padding:8px 12px;background:#fff;margin:8px 0}
.explain{border:2px solid var(--lav-deep)}
footer{max-width:940px;margin:0 auto;padding:6px 16px 28px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.linkbtn{background:none;border:0;color:var(--blue-ink);text-decoration:underline;cursor:pointer;padding:6px 2px;min-height:36px}
@media (max-width:560px){ .piece{grid-template-columns:30px 1fr} .piece .mv{grid-column:1 / -1} .card{padding:14px} }
@media print{ .mast,.mnav,footer,.btn{display:none} body{background:#fff} }
</style>
<style id="paper-css">
/* ===== Paper version (printable worksheet) ===== */
@page{size:letter;margin:0.35in 0.5in 0.5in 0.5in;
  @bottom-left{content:"";border-top:1px solid #E3DACB;margin:0 0 0 0}
  @bottom-right{content:"";border-top:1px solid #E3DACB}
  @bottom-center{content:counter(page);font-family:Calibri,Carlito,"Lato",Arial,sans-serif;font-size:9pt;color:#666666;border-top:1px solid #E3DACB;vertical-align:top;padding-top:4px}}
#pmeasure{position:absolute;left:-10000px;top:0;width:7.5in;visibility:hidden}
body.paper-on .paper .sheet.m{padding:0;width:7.5in;max-width:none;margin:0;box-shadow:none}
#paperOpts[hidden]{display:none}
#paperOpts{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#paperOpts .pbox{background:#fff;border:1px solid #8D959F;border-radius:4px;padding:20px 22px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
#paperOpts h2{margin:0 0 10px}
#paperOpts label.pl{display:block;font-weight:700;margin:12px 0 4px}
#paperOpts select{width:100%;font-size:16px;min-height:42px}
#paperOpts .pck{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
#paperOpts .pck input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:#0033A0}
#paperOpts .row{margin-top:16px}
#paperOpts a.btn{display:inline-block;text-decoration:none;text-align:center}
#paperOpts [hidden]{display:none !important}
#paperOpts .pdocs{margin-top:4px}
#paperOpts .pdocs .row{margin-top:10px}
body.paper-on .paper .paper-bar a.btn{display:inline-block;text-decoration:none}
body.paper-on{background:#d9dbdd}
body.paper-on .mast,body.paper-on main,body.paper-on footer,body.paper-on #paperOpts{display:none}
body.paper-on #paper{display:block;padding:12px 8px 28px}
body.paper-on .paper{font-family:Calibri,Carlito,"Lato",Arial,sans-serif;font-size:10.5pt;line-height:1.25;color:#1A160D}
body.paper-on .paper,body.paper-on .paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.paper-on .paper .paper-bar{width:8.5in;max-width:100%;margin:0 auto 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-family:"Lato",Arial,sans-serif;font-size:15px}
body.paper-on .paper .sheet{background:#fff;color:#1A160D;width:8.5in;max-width:100%;margin:14px auto;padding:0.35in 0.5in;box-shadow:0 1px 6px rgba(0,0,0,.35)}
body.paper-on .paper .sheet{line-height:var(--lh,1.25)}
body.paper-on .paper .hbar{background:#6B9BCC;color:#fff;padding:3px 10px;margin:0 0 2px;border:0}
body.paper-on .paper .chips{display:flex;margin:0 0 6px}
body.paper-on .paper .chip9{flex:1 1 0;min-width:0;background:#E4DFEF;text-align:center;padding:3px 6px;border:0;border-left:2px solid #fff;font-size:9pt;line-height:1.2}
body.paper-on .paper .chip9:first-child{border-left:0}
body.paper-on .paper .chip9 .cl{font-weight:700;color:#7B6BAF;display:block}
body.paper-on .paper .chip9 .cv{font-weight:700;color:#1A160D;display:block;margin-top:1px}
body.paper-on .paper .hbar .l1{font-size:14pt;font-weight:700;line-height:1.25;color:#fff}
body.paper-on .paper .hbar .l2{font-size:10pt;font-weight:400;line-height:1.3;white-space:pre-wrap;color:#fff}
body.paper-on .paper h2{font-size:13pt;font-weight:700;line-height:1.25;margin:0 0 4px;padding-bottom:2px;color:#6B9BCC;border-bottom:1px solid #6B9BCC;letter-spacing:0}
body.paper-on .paper h3{font-size:11.5pt;font-weight:700;line-height:1.25;margin:0 0 3pt;color:#7B6BAF;letter-spacing:0}
body.paper-on .paper h3.kt{font-size:13pt;color:#6B9BCC;border-bottom:1px solid #6B9BCC;padding-bottom:2px;margin:6px 0 4px}
body.paper-on .paper p{margin:0 0 5pt}
.paper .nameline{margin:0 0 7pt;white-space:pre-wrap}
.paper .nameline.small{font-size:10.5pt;text-align:right}
.paper .dir{font-size:10.5pt;margin:0 0 6pt}
.paper .remind{background:#E4DFEF;border:1px solid #7B6BAF;border-left:3px solid #7B6BAF;padding:5pt 8pt;margin:0 0 8px;font-size:10.5pt;line-height:1.3}
.paper .remind b.t{display:block;font-size:11.5pt;margin-bottom:1pt;color:#7B6BAF}
.paper .remind div{margin:0}
.paper .unitline{font-size:10pt;font-weight:400;margin:0 0 0 6pt;white-space:nowrap;color:#1A160D}
.paper .lb{font-weight:700;color:#7B6BAF}
.paper .lbl{font-size:11.5pt;font-weight:700;margin:6pt 0 2pt;color:#7B6BAF}
.paper .ro .lbl{margin-top:0}
.paper .blk{break-inside:avoid;page-break-inside:avoid;margin:0 0 6px;position:relative}
.paper .blk.p1{margin-bottom:var(--g1,6px)}
.paper .blk.p2{margin-bottom:var(--g2,6px)}
.paper .blk.pb::before{content:"";position:absolute;left:0;right:0;top:-5px;border-top:1px dashed #999}
.paper .ro{background:#E4DFEF;border:1px solid #7B6BAF;border-left:3px solid #7B6BAF;padding:4pt 8pt;margin:0 0 4pt}
.paper .ro ul{margin:0;padding-left:16pt}
.paper .ro li{margin:1pt 0}
.paper table.data{border-collapse:collapse;width:100%;font-size:10pt;margin:3pt 0;table-layout:auto}
.paper table.data caption{text-align:left;font-weight:700;padding-bottom:3pt;font-size:10pt;color:#1A160D}
.paper table.data th,.paper table.data td{border:1px solid #CCCCCC;padding:var(--tp,4px) 5pt;text-align:left;color:#1A160D;background:#fff;line-height:1.3}
.paper table.data thead th{background:#D6E5F2;color:#6B9BCC;font-weight:700}
.paper table.data tbody th{background:#D6E5F2;color:#1A160D;font-weight:700}
.paper .tablewrap{overflow:visible}
.paper .note{font-size:10pt;color:#000;margin:2pt 0}
.paper .chartwrap{margin:4pt 0}
.paper .chartwrap svg{width:auto;max-width:100%;height:var(--ch,173px);overflow:visible;display:block;background:#fff;border:0;border-radius:0}
.paper h3.st,body.paper-on .paper h3.st{display:inline;margin:0 6pt 0 0}
.paper h3.st + .dirs{display:inline}
.paper .ce{display:flex;gap:10pt;align-items:stretch}
.paper .cecol{flex:1 1 0;min-width:0;margin:0;padding-top:var(--cp,5px);padding-bottom:var(--cp,5px)}
.paper .dirs{font-size:10.5pt;margin:0 0 4pt}
.paper .dirs b{font-weight:400}
.paper .opt{display:flex;gap:8pt;align-items:flex-start;margin:0 0 var(--og,3px);break-inside:avoid;page-break-inside:avoid}
.paper .opt .lt{flex:0 0 18pt;font-weight:700}
.paper .pc{display:flex;gap:8pt;align-items:center;margin:0 0 3pt;break-inside:avoid;page-break-inside:avoid}
.paper .numbox{flex:0 0 var(--nb,0.38in);width:var(--nb,0.38in);height:var(--nb,0.38in);border:1px solid #000;background:#fff}
.paper .wbox{border:1px solid #000;background:#fff;height:2in;margin:3pt 0 5pt}
.paper .wbox.short{height:1.7in}
.paper .chk{list-style:none;margin:2pt 0 0;padding:0;font-size:10pt;column-count:2;column-gap:14pt}
.paper .chk li{display:flex;gap:7pt;align-items:flex-start;margin:0 0 2pt;break-inside:avoid;page-break-inside:avoid}
.paper .tick{flex:0 0 0.15in;width:0.15in;height:0.15in;border:1px solid #000;background:#fff;margin-top:2pt}
.paper .weakbox{background:#E4DFEF;border:1px solid #7B6BAF;border-left:3px solid #7B6BAF;padding:5pt 8pt;margin:0 0 8pt}
.paper .weakbox .lbl{margin-top:0}
.paper .key{font-size:10.5pt;line-height:1.3}
.paper .key ol,.paper .key li{font-size:10pt}
.paper .keyitem{padding:0 0 3pt;margin:0 0 8px}
.paper .keyitem p,.paper .keyitem li{break-inside:avoid;page-break-inside:avoid;orphans:2;widows:2}
.paper .keyitem h3.kt{break-after:avoid;page-break-after:avoid}
.paper .keyitem p{margin:0 0 2pt}
.paper .keyitem ol{margin:1pt 0 2pt;padding-left:18pt}
.paper .keyitem li{margin:0}
@media (max-width:700px){body.paper-on .paper .sheet{padding:0.25in}}
@media print{
  body.paper-on{background:#fff !important}
  body.paper-on #paper{padding:0}
  body.paper-on .paper .paper-bar{display:none}
  body.paper-on .paper .sheet{box-shadow:none;margin:0;padding:0;width:auto;max-width:none;break-before:page;page-break-before:always}
  body.paper-on .paper .blk.pb{break-before:page;page-break-before:always}
  body.paper-on .paper .blk.pb::before{display:none}
  #pmeasure{display:none}
  body.paper-on .paper .sheet.first{break-before:auto;page-break-before:auto}
}
</style>
<style id="canvas-theme">
/* KTUFSD Canvas look. Values read from ktufsd.instructure.com on 2026-11-14.
   Screen body text is 14px (Canvas uses 16px; Mary Beth asked for smaller). Paper views set their own 12pt. */
:root{--bg:#FFFFFF;--ink:#273540;--muted:#47535C;--mast:#0033A0;--lav:#0E68B3;--lav-deep:#0033A0;--lav-soft:#EEF2FA;--blue:#0E68B3;--blue-ink:#0B5A9C;--blue-soft:#E3EEF8;--line:#C7CDD1;--white:#fff;--card:#fff;
--font:"Lato","Lato Extended","Helvetica Neue",Helvetica,Arial,sans-serif}
html{font-size:87.5%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:#273540;background:#fff}
a{color:#0E68B3}
h1,h2,h3,h4{color:#273540;letter-spacing:0}

var CONNECT = /\b(because|so|therefore|thus|this shows|that shows|which shows|which means|this means|that means|as a result|that is why|this is why|which is why|this explains|that explains|shows that|show that|since|leads to|due to)\b/;

function norm(t){
  return String(t).toLowerCase().replace(/[’']/g,"").replace(/(\d),(?=\d{3})/g,"$1")
    .replace(/[^a-z0-9.\s%]/g," ").replace(/(?<!\d)\.|\.(?!\d)/g," ").replace(/\s+/g," ").trim();
}
function rx(src){ return new RegExp("\\b(?:"+src+")","i"); }
function numHit(n,text){ return new RegExp("(?<![0-9.])"+n.replace(/\./g,"\\.")+"(?![0-9])").test(text); }
function negBefore(text,idx){ return /\b(not|never|cannot|couldnt|cant|wouldnt|didnt|doesnt|dont|isnt|wasnt|no|without|unable|neither|nor)\b/.test(text.slice(Math.max(0,idx-35),idx)); }

function check(task,raw){
  var R=task.rubric, text=norm(raw), words=text?text.split(" ").length:0;
  if(words<8){ return {tooShort:true,words:words}; }
  var groupHits=R.ideaGroups.map(function(g){return rx(g).test(text);});
  var ideaAll=groupHits.every(Boolean), ideaCount=groupHits.filter(Boolean).length;
  var evTerms=R.ev.filter(function(e){return rx(e).test(text);}).length;
  var evNums=(R.nums||[]).filter(function(n){return numHit(n,text);}).length;
  var evHits=evTerms+evNums;
  var evOk=evHits>=(R.evNeed||2);
  var conn=CONNECT.test(text), claimMention=rx(R.claim).test(text);
  var n=R.ideaGroups.length, ideaStrong=ideaAll;
  var linkOk=conn && evHits>=1 && claimMention && ideaStrong;
  var beyond=ideaStrong && words>=12;
  var crit=[
    {id:"idea",label:"Names the science idea",met:ideaAll,hint:R.ideaHint},
    {id:"evidence",label:"Uses the evidence",met:evOk,hint:R.evHint},
    {id:"link",label:"Links the evidence to the claim with connecting words",met:linkOk,hint:R.linkHint},
    {id:"beyond",label:"Does more than restate the claim or the data",met:beyond,hint:"Your answer mostly repeats the data or the claim. Add the science idea that explains why the data make the claim true."}
  ];
  var misc=[];
  (R.misc||[]).forEach(function(m){ var mm=new RegExp(m.re,"i").exec(text); if(mm && !negBefore(text,mm.index)) misc.push(m.hint); });
  return {tooShort:false,words:words,crit:crit,misc:misc,parts:crit.filter(function(c){return c.met;}).length,total:crit.length};
}
if(typeof module!=="undefined"){ module.exports={TASKS:TASKS,check:check,norm:norm}; }

<script>

var IC_OK='<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* charts */
function lineChart(c){
  var W=600,H=300,L=62,R=20,T=34,B=58, pw=W-L-R, ph=H-T-B;
  function X(v){return L+(v-c.xmin)/(c.xmax-c.xmin)*pw;}
  function Y(v){var f=(v-c.ymin)/(c.ymax-c.ymin); return c.invert? T+f*ph : T+(1-f)*ph;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.title+". Points: "+c.xs.map(function(x,i){return x+" and "+c.ys[i];}).join("; "))+'">';
  s+='<text x="'+(W/2)+'" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#273540">'+esc(c.title)+'</text>';
  for(var v=c.ymin; v<=c.ymax+0.001; v+=c.ystep){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#C7CDD1"/><text x="'+(L-8)+'" y="'+(Y(v)+5)+'" text-anchor="end" font-size="13" fill="#273540">'+v+'</text>'; }
  c.xticks.forEach(function(x){ s+='<line x1="'+X(x)+'" x2="'+X(x)+'" y1="'+(T+ph)+'" y2="'+(T+ph+5)+'" stroke="#273540"/><text x="'+X(x)+'" y="'+(T+ph+20)+'" text-anchor="middle" font-size="13" fill="#273540">'+x+'</text>'; });
  s+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="#273540"/><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="#273540"/>';
  s+='<text x="'+(L+pw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="13" fill="#273540">'+esc(c.xlabel)+'</text>';
  s+='<text transform="translate(16 '+(T+ph/2)+') rotate(-90)" text-anchor="middle" font-size="13" fill="#273540">'+esc(c.ylabel)+'</text>';
  var pts=c.xs.map(function(x,i){return X(x)+","+Y(c.ys[i]);}).join(" ");
  s+='<polyline points="'+pts+'" fill="none" stroke="#0033A0" stroke-width="2.5"/>';
  c.xs.forEach(function(x,i){ var up=c.invert?-10:-9; s+='<circle cx="'+X(x)+'" cy="'+Y(c.ys[i])+'" r="5" fill="#fff" stroke="#0033A0" stroke-width="2.5"/><text x="'+X(x)+'" y="'+(Y(c.ys[i])+(c.invert?20:-10))+'" text-anchor="middle" font-size="12" fill="#273540">'+c.ys[i]+'</text>'; });
  return s+'</svg>';
}
function barChart(c){
  var W=600,H=320,L=62,R=20,T=40,B=64, pw=W-L-R, ph=H-T-B;
  function Y(v){return T+(1-(v-c.ymin)/(c.ymax-c.ymin))*ph;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.title+". "+c.groups.map(function(g){return g.label+": "+g.bars.map(function(b){return b.name+" "+b.v+" degrees";}).join(", ");}).join(". "))+'">';
  s+='<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3EEF8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B5A9C" stroke-width="2.5"/></pattern></defs>';
  s+='<text x="'+(W/2)+'" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#273540">'+esc(c.title)+'</text>';
  for(var v=c.ymin; v<=c.ymax; v+=c.ystep){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(v===0?"#273540":"#C7CDD1")+'"/><text x="'+(L-8)+'" y="'+(Y(v)+5)+'" text-anchor="end" font-size="13" fill="#273540">'+v+'</text>'; }
  s+='<text transform="translate(16 '+(T+ph/2)+') rotate(-90)" text-anchor="middle" font-size="13" fill="#273540">'+esc(c.ylabel)+'</text>';
  var gw=pw/c.groups.length, bw=Math.min(70,gw/3);
  c.groups.forEach(function(g,gi){
    var cx=L+gw*gi+gw/2;
    g.bars.forEach(function(b,bi){
      var x=cx+(bi===0?-bw-4:4), y0=Y(0), y1=Y(b.v), top=Math.min(y0,y1), h=Math.abs(y1-y0);
      s+='<rect x="'+x+'" y="'+top+'" width="'+bw+'" height="'+h+'" fill="'+(bi===0?"#0E68B3":"url(#hatch)")+'" stroke="'+(bi===0?"#0033A0":"#0B5A9C")+'" stroke-width="1.5"/>';
      s+='<text x="'+(x+bw/2)+'" y="'+(b.v>=0?top-6:top+h+16)+'" text-anchor="middle" font-size="14" font-weight="600" fill="#273540">'+b.v+'</text>';
    });
    s+='<text x="'+cx+'" y="'+(H-B+36)+'" text-anchor="middle" font-size="14" font-weight="600" fill="#273540">'+esc(g.label)+'</text>';
  });
  s+='<rect x="'+(L+10)+'" y="'+(T+4)+'" width="16" height="16" fill="#0E68B3" stroke="#0033A0"/><text x="'+(L+32)+'" y="'+(T+17)+'" font-size="13" fill="#273540">Harbor City (coast)</text>';
  s+='<rect x="'+(L+170)+'" y="'+(T+4)+'" width="16" height="16" fill="url(#hatch)" stroke="#0B5A9C"/><text x="'+(L+192)+'" y="'+(T+17)+'" font-size="13" fill="#273540">Inland City</text>';
  return s+'</svg>';
}
function tableHTML(tb){
  if(!tb) return "";
  var h='<div class="tablewrap"><table class="data"><caption>'+esc(tb.caption)+'</caption><thead><tr>'+tb.head.map(function(x){return '<th scope="col">'+esc(x)+'</th>';}).join("")+'</tr></thead><tbody>';
  tb.rows.forEach(function(r){ h+='<tr>'+r.map(function(c,i){return i===0?'<th scope="row">'+esc(c)+'</th>':'<td>'+esc(c)+'</td>';}).join("")+'</tr>'; });
  h+='</tbody></table></div>';
  if(tb.note) h+='<p class="note">'+esc(tb.note)+'</p>';
  return h;
}

/* views */
function homeView(){
  var ts_=setTasks(), m=S.mode, doneN=ts_.filter(function(t){return S.done[m][t.id];}).length;
  var pct=ts_.length?Math.round(doneN/ts_.length*100):0;
  var h='<section class="card"><div class="row" style="justify-content:flex-end;margin:0 0 6px"><button class="btn ghost" type="button" data-p="open">Print a paper version</button></div><h2>Practice the reasoning part of CER</h2>'
   +'<p>In every task, the claim and the evidence are already given. Your job is only the reasoning: the science idea that connects the evidence to the claim. You get feedback at each step.</p>'
   +'<p class="muted">Pick a unit, pick a mode, then start.</p>'
   +'<div class="units" role="group" aria-label="Choose a unit"><button class="unitbtn" data-act="unit" data-v="all" aria-pressed="'+(S.unit==="all")+'">Mixed (all units)</button>'
   +unitList().map(function(u){return '<button class="unitbtn" data-act="unit" data-v="'+esc(u)+'" aria-pressed="'+(S.unit===u)+'">'+esc(u)+'</button>';}).join("")+'</div>'
   +'<div class="row"><span id="modelab"><b>Mode</b></span><div class="seg" role="group" aria-labelledby="modelab"><button data-act="mode" data-v="build" aria-pressed="'+(m==="build")+'">Build it</button><button data-act="mode" data-v="fix" aria-pressed="'+(m==="fix")+'">Fix it</button></div></div>'
   +'<p class="note" style="margin-top:8px">'+(m==="build"?"Build it: pick the science idea, put the pieces in order, then write your own reasoning.":"Fix it: find what is wrong with a weak piece of reasoning, then rewrite it.")+'</p>'
   +'<div style="margin-top:12px"><b>Progress: '+doneN+' of '+ts_.length+' tasks finished</b> <span class="muted">('+(m==="build"?"Build it":"Fix it")+')</span>'
   +'<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+ts_.length+'" aria-valuenow="'+doneN+'" aria-label="Tasks finished"><span style="width:'+pct+'%"></span></div></div>'
   +'<div class="row" style="margin-top:8px"><button class="btn" data-act="startnext">'+(doneN===ts_.length&&ts_.length?"Practice again":(doneN?"Continue":"Start"))+'</button></div></section>';
  h+='<ul class="tlist" aria-label="Tasks">'+ts_.map(function(t){
    var d=S.done[m][t.id];
    return '<li class="trow"><div><h3>'+esc(t.title)+'</h3><span class="chip unit">'+esc(t.unit)+'</span> <span class="chip pe">'+esc(t.pe)+'</span> '+(d?'<span class="chip done">'+IC_OK+' Finished</span>':'')+'</div><button class="btn ghost" data-act="open" data-id="'+t.id+'" aria-label="'+(d?"Redo":"Start")+' '+esc(t.title)+'">'+(d?"Redo":"Start")+'</button></li>';
  }).join("")+'</ul>';
  h+='<details class="tnote"><summary>Teacher note</summary><p style="margin-top:8px"><b>To assign:</b> share this file or its link in Canvas. Students open it in any browser. They can work on a Chromebook or a phone.</p>'
   +'<p><b>Nothing is collected.</b> Answers stay in the student\'s browser and are never sent anywhere. Progress is saved only on that device. Use "Start over" in the footer to clear it, which is helpful on shared devices.</p>'
   +'<p><b>Scaffold level:</b> Sentence starters for step 3 are off by default. Students can turn them on, or you can tell them when to. The checker is a rule based guide for key parts and cannot replace your feedback.</p></details>';
  return h;
}
function explainPanel(){
  return '<section class="card explain" id="explainPanel" tabindex="-1"><div class="row" style="justify-content:space-between"><h2 style="margin:0">What is reasoning?</h2><button class="btn ghost" data-act="explain">Close</button></div>'
  +'<p style="margin-top:8px">The <b>claim</b> answers the question. The <b>evidence</b> is the data you can point to. The <b>reasoning</b> is the bridge between them: a science idea that explains why the evidence makes the claim true.</p>'
  +'<p>Ask yourself three things. What science idea explains this? How does the idea connect to my data? How does that make my claim true?</p>'
  +'<h3>Worked example</h3>'
  +'<div class="given claim"><b>Question:</b> Why did an ice cube melt faster on a metal pan than on a plastic plate? <br><b>Claim:</b> Metal moved thermal energy into the ice faster than plastic did.</div>'
  +'<div class="given"><b>Evidence:</b> The ice melted in 4 minutes on the metal pan and in 12 minutes on the plastic plate, in the same room.</div>'
  +'<div class="band i"><span class="t">Science idea</span>Metal is a good conductor, which means thermal energy moves through it quickly. Plastic is an insulator, so thermal energy moves through it slowly.</div>'
  +'<div class="band l"><span class="t">Link to the claim</span>Because the metal pan moved thermal energy into the ice faster, the ice melted in 4 minutes instead of 12. That is why the data support the claim.</div>'
  +'<p class="note">Notice what is not reasoning: repeating the data (\"it melted in 4 and 12 minutes\") or repeating the claim (\"metal is faster\"). Reasoning adds the science idea and the link.</p></section>';
}

  var h='<section class="card setup"><div><span class="chip unit">'+esc(t.unit)+'</span> <span class="chip pe">'+esc(t.pe)+'</span></div>'

function choicesHTML(list,st,actName){

function fbHTML(c){

function step1(t,st){

   +(st.solved1?'<button class="btn" data-act="next">Go to step 2: Build the bridge</button>':'')+'</section>';

function step2(t,st){
  var n=t.pieces.length;
  var h='<section class="card"><h2>Step 2: Build the bridge</h2><p>Put the pieces in a logical chain: start with the evidence, then the science idea, then how it connects, ending with the claim. Use the Up and Down buttons to move a piece.</p>'
   +'<ol class="pieces" aria-label="Sentence pieces, in your current order">';
  st.order.forEach(function(pi,pos){
    var p=t.pieces[pi], lock=st.bridgeOk;
    h+='<li class="piece'+(lock?" locked":"")+'"><span class="pos" aria-hidden="true">'+(pos+1)+'</span><span>'+(lock?'<span class="rolechip">'+IC_OK+' '+esc(ROLE[p.role][0].charAt(0).toUpperCase()+ROLE[p.role][0].slice(1))+'</span>':'')+esc(p.t)+'</span>'
     +'<span class="mv"><button data-act="mv" data-pos="'+pos+'" data-d="-1" aria-label="Move up, piece now in spot '+(pos+1)+'"'+((pos===0||lock)?" disabled":"")+'>Up</button><button data-act="mv" data-pos="'+pos+'" data-d="1" aria-label="Move down, piece now in spot '+(pos+1)+'"'+((pos===n-1||lock)?" disabled":"")+'>Down</button></span></li>';
  });
  h+='</ol>';
  if(st.bridgeMsg){ h+='<div class="fb '+(st.bridgeOk?"good":"try")+'" id="fb" tabindex="-1" role="status"><b class="h">'+(st.bridgeOk?IC_OK+" The chain works":IC_OPEN+" Not quite yet")+'</b>'+esc(st.bridgeMsg)+'</div>'; }
  h+='<div class="row">'+(st.bridgeOk?'<button class="btn" data-act="next">Go to step 3: Write it yourself</button>':'<button class="btn" data-act="check2">Check my order</button>')+'</div></section>';

  g.tasks.forEach(function(t,i){
    var lastSheet=(i===g.tasks.length-1)&&!opts.fix&&!opts.key;
    LS.tasks.push(pPlan(function(L){return pTaskSheet(t,i+1,i===0,L,pMeta(g));},{base:192,min:125,max1:288,max2:4000,two:true,chart:!!t.chart,rows:t.table?t.table.rows.length+1:0,opts:t.choices.length,foot:lastSheet}));
  });
  if(opts.fix){
    for(var q=0;q<g.tasks.length;q+=2){
      (function(pair){
        var lastP=(q+2>=g.tasks.length)&&!opts.key, bud=PBUD, n=pair.length, mn=125;
        var fc=[{},{g1:3,og:2},{g1:3,og:1,lh:1.15},{g1:2,og:1,lh:1.1}], j, pick=fc[fc.length-1], m0;
        for(j=0;j<fc.length;j++){ m0=pMeasureSheet(pFixPage(pair,Object.assign({m:1,box:mn},fc[j]))); pick=fc[j]; if(m0.total<=bud) break; }
        var av=(bud-(m0.total-n*mn))/n, bx=Math.max(mn,Math.min(av,288));
        LS.fixes.push(Object.assign({},pick,{box:Math.round(bx)}));
      })(g.tasks.slice(q,q+2));
    }
  }
  var m=document.getElementById("pmeasure"); if(m) m.innerHTML="";
  return LS;
}
function pKeyItem(t,n,fixToo){
  var o1=pShuffle(t.choices.length,t.id+":idea"), L1=pLetterOf(t.choices,o1), good=t.choices.filter(function(c){return c.ok;})[0];
  var h='<div class="keyitem"><h3 class="kt">Task '+n+': '+esc(t.title)+' <span class="unitline">'+esc(t.unit)+'</span></h3>'
   +'<p><b class="lb">Step 1:</b> <b>'+L1+'.</b> '+esc(pReason(good.fb))+'</p>'
   +'<p><b class="lb">Step 2:</b> Numbers in the boxes, top to bottom: <b>'+t.start.map(function(x){return x+1;}).join(", ")+'</b>. Correct order:</p><ol>'
   +t.pieces.map(function(p){return '<li>'+esc(p.t)+'</li>';}).join("")+'</ol>'
   +'<p><b class="lb">Step 3 model.</b> <b class="lb">Claim:</b> '+esc(t.claim)+' <b class="lb">Evidence:</b> '+esc(t.model.evidence)+' <b class="lb">Reasoning:</b> '+esc(t.model.idea)+' '+esc(t.model.link)+'</p>';
  var res=check(t,[t.model.evidence,t.model.idea,t.model.link].join(" "));
  if(res&&res.crit){ h+='<p><b class="lb">What earns credit:</b> '+res.crit.map(function(c){return esc(c.label);}).join("; ")+'.</p>'; }
  if(fixToo){
    var o2=pShuffle(t.fix.choices.length,t.id+":fix"), L2=pLetterOf(t.fix.choices,o2), g2=t.fix.choices.filter(function(c){return c.ok;})[0];
    h+='<p><b class="lb">Fix it, what is wrong:</b> <b>'+L2+'.</b> '+esc(pReason(g2.fb))+' <b class="lb">Rewrite:</b> '+esc(t.fix.goal)+' A strong rewrite is like the model reasoning above.</p>';
  }
  return h+'</div>';
}
function pDocUrl(kind,gid){
  var d=window.PAPER_DOCS&&window.PAPER_DOCS[kind]; if(!d) return "";
  var u=d[gid]||d.all||""; return /^https:\/\//.test(u)?u:"";
}
function pDocTitle(g,key){ return "Reasoning Builder: Paper Version, "+g.label+(key?" (Answer Key)":""); }
function pBuild(opts,LS){
  var g=pGroup(opts.group), h='';
  LS=LS||{tasks:[],fixes:[]};
  h+='<div class="paper-bar"><span><b>Paper version preview.</b> '+esc(g.label)+(opts.key?", with answer key":"")+'</span><span class="row"><button class="btn ghost" type="button" data-p="back">Back to the app</button>'+(pDocUrl("student",g.id)?'<a class="btn ghost" href="'+esc(pDocUrl("student",g.id))+'" target="_blank" rel="noopener">Open as a Google Doc</a>':'')+'<button class="btn" type="button" data-p="print">Print</button></span></div>';
  var secs=[];
  g.tasks.forEach(function(t,i){ secs.push(pTaskSheet(t,i+1,i===0,LS.tasks[i],pMeta(g))); });
  if(opts.fix){ for(var q=0;q<g.tasks.length;q+=2){ secs.push(pFixPage(g.tasks.slice(q,q+2),LS.fixes[q/2])); } }
  h+=secs.join("");
  if(opts.key){
    h+='<section class="sheet key">'+pBar("Answer Key","Reasoning Builder  |  Grade 7 Science  |  "+pMeta(g)+"  |  Teacher copy")+g.tasks.map(function(t,i){return pKeyItem(t,i+1,opts.fix);}).join("")+'</section>';
  }
  return {html:h,group:g};
}
var PAPER_TOKEN=0;
function showPaper(opts){
  var el=document.getElementById("paper"); if(!el) return Promise.resolve();
  var b=pBuild(opts);
  if(!PAPER_ON){ PAPER_TITLE=document.title; PAPER_SCROLL=window.pageYOffset||0; }
  el.innerHTML=b.html; el.hidden=false;
  document.body.classList.add("paper-on"); PAPER_ON=true;
  document.title=pDocTitle(b.group,opts.key);
  closePaperOpts(true); window.scrollTo(0,0);
  var tok=++PAPER_TOKEN, rdy=Promise.resolve();
  if(document.fonts&&document.fonts.load){
    rdy=Promise.all(['10.5pt Carlito','bold 10.5pt Carlito','italic 10.5pt Carlito'].map(function(f){return document.fonts.load(f).catch(function(){});})).then(function(){return document.fonts.ready;});
  }
  return rdy.then(function(){
    if(tok!==PAPER_TOKEN||!PAPER_ON) return;
    var LS=pFit(opts), nb=pBuild(opts,LS); el.innerHTML=nb.html;
  });
}
function hidePaper(){
  var el=document.getElementById("paper");
  if(el){ el.hidden=true; el.innerHTML=""; }
  document.body.classList.remove("paper-on");
  if(PAPER_ON){ document.title=PAPER_TITLE||"Reasoning Builder"; PAPER_ON=false; window.scrollTo(0,PAPER_SCROLL); }
}
function parsePaperHash(){
  var m=/^#paper(-key)?(?:=(.*))?$/.exec(location.hash||""); if(!m) return null;
  var id="all"; try{ id=m[2]?decodeURIComponent(m[2]):"all"; }catch(e){}
  return {key:!!m[1],group:id,fix:false};
}
function applyPaperHash(){ var p=parsePaperHash(); if(p) showPaper(p); else if(PAPER_ON) hidePaper(); }
function openPaperOpts(opener){
  var box=document.getElementById("paperOpts"); if(!box) return;
  PAPER_OPENER=opener||null;
  var gs=pGroups(), cur=pSlug(S.unit==="all"?"all":S.unit); if(S.unit==="all") cur="all";
  box.innerHTML='<div class="pbox" role="dialog" aria-modal="true" aria-labelledby="pTitle"><h2 id="pTitle">Print a paper version</h2>'
   +'<p class="muted">This makes a worksheet from the same tasks, for students who work on paper.</p>'
   +'<label class="pl" for="pGroup">What to include</label><select id="pGroup">'+gs.map(function(g){return '<option value="'+esc(g.id)+'"'+(g.id===cur?" selected":"")+'>'+esc(g.label)+' ('+g.tasks.length+(g.tasks.length===1?" task":" tasks")+')</option>';}).join("")+'</select>'
   +'<div class="pck"><input type="checkbox" id="pFix"><label for="pFix">Include a Fix it page for each task</label></div>'
   +'<div class="pck"><input type="checkbox" id="pKey"><label for="pKey">Include the answer key (teacher copy)</label></div>'
   +'<div class="row"><button class="btn" type="button" data-p="print-go">Print</button><button class="btn ghost" type="button" data-p="preview">Preview</button><button class="btn ghost" type="button" data-p="cancel">Cancel</button></div>'
   +'<div class="pdocs"><div class="row"><a class="btn ghost" id="pDocS" target="_blank" rel="noopener" hidden>Open as a Google Doc</a><a class="btn ghost" id="pDocK" target="_blank" rel="noopener" hidden>Open the answer key as a Google Doc</a></div><p class="note" id="pDocNote" hidden>The Google Doc can be copied and edited. File, then Make a copy.</p></div></div>';
  updatePaperDocs();
  box.hidden=false; var s=document.getElementById("pGroup"); if(s) s.focus();
}
function updatePaperDocs(){
  var sel=document.getElementById("pGroup"), key=document.getElementById("pKey"); if(!sel||!key) return;
  var us=pDocUrl("student",sel.value), uk=key.checked?pDocUrl("key",sel.value):"";
  var a=document.getElementById("pDocS"), b=document.getElementById("pDocK"), n=document.getElementById("pDocNote");
  if(a){ if(us){ a.href=us; a.hidden=false; } else { a.removeAttribute("href"); a.hidden=true; } }
  if(b){ if(uk){ b.href=uk; b.hidden=false; } else { b.removeAttribute("href"); b.hidden=true; } }
  if(n) n.hidden=!(us||uk);
}
document.addEventListener("change",function(e){ var id=e.target&&e.target.id; if(id==="pGroup"||id==="pKey") updatePaperDocs(); });
function closePaperOpts(quiet){
  var box=document.getElementById("paperOpts"); if(!box||box.hidden) return;
  box.hidden=true; box.innerHTML="";
  if(!quiet&&PAPER_OPENER&&document.body.contains(PAPER_OPENER)){ try{ PAPER_OPENER.focus(); }catch(e){} }
}
function readPaperOpts(){
  return {group:document.getElementById("pGroup").value,fix:document.getElementById("pFix").checked,key:document.getElementById("pKey").checked};
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-p]"); if(!b) return; var a=b.getAttribute("data-p");
  if(a==="open"){ openPaperOpts(b); return; }
  if(a==="cancel"){ closePaperOpts(); return; }
  if(a==="preview"){ showPaper(readPaperOpts()); return; }
  if(a==="print-go"){ showPaper(readPaperOpts()).then(function(){ window.setTimeout(function(){ window.print(); },50); }); return; }
  if(a==="print"){ window.print(); return; }
  if(a==="back"){
    hidePaper();
    if(parsePaperHash()){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(err){ location.hash=""; } }
    return;
  }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ var bx=document.getElementById("paperOpts"); if(bx&&!bx.hidden){ closePaperOpts(); } } });
window.addEventListener("hashchange",applyPaperHash);

load(); render(); applyPaperHash();
})();
</script>

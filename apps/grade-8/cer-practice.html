<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex"><!--fs-scaled-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CER and Written Response Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{--bg:#F5F5F5;--ink:#273540;--muted:#4F4A5C;--mast:#0033A0;--lav:#0E68B3;--lav-deep:#0033A0;--lav-soft:#EEF2FA;--blue:#0E68B3;--blue-ink:#0B5A9C;--blue-soft:#E3EEF8;--line:#C7CDD1;--card:#fff;--ok:#1F6B3A;--ok-soft:#E1F1E6;--warn:#8A4B00;--warn-soft:#FBEBD3;--font:"Lato","Lato Extended","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mast{background:var(--mast);color:#fff}
.mast .in{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mast h1{font-size:1.25rem;margin:0;font-weight:600;letter-spacing:.2px}
.mast .org{font-size:.9rem;color:#FFFFFF}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin:0 0 16px}
.card h2{margin:0 0 8px;font-size:1.2rem;color:var(--lav-deep)}
.card h3{margin:14px 0 6px;font-size:1.02rem;color:var(--blue-ink)}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-left:1.3em}
li{margin-bottom:4px}
.btn{display:inline-block;border:2px solid var(--lav-deep);background:var(--lav-deep);color:#fff;border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{background:#3C3169}
.btn.alt{background:#fff;color:var(--lav-deep)}
.btn.alt:hover{background:var(--lav-soft)}
.btn.sm{padding:4px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--lav-soft);color:var(--lav-deep);border-radius:99px;padding:2px 11px;font-size:.85rem;font-weight:500;margin:0 6px 4px 0}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.bar{height:14px;background:var(--lav-soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--lav-deep);width:0;transition:width .3s}
textarea,input[type=text],input[type=date],input[type=number],select{background:#fff;border:2px solid #000;border-radius:4px;padding:8px 10px;width:100%}
input[type=number]{width:auto}
textarea{resize:vertical;min-height:90px}
label{font-weight:500}
.foot{max-width:1100px;margin:0 auto;padding:10px 16px 30px;color:var(--muted);font-size:.9rem}
.note{background:var(--blue-soft);border-left:5px solid var(--blue-ink);border-radius:4px;padding:10px 14px;margin:10px 0}
.warnbox{background:var(--warn-soft);border-left:5px solid var(--warn);border-radius:4px;padding:10px 14px;margin:10px 0}
table{border-collapse:collapse;max-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--lav-soft);color:var(--lav-deep)}
details>summary{cursor:pointer;font-weight:500;color:var(--lav-deep);padding:6px 0}
@media (max-width:600px){.card{padding:14px}.wrap{padding:14px 12px 30px}}

.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:44px}
.filters input{width:20px;height:20px}
.filters label:has(input:checked){border-color:var(--lav-deep);background:var(--lav-soft)}
.tasklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.taskbtn{text-align:left;background:#fff;border:2px solid var(--line);border-radius:4px;padding:14px;cursor:pointer;width:100%}
.taskbtn:hover{border-color:var(--lav-deep);background:#FBFAFD}
.taskbtn b{display:block;margin-bottom:4px;color:var(--lav-deep)}
.taskbtn .st{font-size:.9rem;color:var(--muted);margin-top:4px}
.crit{list-style:none;padding:0;margin:10px 0}
.crit li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crit .ic{flex:none;font-weight:700;width:1.5em;font-size:1.1rem}
.crit li.ok .ic{color:var(--ok)}
.crit li.no .ic{color:var(--warn)}
.band{border-left:6px solid;border-radius:4px;padding:10px 14px;margin:10px 0}
.band .tag{display:block;font-size:.8rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.b-c{background:var(--blue-soft);border-color:var(--blue-ink)}
.b-c .tag{color:var(--blue-ink)}
.b-e{background:var(--lav-soft);border-color:var(--lav-deep)}
.b-e .tag{color:var(--lav-deep)}
.b-r{background:#F1E9D6;border-color:#7A5A12}
.b-r .tag{color:#5C4308}
.stepnum{display:inline-block;background:var(--lav-deep);color:#fff;border-radius:99px;min-width:28px;height:28px;text-align:center;line-height:28px;margin-right:8px;font-weight:600}
.starter{background:#FBFAFD;border:1px dashed var(--lav);border-radius:4px;padding:6px 10px;margin:6px 0;font-size:.95rem}
.qwopts{display:grid;gap:8px;margin:10px 0}
.qwopt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;min-height:44px;width:100%}
.qwopt:hover{border-color:var(--lav-deep)}
.qwopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qwopt.right::after{content:"  \2713  Correct"}
.qwopt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.qwopt.wrong::after{content:"  \25CB  Not quite"}
.q{font-size:1.1rem;font-weight:500;margin:0}
.graphbox{max-width:640px}
.graphbox svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:4px}
.tblwrap{overflow-x:auto}
.selfchk label{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-bottom:6px}
.selfchk input{width:20px;height:20px;flex:none;margin-top:3px}
.lock{color:var(--muted);font-style:italic}
.hide{display:none}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
@media print{.mast .btn,.btn,.nav,.foot button{display:none}}
</style>
<style id="paper-css">
/* ===== Paper version (printable worksheet view, burple look, Calibri, 6-8 grade band) ===== */
#paper[hidden]{display:none!important}
body.paper-on{background:#8a8f94}
body.paper-on .mast,body.paper-on #app,body.paper-on .foot{display:none!important}
body.paper-on #paper{display:block}
.paper{font-family:Calibri,Carlito,"Lato",Arial,sans-serif;font-size:10.5pt;line-height:1.3;color:#1A160D;padding:16px 12px 40px}
.paper,.paper *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .ptools{max-width:8.5in;margin:0 auto 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:#fff;font-size:11pt}
.paper .ptools .btn{min-height:40px;text-decoration:none}
.paper .pdoc{background:#fff;max-width:8.5in;margin:0 auto;padding:.35in .5in;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.paper h1,.paper h2,.paper h3{font-family:inherit;font-weight:700;letter-spacing:0;line-height:1.25;margin:0 0 3px;text-shadow:none}
.paper h2{font-size:13pt;color:#6B9BCC;border-bottom:1px solid #6B9BCC;padding:0 0 2px;margin:6px 0 3px}
.paper h3{font-size:10.5pt;color:#7B6BAF;border:0;padding:0}
.paper p{margin:0 0 4px}
.paper ul{margin:0 0 4px;padding-left:1.3em;font-size:10pt}
.paper li{margin-bottom:1px}
.paper .pbar{background:#6B9BCC;color:#fff;padding:3px 14px;margin:0 0 2px;border:0;break-inside:avoid;page-break-inside:avoid}
.paper .pbar .l1{font-size:14pt;font-weight:700;line-height:1.25}
.paper .pbar .l2{font-size:10pt;font-weight:400;line-height:1.25;white-space:pre-wrap;margin-top:1px}
.paper .pchips{display:flex;gap:2px;margin:2px 0 4px;break-inside:avoid;page-break-inside:avoid}
.paper .pchip{flex:1 1 0;background:#E4DFEF;text-align:center;padding:3px 6px;border:0}
.paper .pchip .cl{font-size:9pt;font-weight:700;color:#7B6BAF;line-height:1.2}
.paper .pchip .cv{font-size:9pt;font-weight:700;color:#1A160D;line-height:1.2;margin-top:1px}
.paper .pname{margin:2px 0 6px;font-size:10.5pt;white-space:nowrap;color:#1A160D}
.paper .pdirs{font-size:10pt;margin:0 0 6px}
.paper .pdir{font-size:10pt;font-weight:400}
.paper .ptag{font-size:10pt;margin:0 0 3px}
.paper .ptask,.paper .pshort{margin:0 0 8px}
.paper .pq{margin:5px 0}
.paper .pq b,.paper .plabel b,.paper .pshort .pdir b{color:#7B6BAF}
.paper .pavoid,.paper .pblock,.paper .pcheck,.paper .pshort,.paper .pq{break-inside:avoid;page-break-inside:avoid}
.paper .plabel{margin:0 0 2px}
.paper .pcall{background:#E4DFEF;border:1px solid #E4DFEF;border-left:3px solid #7B6BAF;padding:2px 8px;font-size:10pt}
.paper .pcall b{color:#7B6BAF}
.paper .pstart{font-size:10pt;margin:0 0 3px}
.paper .wbox{background:#fff;border:1px solid #000;width:100%}
.paper .pblock{margin:0 0 6px}
.paper table{border-collapse:collapse;width:auto;max-width:100%;margin:0 0 5px;font-size:10pt}
.paper caption{caption-side:top;text-align:left;font-weight:700;padding:0 0 2px;color:#1A160D}
.paper th,.paper td{border:1px solid #CCCCCC;padding:2px 7px;text-align:left;background:#fff;color:#1A160D;font-weight:400;font-size:10pt}
.paper th{background:#D6E5F2;color:#6B9BCC;font-weight:700}
.paper td.plbl,.paper td.term{background:#D6E5F2;color:#1A160D;font-weight:700}
.paper .pgraph{margin:4px 0 5px}
.paper .pgraph svg{display:block;width:100%;max-width:4.6in;height:auto;background:#fff;border:1px solid #CCCCCC;margin:0 0 4px}
.paper .ptick{display:flex;gap:8px;align-items:flex-start;font-size:10pt;margin:0 0 2px}
.paper .pcheck h3{color:#7B6BAF}
.paper .tick{flex:none;display:inline-block;width:10px;height:10px;border:1px solid #000;margin-top:3px;background:#fff}
.paper .popt{margin:0 0 2px;padding-left:1.8em;text-indent:-1.8em;color:#1A160D;font-size:10pt}
.paper .popt b{color:#1A160D}
.paper .pkey,.paper .pkey p,.paper .pkey li{font-size:10pt}
.paper .pkey h3{font-size:13pt;color:#6B9BCC;border-bottom:1px solid #6B9BCC;padding-bottom:2px;margin:6px 0 3px;break-after:avoid;page-break-after:avoid}
.paper .pkey b{color:#7B6BAF}
.paper .pkey b.pans{color:#1A160D}
.paper .pkey .pcall{margin:0 0 4px}
.paper .pkitem{margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #E3DACB;break-inside:auto;page-break-inside:auto}
.paper .pkitem p,.paper .pkitem li,.paper .pkline,.paper .pkitem .pavoid,.paper .pkitem .pcall{break-inside:avoid;page-break-inside:avoid}
.paper .pforce{break-before:page;page-break-before:always}
.paper .ptask:not(.pspan) .pcont,.paper .ptask:not(.pspan) .ptwo,.paper .ptask.pspan .pone{display:none}
.paper .ppage2 .pcont,.paper .ppage2 .pblock{break-after:avoid;page-break-after:avoid}
.paper.pmeasure .pdoc{padding:0;max-width:none;width:7.5in;margin:0;box-shadow:none}
.paper .pcont{break-after:avoid;page-break-after:avoid}
.paper .ptask:not(.pvb) .pthree{display:none}
.paper .ptask.pvb .ptwo{display:none}
.paper .pshort{margin:0 0 5px}
.paper .pshort h2{margin:3px 0 2px}
.paper .pshort .popt{margin:0 0 1px}
@page{size:letter;margin:0.35in 0.5in 0.5in 0.5in;@bottom-center{content:counter(page);font-family:Calibri,Carlito,Arial,sans-serif;font-size:9pt;color:#666666;border-top:1px solid #E3DACB;width:7.5in;padding-top:2px;vertical-align:top}}
@media print{
 html,body.paper-on{background:#fff!important}
 body.paper-on .paper{padding:0}
 body.paper-on .paper .pdoc{box-shadow:none;padding:0;max-width:none;margin:0}
 body.paper-on .paper .ptools{display:none!important}
 .paper .pbreak{break-before:page;page-break-before:always}
}
@media screen{.paper:not(.pmeasure) .pbreak:not(tr),.paper:not(.pmeasure) .pforce:not(tr){margin-top:.5in;border-top:2px dashed #999;padding-top:.25in}}
</style>

const STOPW = new Set("that this with from have they them then than were been being will would could should there their what when where which while about into just also because very more most some such only each other over under your you and the for are was has had its not but can out our one two all any".split(" "));
function norm(t){
  t=String(t||"").toLowerCase().replace(/[’']/g,"").replace(/²/g,"2").replace(/(\d),(?=\d{3}\b)/g,"$1");
  t=t.replace(/[.!?;:]+(?=\s|$)/g," | ").replace(/[^a-z0-9.%|\s\/]/g," ").replace(/\s+/g," ").trim();
  return " "+t+" ";
}
function wordsOf(t){return (norm(t).match(/[a-z]+/g)||[])}
function nWords(t){return (String(t||"").trim().match(/\S+/g)||[]).length}
function termHit(n,term){return new RegExp("\\b"+term).test(n)}
function groupHit(n,group){return group.some(t=>termHit(n,t))}
function altsHit(n,alts){return alts.some(groups=>groups.every(g=>groupHit(n,g)))}
function numsFound(text,vals){
  const nums=(norm(text).match(/\d+(?:\.\d+)?/g)||[]).map(parseFloat);
  const found=new Set();
  vals.forEach(v=>{if(nums.indexOf(v)>=0)found.add(v)});
  return found.size;
}
const CONN="(because|so |therefore|this shows|this means|which means|as a result|this is why|that is why|this explains|since |due to|which is why|this is due|thus|that means|explains why|shows that|this supports|leads to|causes|caused)";
function critResult(met,label,hint){return {met:!!met,label,hint}}
function evalClaim(task,text){
  const r=task.cer.claim;
  return critResult(altsHit(norm(text),r.alts),"My claim answers the question.",r.hint);
}
function evalEvidence(task,text){
  const r=task.cer.evidence;
  const k=numsFound(text,r.nums);
  return critResult(k>=r.min,"My evidence uses specific numbers from the data.",r.hint+(k>0&&k<r.min?" You have "+k+" so far. Try to use at least "+r.min+" different values.":""));
}
function evalReasoning(task,reasoning,claim,evidence){
  const r=task.cer, n=norm(reasoning);
  const concept=critResult(altsHit(n,r.concept.alts),"My reasoning names the science idea.",r.concept.hint);
  const linkOK=new RegExp(CONN).test(n)&&groupHit(n,r.link.ev)&&groupHit(n,r.link.cl);
  let lh=r.link.hint;
  if(!new RegExp(CONN).test(n))lh="Add a linking word such as because, so, or this shows. "+lh;
  const link=critResult(linkOK,"My reasoning links my evidence to my claim.",lh);
  const prev=new Set(wordsOf(claim+" "+evidence));
  const cw=wordsOf(reasoning).filter(w=>w.length>3&&!STOPW.has(w));
  const fresh=cw.filter(w=>!prev.has(w)).length;
  const ratio=cw.length?fresh/cw.length:0;
  const novel=critResult(concept.met&&ratio>=0.3,"My reasoning adds a science idea instead of repeating my claim or data.","Your reasoning mostly repeats what you already wrote. Add the science idea that explains why the data lead to your claim.");
  return {concept,link,novel};
}
function misconceptions(task,text){
  const n=norm(text), out=[];
  (task.miscon||[]).forEach(m=>{if(new RegExp(m.re).test(n))out.push(m.hint)});
  return out;
}
function evalShort(task,text){
  const n=norm(text);
  return task.crit.map(c=>critResult(altsHit(n,c.alts),c.label,c.hint));
}

function lineGraph(g){
  const W=600,H=340,L=64,R=24,T=40,B=64,ns="http://www.w3.org/2000/svg";

  const svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":g.title+". A line graph. The data are also in the table below the graph."});
  const x=i=>L+(g.xs.length===1?pw/2:pw*i/(g.xs.length-1));
  const y=v=>T+ph-(v-g.yMin)/(g.yMax-g.yMin)*ph;
  svg.appendChild(el("text",{x:W/2,y:22,"text-anchor":"middle","font-size":"15","font-weight":"600",fill:"#273540"},g.title));
  for(let v=g.yMin;v<=g.yMax;v+=20){
    svg.appendChild(el("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"#EEF2FA","stroke-width":"1"}));
    svg.appendChild(el("text",{x:L-8,y:y(v)+4,"text-anchor":"end","font-size":"12",fill:"#273540"},String(v)));
  }
  svg.appendChild(el("line",{x1:L,x2:L,y1:T,y2:T+ph,stroke:"#000","stroke-width":"2"}));
  svg.appendChild(el("line",{x1:L,x2:W-R,y1:T+ph,y2:T+ph,stroke:"#000","stroke-width":"2"}));
  g.xs.forEach((v,i)=>{svg.appendChild(el("text",{x:x(i),y:T+ph+18,"text-anchor":"middle","font-size":"12",fill:"#273540"},String(v)))});
  svg.appendChild(el("text",{x:L+pw/2,y:H-24,"text-anchor":"middle","font-size":"13",fill:"#273540"},g.xLabel));
  const yl=el("text",{x:16,y:T+ph/2,"text-anchor":"middle","font-size":"13",fill:"#273540",transform:"rotate(-90 16 "+(T+ph/2)+")"},g.yLabel);svg.appendChild(yl);
  const cols=["#0033A0","#0B5A9C"];
  g.series.forEach((s,si)=>{
    const pts=s.ys.map((v,i)=>x(i)+","+y(v)).join(" ");
    svg.appendChild(el("polyline",{points:pts,fill:"none",stroke:cols[si],"stroke-width":"3","stroke-dasharray":s.dash?"8 5":"0"}));
    s.ys.forEach((v,i)=>{
      if(si===0)svg.appendChild(el("circle",{cx:x(i),cy:y(v),r:"5",fill:cols[si]}));
      else svg.appendChild(el("rect",{x:x(i)-5,y:y(v)-5,width:"10",height:"10",fill:"#fff",stroke:cols[si],"stroke-width":"3"}));
      if(g.series.length===1)svg.appendChild(el("text",{x:x(i),y:y(v)-10,"text-anchor":"middle","font-size":"12","font-weight":"600",fill:"#273540"},String(v)));
    });
  });
  if(g.series.length>1){
    g.series.forEach((s,si)=>{
      const lx=L+20+si*190, ly=H-6;
      svg.appendChild(el("line",{x1:lx,x2:lx+34,y1:ly-5,y2:ly-5,stroke:cols[si],"stroke-width":"3","stroke-dasharray":s.dash?"8 5":"0"}));
      svg.appendChild(el("text",{x:lx+42,y:ly-1,"font-size":"13",fill:"#273540"},s.name+(s.dash?" (dashed)":" (solid)")));
    });
  }
  const box=h("div",{class:"graphbox"},svg);
  const tbl=h("table",null,h("tr",null,h("th",null,g.xLabel),...g.series.map(s=>h("th",null,s.name+" ("+(g.unit.trim()||"value")+")"))));
  g.xs.forEach((v,i)=>tbl.appendChild(h("tr",null,h("td",null,String(v)),...g.series.map(s=>h("td",null,String(s.ys[i]))))));
  box.appendChild(h("details",null,h("summary",null,"Show the graph data as a table"),h("div",{class:"tblwrap"},tbl)));
  return box;
}

/* ----- CER ----- */
function buildCER(t,st){
  const cards={};
  function part(key,num,title,desc,min,onCheck,next){
    const ta=h("textarea",{id:"ta_"+key,rows:"3","aria-label":title+" for "+t.title});
    ta.value=st[key]||"";
    ta.addEventListener("input",()=>{st[key]=ta.value;lsSet();if(cards.combine)refreshCombine()});
    const res=h("div",{"aria-live":"polite"});
    const btn=h("button",{type:"button",class:"btn",onclick:()=>{
      const wc=nWords(ta.value);
      if(wc<min){tooShort(res,min,title.toLowerCase());return}
      st.steps[key]++;lsSet();onCheck(ta.value,res);
      if(next&&cards[next])cards[next].classList.remove("hide");
      if(key==="reasoning"&&cards.combine){cards.combine.classList.remove("hide");refreshCombine()}
    }},"Check my "+title.toLowerCase());
    const c=h("div",{class:"card"+((num>1&&!(st.steps[["","claim","evidence","reasoning"][num-1]]))?" hide":"")},
      h("h2",null,h("span",{class:"stepnum","aria-hidden":"true"},String(num)),"Step "+num+": "+title),
      h("p",null,desc),
      h("label",{for:"ta_"+key,class:"sr-only"},title),
      ta,starterRow(t.starters[key],ta),h("div",{style:"margin-top:8px"},btn),res);
    cards[key]=c;app.appendChild(c);
    if(st.steps[key]){/* restore no results but keep visible */}
    return {ta,res};
  }
  part("claim",1,"Claim","A claim answers the question. Write one or two sentences.",4,(tx,res)=>{
    showResults(res,[evalClaim(t,tx)],misconceptions(t,tx),null)},"evidence");
  part("evidence",2,"Evidence","Evidence is data or observations from the situation. Use specific numbers and units from the table or graph.",5,(tx,res)=>{
    showResults(res,[evalEvidence(t,tx)],[],null)},"reasoning");
  part("reasoning",3,"Reasoning","Reasoning explains why the evidence supports your claim. Name the science idea, and connect it to your evidence with a word like because.",8,(tx,res)=>{
    const r=evalReasoning(t,tx,st.claim,st.evidence);
    showResults(res,[r.concept,r.link,r.novel],misconceptions(t,tx),null)},"combine");
  // combine card

    st.whole++;lsSet();
    const r=evalReasoning(t,st.reasoning,st.claim,st.evidence);

    const n=all.filter(x=>x.met).length;
    showResults(cres,all,misconceptions(t,st.claim+" | "+st.evidence+" | "+st.reasoning),"The checker found "+n+" of 5 parts. This is a count of parts found, not a grade.");
    if(st.whole>=2&&!st.shown)showModel();
    updateModelBtn();
  }},"Check my whole response");
  const modelBtn=h("button",{type:"button",class:"btn alt hide",onclick:()=>showModel()},"Show the model response");
  function updateModelBtn(){modelBtn.classList.toggle("hide",!(st.whole>=1&&!st.shown))}
  function refreshCombine(){cb.replaceChildren(bands({claim:st.claim,evidence:st.evidence,reasoning:st.reasoning}))}
  function showModel(){

    modelBox.appendChild(h("h3",null,"Model response"));

    modelBox.appendChild(bands(t.model));
    modelBox.appendChild(h("h3",null,"Self-check: My response has ..."));
    const sc=h("div",{class:"selfchk"});
    ["a claim that answers the question.","evidence with specific numbers and units from the data.","reasoning that names the science idea.","a linking word such as because, so, or this shows.","reasoning that explains why, not just a repeat of my claim or data."].forEach((s,i)=>{
      const id="sc"+i;sc.appendChild(h("label",{for:id},h("input",{type:"checkbox",id,checked:st.self[i]?true:false,onchange:e=>{st.self[i]=e.target.checked;lsSet()}}),s));

    modelBox.appendChild(sc);

  combo.appendChild(h("h2",null,h("span",{class:"stepnum","aria-hidden":"true"},"4"),"Step 4: Put it together"));

  combo.appendChild(cb);combo.appendChild(h("div",{class:"row",style:"margin-top:8px"},wholeBtn,modelBtn));combo.appendChild(cres);combo.appendChild(modelBox);
  app.appendChild(combo);

/* ---- paper layout pass: fills pages by growing writing boxes, balances the vocab quiz ---- */
let paperTok=0,paperReady=Promise.resolve();
const PAPER_PAGE_H=974-14;/* printable height 10.15in (0.35in top, 0.5in bottom) at 96px per inch, minus a safety margin of about 0.15in */
function paperAtoms(doc){
  const atoms=[],px=v=>parseFloat(v)||0;let pend=false,stop=false;
  const TR=/(^|\s)(ptask|pshorts|ppage2|ptopic|pqz)(\s|$)/;
  (function walk(el){
    [...el.children].forEach(c=>{
      if(stop)return;
      if(c.classList.contains("pkey")){stop=true;return}
      const nat=c.classList.contains("pbreak");
      if(TR.test(c.className)){if(nat)pend=true;walk(c);return}
      const cs=getComputedStyle(c);
      if(cs.display==="none")return;
      if(c.matches("table.pstudy")){
        const rows=[...c.tBodies[0].rows],hh=c.tHead.getBoundingClientRect().height;
        rows.forEach((r,i)=>{
          atoms.push({el:r,h:r.getBoundingClientRect().height,force:pend&&i===0,keep:i===0&&false,row:{table:c,idx:i,n:rows.length,headH:hh,mt:px(cs.marginTop),mb:px(cs.marginBottom)}});
        });
        if(rows.length&&pend)pend=false;
        return;
      }
      const r=c.getBoundingClientRect();
      atoms.push({el:c,h:r.height+px(cs.marginTop)+px(cs.marginBottom),force:nat||pend,keep:cs.breakAfter==="avoid"});
      pend=false;
    });
  })(doc);
  /* the footer line stays with the atom before it */
  const n=atoms.length;if(n>1&&atoms[n-1].el.classList.contains("pfoot"))atoms[n-2].keep=true;
  return atoms;
}
function paperSim(atoms,H){
  const units=[];
  for(let i=0;i<atoms.length;i++){const u=[atoms[i]];while(atoms[i].keep&&i+1<atoms.length){i++;u.push(atoms[i])}units.push(u)}
  const pages=[];let cur;
  const np=()=>{cur={atoms:[],used:0,tables:new Set(),last:false};pages.push(cur)};
  np();
  units.forEach(u=>{
    const cost=pg=>{let t=0;const tb=new Set(pg.tables);u.forEach(a=>{t+=a.h;if(a.row){const q=a.row;if(q.idx===0)t+=q.mt;if(q.idx===0||!tb.has(q.table)){t+=q.headH;tb.add(q.table)}if(q.idx===q.n-1)t+=q.mb}});return t};
    if((u[0].force||u[0].soft)&&cur.atoms.length){if(u[0].force)cur.last=true;np()}
    let c=cost(cur);
    if(cur.atoms.length&&cur.used+c>H){np();c=cost(cur)}
    cur.used+=c;u.forEach(a=>{cur.atoms.push(a);if(a.row)cur.tables.add(a.row.table)});
  });
  cur.last=true;
  return pages;
}
function paperBalance(atoms,H){
  let pages=paperSim(atoms,H),again=false;
  const isQ=a=>a.el.classList&&a.el.classList.contains("pqitem");
  for(let s=0;s<atoms.length;){
    if(!isQ(atoms[s])){s++;continue}
    let e=s;while(e+1<atoms.length&&isQ(atoms[e+1]))e++;
    const pageOf=a=>pages.findIndex(p=>p.atoms.indexOf(a)>=0);
    const p0=pageOf(atoms[s]),pL=pageOf(atoms[e]),N=pL-p0+1,last=pages[pL];
    if(N>=2&&last.atoms.every(isQ)&&last.used<0.4*H){
      const qs=atoms.slice(s,e+1),qh=qs.map(a=>a.h);
      const onP0=pages[p0].atoms.filter(isQ).reduce((t,a)=>t+a.h,0);
      const cap0=H-(pages[p0].used-onP0);
      const run=c=>{let pi=0,used=0,starts=[];qh.forEach((h,i)=>{const cap=pi===0?Math.min(c,cap0):c;if(used+h>cap&&(used>0||(pi===0&&cap0<h))){pi++;used=0;starts.push(i)}used+=h});return {pages:pi+1,starts}};
      let lo=Math.max(...qh),hi=H;
      while(lo<hi){const m=Math.floor((lo+hi)/2);if(run(m).pages<=N)hi=m;else lo=m+1}
      run(lo).starts.forEach(i=>{qs[i].soft=true});again=true;
    }
    s=e+1;
  }
  return again?paperSim(atoms,H):pages;
}
function paperGrow(pg,H,dry){
  let rem=H-pg.used;
  const boxes=[];
  pg.atoms.forEach(a=>{
    if(a.row){const td=a.el.querySelector("td.own");if(td)boxes.push({base:a.h,max:a.h,max2:a.h*1.5,set:v=>{td.style.height=v+"px"}})}
    else a.el.querySelectorAll(".wbox").forEach(b=>{const bh=b.getBoundingClientRect().height;boxes.push({base:bh,max:Math.max(0,288-bh),max2:0,set:v=>{b.style.height=v+"px"}})});
  });
  const grow=boxes.map(()=>0);
  const dist=key=>{
    for(let it=0;it<5&&rem>1&&boxes.length;it++){
      const open=boxes.map((b,i)=>grow[i]<b[key]-0.5?i:-1).filter(i=>i>=0);if(!open.length)break;
      let used=0;
      open.forEach(i=>{const g=Math.min(rem/open.length,boxes[i][key]-grow[i]);grow[i]+=g;used+=g});
      rem-=used;
    }
  };
  dist("max");
  const ga=pg.atoms.filter(a=>!a.row&&a.el.closest&&a.el.closest(".ptask"));
  let gper=0;
  if(rem>4&&ga.length>1){gper=Math.min(rem/(ga.length-1),22);rem-=gper*(ga.length-1)}
  if(dry)return Math.max(rem,0);
  if(gper>0)ga.slice(0,-1).forEach(a=>{a.el.style.marginBottom=(parseFloat(getComputedStyle(a.el).marginBottom)+gper)+"px"});
  boxes.forEach((b,i)=>{if(grow[i]>0)b.set(b.base+grow[i])});
  if(!pg.last&&rem>4){
    const qs=pg.atoms.filter(a=>a.el.classList&&a.el.classList.contains("pqitem"));
    if(qs.length>1){const per=Math.min(rem/(qs.length-1),14);qs.slice(0,-1).forEach(a=>{a.el.style.marginBottom=(parseFloat(getComputedStyle(a.el).marginBottom)+per)+"px"})}
  }
  return Math.max(rem,0);
}
function paperLayout(){
  const tok=++paperTok;
  const fl=document.fonts?Promise.all([document.fonts.load("400 10.5pt Carlito"),document.fonts.load("700 10.5pt Carlito"),document.fonts.load("400 10.5pt Calibri")]).catch(()=>{}).then(()=>document.fonts.ready):Promise.resolve();
  return fl.catch(()=>{}).then(()=>{
    if(tok!==paperTok||paperEl.hidden)return;
    const doc=paperEl.querySelector(".pdoc");if(!doc)return;
    paperEl.classList.add("pmeasure");
    try{
      const H=PAPER_PAGE_H;
      let atoms=paperAtoms(doc),pages=paperSim(atoms,H);
      const redo=()=>{atoms=paperAtoms(doc);pages=paperSim(atoms,H)};
      const tasks=[...doc.querySelectorAll(".ptask")];
      const taskPages=tk=>pages.filter(pg=>pg.atoms.some(a=>a.el.closest&&a.el.closest(".ptask")===tk));
      const spanning=tasks.filter(tk=>taskPages(tk).length>1);
      spanning.forEach(tk=>tk.classList.add("pspan"));
      if(spanning.length)redo();
      const score=tk=>Math.max(0,...taskPages(tk).map(pg=>paperGrow(pg,H,true)));
      spanning.forEach(tk=>{
        const a=score(tk);
        const blocks=tk.querySelectorAll(".pblock"),ev=blocks[1],p2=tk.querySelector(".ppage2"),rsn=blocks[2];
        const conts=[...tk.querySelectorAll(".pcont")];
        if(!ev||!rsn||!conts.length)return;
        tk.classList.add("pvb");conts.forEach(c=>tk.insertBefore(c,ev));conts[0].classList.add("pbreak");
        redo();
        if(score(tk)>=a-4){tk.classList.remove("pvb");conts[0].classList.remove("pbreak");conts.forEach(c=>p2.insertBefore(c,rsn));redo()}
      });
      pages.forEach((pg,i)=>{if(i>0)pg.atoms[0].el.classList.add("pforce")});
      pages.forEach(pg=>paperGrow(pg,H,false));
    }catch(e){}
    paperEl.classList.remove("pmeasure");
  });
}
function leavePaper(clearHash){
  document.body.classList.remove("paper-on");paperEl.hidden=true;paperEl.replaceChildren();
  document.title=paperOrigTitle;

function paperCard(){
  const card=h("div",{class:"card"});
  const panel=h("div",{hidden:true,style:"margin-top:12px"});
  const btn=h("button",{type:"button",class:"btn alt","aria-expanded":"false",onclick:()=>{const open=panel.hidden;panel.hidden=!open;btn.setAttribute("aria-expanded",open?"true":"false")}},"Print a paper version");

    h("p",null,h("label",{for:"pp_st",style:"display:inline-flex;gap:10px;align-items:center;font-weight:400"},st,"Add sentence starters")),
    h("div",{class:"row"},h("button",{type:"button",class:"btn",onclick:()=>go(true)},"Print"),h("button",{type:"button",class:"btn alt",onclick:()=>go(false)},"Preview")),
    docRow);
  card.append(h("p",{style:"margin:0"},"Want students off the computer? ",btn),panel);
  return card;
}

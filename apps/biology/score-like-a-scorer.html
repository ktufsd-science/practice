<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex"><!--fs-scaled-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Like a Scorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{
  --bg:#F5F5F5; --ink:#273540; --mast:#0033A0; --lav:#0E68B3; --lav-deep:#0033A0; --lav-soft:#EEF2FA;
  --blue:#0E68B3; --blue-ink:#0B5A9C; --blue-soft:#E3EEF8; --line:#C7CDD1; --muted:#5F5A6B; --white:#fff;
  --font:"Lato","Lato Extended","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mast{background:var(--mast);color:#fff;position:sticky;top:0;z-index:20}
.mast .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.mast h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.005em;flex:1 1 auto}
.mast .org{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#FFFFFF;font-weight:500;flex:0 0 auto}
.hbtn{background:#fff;color:var(--lav-deep);border:0;border-radius:4px;padding:7px 14px;font-weight:600;font-size:12px;cursor:pointer}
.hbtn[aria-expanded="true"]{background:var(--lav-soft)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin:0 0 16px}
h2{font-size:19px;margin:0 0 8px;font-weight:700}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--lav-deep);background:var(--lav-deep);color:#fff;border-radius:4px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:#3d3368}
.btn.sec{background:#fff;color:var(--lav-deep)}
.btn.sec:hover{background:var(--lav-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.clusters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ccard h3{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--blue);color:var(--blue-ink);border-radius:3px;padding:1px 7px;font-weight:600;letter-spacing:.03em}
.chip.pe{font-family:ui-monospace,Menlo,Consolas,monospace}
.bar{height:10px;background:var(--lav-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lav);width:0}
.panel{background:#fff;border:2px solid var(--lav);border-radius:4px;padding:16px 20px;margin:0 0 16px}
.panel ol{margin:8px 0 0;padding-left:22px}
.panel li{margin:6px 0}
details.teach{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 18px;margin:0 0 16px}
details.teach summary{cursor:pointer;font-weight:600;color:var(--blue-ink)}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.stim{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:10px 0 14px}
.stim .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lav-deep);font-weight:600;margin-bottom:4px}
table.data{border-collapse:collapse;width:100%;background:#fff;font-size:13px;margin:8px 0;table-layout:auto}
table.data caption{text-align:left;font-weight:600;padding:4px 0 6px}
table.data th,table.data td{border:1px solid #273540;padding:6px 9px;text-align:left;vertical-align:top}
table.data thead th{background:var(--lav-soft)}
table.data tbody th{background:#fff;font-weight:600}
.tscroll{overflow-x:auto}
svg.graph{width:100%;height:auto;max-width:620px;border:1px solid var(--line);border-radius:4px;display:block;margin:8px 0}
.stem{font-size:16px;font-weight:500;margin:6px 0 12px}
.step{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.step h3 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--lav-deep);color:#fff;align-items:center;justify-content:center;font-size:12px;margin-right:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:4px;margin:6px 0;cursor:pointer;background:#fff}
.opt input{margin-top:6px;width:18px;height:18px;accent-color:var(--lav-deep);flex:0 0 auto}
.fb{border-left:5px solid var(--blue);background:var(--blue-soft);padding:8px 12px;border-radius:0 4px 4px 0;margin:6px 0 10px;font-size:13px}
.fb.no{border-left-color:var(--lav-deep);background:var(--lav-soft)}
.fb b.tag{display:inline-block;margin-right:6px}
textarea.resp{width:100%;min-height:150px;background:#fff;border:2px solid #000;border-radius:3px;padding:12px;font-size:15px;line-height:1.55;resize:vertical}
.wc{font-size:12px;color:var(--muted);margin:4px 0 8px}
.starters{background:var(--lav-soft);border-radius:4px;padding:10px 14px;margin:0 0 10px;font-size:13px}
.starters div{margin:4px 0}
.crit{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:4px;margin:8px 0;background:#fff}
.crit .ic{flex:0 0 28px;height:28px}
.crit .st{font-weight:700;display:inline-block;min-width:62px}
.crit.met{border-left:6px solid var(--blue-ink)}
.crit.not{border-left:6px dashed var(--lav-deep)}
.score{font-weight:600;margin:8px 0}
.model .band{border-radius:4px;padding:10px 14px;margin:8px 0;border:1px solid var(--line)}
.band .lbl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:4px;padding:1px 8px;margin-bottom:4px;color:#fff}
.band.claim{background:#EFEAF8;border-left:6px solid #0033A0}.band.claim .lbl{background:#0033A0}
.band.evidence{background:#E7F0F8;border-left:6px solid #0B5A9C}.band.evidence .lbl{background:#0B5A9C}
.band.reasoning{background:#F4F0E6;border-left:6px solid #0E68B3}.band.reasoning .lbl{background:#6A5A9E}
.earns{border:1px solid var(--blue);background:#fff;border-radius:4px;padding:10px 14px;margin:10px 0}
.nocr{border:1px dashed var(--lav-deep);background:#fff;border-radius:4px;padding:10px 14px;margin:10px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.chk input{margin-top:6px;width:18px;height:18px;accent-color:var(--lav-deep)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
.limits{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 12px;margin:8px 0}
.toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:12px;color:#fff}
.toggle input{width:18px;height:18px;accent-color:#fff}
footer{max-width:980px;margin:0 auto;padding:8px 16px 30px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.sr{position:absolute;left:-9999px}
@media (max-width:640px){ .mast h1{font-size:15px} .stem{font-size:15px} table.data{font-size:12px} }
.proj{font-size:19px}.proj .stem{font-size:23px}.proj table.data{font-size:18px}.proj .btn{font-size:18px;padding:12px 24px}.proj textarea{font-size:19px}.resp-box{background:#fff;border:2px solid #000;border-radius:3px;padding:14px 16px;font-size:16px;margin:8px 0}.proj .resp-box{font-size:24px;line-height:1.5}.proj svg.graph{max-width:760px}
.dec{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.ok{border-left:6px solid #0B5A9C}.no2{border-left:6px dashed #0033A0}
@media print{ .mast,footer,.nav,.hbtn,.btn{display:none} body{background:#fff} .card{border:0} }
</style>
<style id="paper-css">
/* Paper version (printable), burple look, 9-12 grade band, Calibri. Scoped under .paper and body.paper-on. */
body.paper-on{background:#d9d9d9}
body.paper-on .mast,body.paper-on .wrap,body.paper-on footer{display:none !important}
#paper[hidden]{display:none !important}
#paper{page:paper}
.paper,.paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
.paper{font-family:Calibri,Carlito,"Lato",Arial,sans-serif;font-size:10pt;line-height:1.2;color:#1A160D;background:transparent;padding:16px 8px}
.paper .ptool{max-width:8.5in;margin:0 auto 12px;display:flex;gap:10px;flex-wrap:wrap}
.paper .ptool .btn{font-size:1rem;font-family:Calibri,Carlito,"Lato",Arial,sans-serif}
.paper .ptool a.btn{text-decoration:none;display:inline-block}
.paper .sheet{background:#fff;color:#1A160D;max-width:8.5in;margin:0 auto 18px;padding:.35in .5in .5in;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.paper p{margin:0 0 3pt}
.paper b,.paper strong{font-weight:700}
.paper .p-u{display:flow-root;margin:0 0 4pt;break-inside:avoid;page-break-inside:avoid}
.paper .p-page{display:flow-root}
.paper .p-page + .p-page{break-before:page;page-break-before:always}
@media screen{#pBody .p-page + .p-page{border-top:1px dashed #999;margin-top:.4in;padding-top:.4in}}
.p-measure{position:absolute;left:-99999px;top:0;width:7.5in;visibility:hidden;padding:0 !important}
.p-measure .sheet{padding:0 !important;margin:0 !important;max-width:none !important;box-shadow:none !important}

/* header bar and chips */
.paper .p-bar{background:#6B9BCC;color:#fff;padding:3pt 10pt;margin:0 0 2pt;border:0}
.paper .p-bar .l1{font-size:13pt;font-weight:700;line-height:1.2;color:#fff}
.paper .p-bar .l2{font-size:9pt;font-weight:400;line-height:1.2;color:#fff;white-space:pre-wrap;margin-top:1pt}
.paper .p-chips{display:flex;gap:0;margin:2pt 0 4pt}
.paper .p-chip{flex:1 1 0;background:#E4DFEF;border:0;text-align:center;padding:2pt 6pt;font-size:8.5pt;line-height:1.15}
.paper .p-chip .cl{font-weight:700;color:#7B6BAF;margin:0}
.paper .p-chip .cv{font-weight:700;color:#1A160D;margin-top:.5pt}
.paper .p-name{margin:3pt 0 3pt;font-size:10pt}
.paper .p-dir{font-size:10pt;margin:0 0 4pt}

/* headings and labels */
.paper h2,.paper .p-key h3{font-family:inherit;font-size:12pt;font-weight:700;color:#6B9BCC;border-bottom:1px solid #6B9BCC;padding-bottom:1pt;margin:0 0 3pt;line-height:1.25;letter-spacing:0}
.paper .lab,.paper .p-unp .uh{font-weight:700;color:#7B6BAF}
.paper .p-pes{font-size:9.5pt;margin:0 0 3pt}
.paper .p-pass{margin:0 0 4pt}
.paper .p-ref{font-size:9.5pt;font-style:italic;margin:0 0 3pt}
.paper .p-stem{font-size:10pt;margin:0 0 4pt}

/* callouts (burple tip) */
.paper .p-howto,.paper .p-crit,.paper .p-st{background:#E4DFEF;border:.5pt solid #7B6BAF;border-left:2pt solid #7B6BAF;padding:3pt 10pt}
.paper .p-howto{font-size:9.5pt;line-height:1.2}
.paper .p-howto h3{font-family:inherit;font-size:11pt;font-weight:700;color:#7B6BAF;border:0;padding:0;margin:0 0 2pt}
.paper .p-howto ol{margin:0;padding-left:16pt;column-count:2;column-gap:16pt}
.paper .p-howto li{margin:0 0 2pt;break-inside:avoid}
.paper .p-crit{font-size:10pt;line-height:1.15;margin:0 0 3pt;padding:2pt 10pt}
.paper .p-crit ul{margin:2pt 0 0;padding-left:16pt;font-size:9.5pt}
.paper .p-st{font-size:9.5pt;line-height:1.2;margin:0 0 3pt}

/* item parts */
.paper .p-unp{font-size:10pt;line-height:1.2;border:1px solid #CCCCCC;padding:3pt 6pt;margin:0 0 3pt}
.paper .p-unp .vo{margin:1pt 0 1pt 3pt}
.paper .p-unp .parts{margin-top:3pt;font-size:9.5pt}
.paper .p-unp .cb{margin-left:5pt;display:inline-block;max-width:98%;vertical-align:top;white-space:normal;text-indent:-1.15em;padding-left:1.15em}
.paper .cb::before{content:"";display:inline-block;width:.8em;height:.8em;border:1px solid #000;margin-right:.3em;vertical-align:-1px;background:#fff}
.paper .p-box{border:1px solid #000;background:#fff;margin:0 0 3pt}
.paper .p-cw{font-size:9.5pt;line-height:1.2}
.paper .p-cw .cols{column-count:2;column-gap:12pt}
.paper .p-cw .cb{display:block;margin:0 0 1pt;white-space:normal;padding-left:0;break-inside:avoid}

/* tables */
.paper table{border-collapse:collapse}
.paper table.data{width:100%;font-size:9.5pt;margin:3pt 0;background:#fff;table-layout:auto}
.paper table.data caption{font-size:9.5pt;font-weight:700;text-align:left;padding:1pt 0 2pt;color:#1A160D}
.paper table.data th,.paper table.data td,.paper table.p-rt th,.paper table.p-rt td,.paper table.p-kt th,.paper table.p-kt td{border:1px solid #CCCCCC;color:#1A160D;font-size:9.5pt;padding:2pt 5pt;text-align:left;vertical-align:middle;line-height:1.15}
.paper table.data thead th,.paper table.p-rt thead th,.paper table.p-kt thead th{background:#D6E5F2;color:#6B9BCC;font-weight:700}
.paper table.data tbody th{background:#fff;color:#1A160D;font-weight:700}
.paper .tscroll{overflow:visible}
.paper svg.graph{width:100%;max-width:4.4in;height:auto;border:0;border-radius:0;display:block;margin:3pt 0}
.paper table.p-rt{width:100%;table-layout:fixed;margin:0}
.paper table.p-rt thead{display:table-header-group}
.paper table.p-rt th span{font-weight:400}
.paper table.p-rt tr{break-inside:avoid;page-break-inside:avoid}
.paper table.p-rt td{vertical-align:top}
.paper table.p-rt td.w{border:1px solid #000;background:#fff;height:.6in}
.paper table.p-rt td.s{font-size:10pt;border-right-color:#000}
.paper table.p-rt td.s div{margin:0 0 6pt}
.paper table.p-rt thead th:last-child{border-bottom-color:#000}
.paper .p-refl{margin-top:3pt}
.paper .p-refl p{margin:0 0 3pt}

/* answer key */
.paper .p-key{font-size:10pt;line-height:1.25}
.paper .p-k{border-top:1px solid #CCCCCC;padding:3pt 0;margin:0;orphans:3;widows:3}
.paper .p-k div{margin:1pt 0}
.paper table.p-kt{width:100%;table-layout:fixed;margin:0 0 6pt}
.paper table.p-kt tr{break-inside:avoid;page-break-inside:avoid}
.paper .p-key h3{break-after:avoid;page-break-after:avoid}

/* page setup: page number only, grey, sand rule */
@page paper{
  size:letter;margin:.35in .5in .5in .5in;
  @bottom-left{content:"";border-top:1px solid #E3DACB;margin-top:2pt}
  @bottom-right{content:"";border-top:1px solid #E3DACB;margin-top:2pt}
  @bottom-center{content:counter(page);font-family:Calibri,Carlito,Arial,sans-serif;font-size:8pt;color:#666666;border-top:1px solid #E3DACB;margin-top:2pt;vertical-align:top;padding-top:2pt}
}
@media print{
  body.paper-on{background:#fff !important}
  body.paper-on .ptool{display:none !important}
  .paper{padding:0}
  .paper .sheet{box-shadow:none;margin:0;padding:0;max-width:none;width:auto}
  .paper .sheet + .sheet{break-before:page;page-break-before:always}
}
</style>

var CLUSTERS=[{"id":"c1","title":"A Runner on a Hot Day","topic":"Homeostasis and feedback","pes":["HS-LS1-3","HS-LS1-2"],"intro":"<p>On a hot day, a runner jogs for 20 minutes and then rests in the shade for 20 minutes. Researchers measured her core body temperature and her sweat rate. A normal core body temperature for a person is about 37 degrees C. The body uses feedback mechanisms to keep conditions inside a normal range. This is a scenario with invented data.</p>","figs":["<table class=\"data\"><caption>Table 1. Runner on a hot day (air temperature 32 degrees C)</caption><thead><tr><th scope=\"col\">Time (minutes)</th><th scope=\"col\">What the runner is doing</th><th scope=\"col\">Core body temperature (degrees C)</th><th scope=\"col\">Sweat rate (mL per hour)</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td>Standing at the start</td><td>37.0</td><td>50</td></tr><tr><th scope=\"row\">10</th><td>Running</td><td>38.0</td><td>400</td></tr><tr><th scope=\"row\">20</th><td>End of 20 minute run</td><td>38.6</td><td>900</td></tr><tr><th scope=\"row\">30</th><td>Resting in the shade</td><td>38.0</td><td>700</td></tr><tr><th scope=\"row\">40</th><td>Resting in the shade</td><td>37.3</td><td>250</td></tr></tbody></table>","<svg class=\"graph\" viewBox=\"0 0 560 250\" role=\"img\" aria-label=\"Model of how the nervous system and circulatory system respond to a rise in body temperature\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#273540\"/></marker></defs><rect width=\"560\" height=\"250\" fill=\"#fff\"/><text x=\"280\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\" fill=\"#273540\">Model: Responding to a Rise in Core Temperature</text><rect x=\"14\" y=\"40\" width=\"150\" height=\"70\" rx=\"8\" fill=\"#E3EEF8\" stroke=\"#0033A0\" stroke-width=\"1.5\"/><text x=\"89\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#273540\">Nervous system</text><text x=\"89\" y=\"80\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">Brain senses</text><text x=\"89\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">core temperature</text><text x=\"89\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">is above normal</text><rect x=\"205\" y=\"40\" width=\"150\" height=\"70\" rx=\"8\" fill=\"#E3EEF8\" stroke=\"#0033A0\" stroke-width=\"1.5\"/><text x=\"280\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#273540\">Nervous system</text><text x=\"280\" y=\"80\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">Brain sends signals</text><text x=\"280\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">to skin blood vessels</text><text x=\"280\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">and sweat glands</text><rect x=\"396\" y=\"40\" width=\"150\" height=\"70\" rx=\"8\" fill=\"#EEF2FA\" stroke=\"#0033A0\" stroke-width=\"1.5\"/><text x=\"471\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#273540\">Circulatory system</text><text x=\"471\" y=\"80\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">Skin blood vessels widen,</text><text x=\"471\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">more warm blood</text><text x=\"471\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">flows to the skin</text><rect x=\"205\" y=\"150\" width=\"150\" height=\"70\" rx=\"8\" fill=\"#F5F5F5\" stroke=\"#0033A0\" stroke-width=\"1.5\"/><text x=\"280\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#273540\">Skin</text><text x=\"280\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">Heat leaves the body.</text><text x=\"280\" y=\"206\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">Sweat evaporates and</text><text x=\"280\" y=\"222\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">carries heat away</text><rect x=\"14\" y=\"150\" width=\"150\" height=\"70\" rx=\"8\" fill=\"#F5F5F5\" stroke=\"#0033A0\" stroke-width=\"1.5\"/><text x=\"89\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#273540\">Result</text><text x=\"89\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">Core temperature</text><text x=\"89\" y=\"206\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\">goes down toward normal</text><text x=\"89\" y=\"222\" text-anchor=\"middle\" font-size=\"12\" fill=\"#273540\"></text><line x1=\"164\" y1=\"75\" x2=\"203\" y2=\"75\" stroke=\"#273540\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><line x1=\"355\" y1=\"75\" x2=\"394\" y2=\"75\" stroke=\"#273540\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><line x1=\"471\" y1=\"110\" x2=\"340\" y2=\"150\" stroke=\"#273540\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><line x1=\"205\" y1=\"185\" x2=\"166\" y2=\"185\" stroke=\"#273540\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><text x=\"380\" y=\"215\" font-size=\"12\" fill=\"#273540\">The brain keeps sensing the change.</text></svg>"]},{"id":"c2","title":"Deer on an Island","topic":"Ecosystems, carrying capacity, and human impact","pes":["HS-LS2-1","HS-LS2-6","HS-LS2-7"],"intro":"<p>In 1995, ten deer were placed on a small island with no deer predators. Researchers counted the deer and measured the mass of food plants on the island over many years. Rainfall was also recorded. This is a scenario with invented data.</p>","figs":["<svg class=\"graph\" viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"Line graph of deer on the island: 10 in 1995, 40 in 2000, 90 in 2005, 120 in 2010, 122 in 2015, 119 in 2020, 80 in 2023, 52 in 2026\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"300\" fill=\"#fff\"/><text x=\"280\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\" fi var TASKS=[{"id":"t1","cluster":"c1","pe":"HS-LS1-3","type":"Describe evidence that supports a claim","figs":[0],"stem":"Using the data in Table 1, describe evidence that supports the claim that a feedback mechanism helps the runner's body maintain homeostasis.","earns":{"rule":"Allow 1 credit for describing a change in core body temperature and the body's response using values from Table 1, and showing that the response brings temperature back toward normal.","examples":["As she ran, her core temperature rose from 37.0 to 38.6 degrees C and her sweat rate rose from 50 to 900 mL per hour. When she rested, the sweating helped her temperature fall back to 37.3 degrees C."]}},{"id":"t4","cluster":"c2","pe":"HS-LS2-6","type":"Evaluate a claim (valid or not valid)","figs":[1],"stem":"A researcher claims that the drop in rainfall that began around 2023 has lowered the number of deer the island can support. Evaluate whether the claim is valid or not valid. Use evidence from Table 2 to support your evaluation.","earns":{"rule":"Allow 1 credit for selecting valid and supporting it with data from Table 2 that show rainfall decreasing and plants or deer decreasing.","examples":["The claim is valid. Rainfall dropped from about 100 cm to 55 cm, food plants fell from 40 to 22 tonnes, and deer fell from 119 to 80, so the island now supports fewer deer."]}},{"id":"t5","cluster":"c2","pe":"HS-LS2-7","type":"Choose and justify a solution (criteria and trade-offs)","figs":[2],"stem":"Identify one solution from Table 3 that you think best reduces the harm that low rainfall is doing to the island's plants and deer. Describe how it meets at least two of the criteria: cost, reliability, and environmental impact. Include one trade-off.","earns":{"rule":"Allow 1 credit for identifying one solution from the table and describing how it meets at least two of the criteria (cost, reliability, environmental impact), including a trade-off.","examples":["I chose planting shrubs. It costs $60,000 one time, and the shrubs are likely to survive low rainfall, so it is reliable. The trade-off is that they need 2 years to grow and still need some water."]}},{"id":"t7","cluster":"c3","pe":"HS-ESS2-6","type":"Use quantitative data to describe a cycle","figs":[1],"stem":"Use the data in Table 4 to describe how the loss of half of the seagrass changed the cycling of carbon between the seagrass and at least one other sphere of Earth.","earns":{"rule":"Allow 1 credit for using quantitative data from Table 4 to describe how the cycling of carbon between the seagrass and at least one other sphere decreased.","examples":["After the storm, the seagrass took in only 200 metric tons of carbon from the water instead of 400, and only 125 metric tons moved into the mud instead of 250, so less carbon cycled between the biosphere, hydrosphere, and geosphere."]}},{"id":"t10","cluster":"c4","pe":"HS-LS4-2","type":"Construct an explanation (natural selection)","figs":[0],"stem":"Using the evidence in Table 5, construct an explanation for how natural selection led to a greater percentage of lizards with large toe pads after the hurricane.","earns":{"rule":"Allow 1 credit for an explanation that large toe pads gave lizards an advantage in surviving the hurricane, that survivors reproduced and passed on the trait, and that uses evidence from Table 5.","examples":["Lizards with large toe pads gripped branches better in the hurricane, so 57 of 60 survived. They reproduced and passed the trait to their offspring, so the percentage with large toe pads rose from 30% to 71%."]}},{"id":"t11","cluster":"c4","pe":"HS-LS1-1","type":"Construct an explanation (DNA to protein)","figs":[2],"stem":"Using the evidence in Table 7, construct an explanation for how the structure of the DNA in this gene determines the structure and function of the protein that affects toe pad growth.","earns":{"rule":"Allow 1 credit for an explanation, using Table 7, that a change in the DNA base order changes the amino acid order, which changes the protein's shape and function.","examples":["The changed gene has GTT instead of GGT, so the third amino acid is glutamine instead of proline. The amino acid order determines the protein's shape, so the changed protein functions differently and causes larger toe pads."]}}];
var SCORING=[{"task":"t1","responses":[{"t":"When she ran, her core temperature rose from 37.0 to 38.6 degrees C and her sweat rate rose from 50 to 900 mL per hour. After she rested, the sweating helped her temperature fall back to 37.3 degrees C.","s":1,"p":"Clear credit","why":"It gives temperature values and sweat values from Table 1 and shows the temperature returning toward normal, which is the feedback.","rev":"Nothing needed. A scorer would accept this as is."},{"t":"A feedback mechanism helps the body maintain homeostasis when the runner is hot.","s":0,"p":"Restates the question","why":"It repeats the claim in the stem. It uses no data from Table 1 and describes no change or response.","rev":"Add values: \"Her core temperature rose from 37.0 to 38.6 degrees C and her sweat rate rose to 900 mL per hour, then her temperature fell to 37.3.\""},{"t":"Her core temperature went from 37.0 to 38.6 degrees C.","s":0,"p":"Correct data, no explanation","why":"The values are right, but they show only a change, not the body's response. The criteria need the response and the return toward normal.","rev":"Add the response: \"Her sweat rate rose from 50 to 900 mL per hour, and later her temperature fell back to 37.3 degrees C.\""},{"t":"Sweating cools the body because water evaporates from the skin and takes heat with it.","s":0,"p":"True statement that does not answer","why":"The science is true, but the question says to use the data in Table 1. No values are given and the runner's data are never mentioned.","rev":"Tie it to the table: \"At 20 minutes her sweat rate was 900 mL per hour, and her temperature then fell from 38.6 to 37.3 degrees C.\""},{"t":"Her temperature rose to 38.6 when sweat rate was 900, then fell to 37.3 as she rested, so the body brought it back close to normal.","s":1,"p":"Short but complete","why":"It is brief, but it has temperature and sweat values and says the temperature returned toward normal.","rev":"Optional: add the units (degrees C, mL per hour) to make the data easier to read."}]},{"task":"t4","responses":[{"t":"The claim is valid. Rainfall fell from about 100 cm to 55 cm, and the number of deer fell from 119 to 80 as the food plants dropped from 40 to 22 tonnes.","s":1,"p":"Clear credit","why":"It states valid and uses rainfall, plant, and deer values from Table 2 that show the effect.","rev":"Nothing needed."},{"t":"The claim is valid because rain is important and deer need it.","s":0,"p":"Correct idea, no evidence","why":"The decision is right, but there are no data from Table 2. The question says to use evidence from the table.","rev":"Add values: \"Rainfall fell from about 100 cm to 55 cm, and deer fell from 119 to 80.\""},{"t":"The claim is not valid. Rainfall has nothing to do with deer, since deer can drink from other places.","s":0,"p":"Misconception","why":"It chooses not valid, but Table 2 shows rainfall, plants, and deer all dropping together. The reasoning ignores that the deer eat plants that need rain.","rev":"Check the table and change the decision: \"Valid. Rainfall fell to 55 cm, plants fell to 22 tonnes, and deer fell to 80.\""},{"t":"The drop in rainfall lowered the number of deer the island can support, so the claim is valid.","s":0,"p":"Restates the question","why":"It repeats the claim from the stem. No values from Table 2 are given.","rev":"Add evidence: \"Rainfall fell from 100 cm to 55 cm while deer fell from 119 to 80.\""},{"t":"Valid. Rainfall dropped to 55 cm, and plants and deer also dropped, to 22 tonnes and 80 deer.","s":1,"p":"Short but complete","why":"It is minimal, but it states valid and gives rainfall, plant, and deer values that support the claim.","rev":"Optional: add why, such as less rain means fewer plants and less food."}]},{"task":"t5","responses":[{"t":"I chose solution 3, planting shrubs. It costs $60,000 one time and the shrubs are likely to survive low rainfall, so it is reliable. The trade-off is that they need 2 years to grow.","s":1,"p":"Clear credit","why":"It names a solution, uses two criteria (cost and reliability) with details from Table 3, and states a trade-off.","rev":"Nothing needed."},{"t":"Solution 1 is the best because it is cheap at $40,000 one time.","s":0,"p":"Only one criterion","why":"It names a solution and uses cost, but the question requires at least two criteria and a trade-off.","rev":"Add a second criterion and a trade-off: \"It is less reliable because it protects only the fenced plots.\""},{"t":"Solution 2 is best because it is the most helpful for the island and everyone will like it.","s":0,"p":"Opinion instead of criteria","why":"It names a solution but uses no criteria and no information from the table. \"Most helpful\" and \"everyone will like it\" are opinions.","rev":"Use cost, reliability, or environmental impact with table details, such as \"$90,000 each year\" and \"fewer deer eat plants across the whole island.\""},{"t":"Deer eat plants, and when there is less rain there are fewer plants, so fewer deer can live on the island.","s":0,"p":"True statement that does not answer","why":"The science is true, but it does not identify a solution or use any criteria.","rev":"Choose a solution and judge it: \"Planting shrubs adds food, costs $60,000 one time, and takes 2 years to grow.\""},{"t":"Fencing is best. It costs $40,000 one time, which is cheaper than moving deer at $90,000 each year. But it is less reliable because it only protects the fenced plots, so unfenced plants are still eaten.","s":1,"p":"Clear credit","why":"It names a solution, uses cost and reliability with table details, and includes the trade-off.","rev":"Nothing needed."}]},{"task":"t7","responses":[{"t":"After the storm the seagrass took in 200 metric tons of carbon from the water instead of 400, and only 125 tons went into the mud instead of 250, so less carbon cycled between the biosphere, hydrosphere, and geosphere.","s":1,"p":"Clear credit","why":"It uses values from Table 4 and describes less carbon moving between the seagrass and at least one other sphere.","rev":"Nothing needed."},{"t":"The storm destroyed the seagrass so the carbon cycle changed a lot.","s":0,"p":"Restates the question","why":"It says the cycle changed but gives no values and does not say how carbon movement changed or between which spheres.","rev":"Add values and direction: \"Carbon taken in from the water dropped from 400 to 200 metric tons per year.\""},{"t":"The carbon disappeared when half of the seagrass died, so there is less carbon on Earth.","s":0,"p":"Misconception","why":"Carbon is not destroyed. It moves between spheres. The data show less carbon being moved into the seagrass and mud, not carbon vanishing.","rev":"Describe movement: \"Less carbon moved from the water into the seagrass, 400 down to 200 metric tons.\""},{"t":"The numbers went from 400 to 200, 150 to 75, and 250 to 125.","s":0,"p":"Correct data, no explanation","why":"The numbers are real, but the response does not say what moved or between which spheres. Copying values is not a description of cycling.","rev":"Say what the numbers mean: \"Seagrass took in half as much carbon from the water, and half as much was buried in the mud.\""},{"t":"Less carbon moved from the water to the seagrass, 400 down to 200 metric tons.","s":1,"p":"Short but complete","why":"It names the water and the seagrass, gives values, and says less carbon moved.","rev":"Optional: add the mud (geosphere) and the 250 to 125 change for a fuller answer."}]},{"task":"t10","responses":[{"t":"Lizards with large toe pads gripped branches better in the hurricane, so 57 of the 60 survived while only 23 of 140 small toe pad lizards did. The survivors reproduced and passed on the trait, so the percentage with large toe pads rose from 30% to 71%.","s":1,"p":"Clear credit","why":"It gives the survival advantage, the reproduction and passing on of the trait, and values from Table 5.","rev":"Nothing needed."},{"t":"The lizards grew bigger toe pads because they needed them to survive the hurricane.","s":0,"p":"Misconception","why":"Individual lizards do not change on purpose. Natural selection acts on variation that already exists. No data from Table 5 are used.","rev":"Rewrite the cause: \"Lizards that already had large toe pads were more likely to survive and reproduce.\""},{"t":"Before the hurricane 30% had large toe pads and after it 71% did.","s":0,"p":"Correct data, no explanation","why":"The values are right, but it only shows the change. It does not explain why large toe pads became more common.","rev":"Add the chain: advantage in the storm, survival, reproduction, passing on the trait."},{"t":"Natural selection happened. Lizards with the better trait survive and reproduce and pass the trait on.","s":0,"p":"Correct idea, no evidence","why":"The science idea is right but general. It does not name the toe pad trait or use any evidence from Table 5, as the question requires.","rev":"Connect to the data: \"57 of 60 large toe pad lizards survived, compared with 23 of 140 small toe pad lizards.\""},{"t":"More large toe pad lizards survived (57 of 60) because toe pads help them hold on. They had offspring with large toe pads, so more of the next lizards had them.","s":1,"p":"Short but complete","why":"It uses data, gives the survival advantage, and says the trait was passed to offspring.","rev":"Optional: add the 30% to 71% change."}]},{"task":"t11","responses":[{"t":"The changed gene has GTT instead of GGT, so the third amino acid is glutamine instead of proline. The order of amino acids determines the protein's shape, so the changed protein functions differently and the toe pads are larger.","s":1,"p":"Clear credit","why":"It uses the DNA and amino acid difference from Table 7 and explains that amino acid order sets shape, which sets function.","rev":"Nothing needed."},{"t":"DNA makes proteins and proteins do jobs. The gene is different so the lizard is different.","s":0,"p":"True statement that does not answer","why":"The words are true but general. It gives no detail from Table 7 and does not explain the steps from DNA to amino acids to shape.","rev":"Add the steps: \"GGT changed to GTT, which changed proline to glutamine, which changed the protein shape.\""},{"t":"The DNA turns into the protein, and the changed DNA made a bigger protein.","s":0,"p":"Misconception","why":"DNA does not turn into protein. The order of bases is a code for the order of amino acids that are built into a protein. Nothing in Table 7 says the protein is bigger.","rev":"Use the correct direction: DNA base order sets amino acid order, which sets the protein's shape and function."},{"t":"The normal gene is TAC CCA GGT and the changed gene is TAC CCA GTT.","s":0,"p":"Correct data, no explanation","why":"It copies the evidence but does not explain how the difference changes the protein or the toe pads.","rev":"Add the explanation: \"This changes one amino acid, which changes the protein's shape and how it functions.\""},{"t":"One base changed from G to T, which changed an amino acid from proline to glutamine. That changes how the protein folds, so it works differently and makes bigger toe pads.","s":1,"p":"Short but complete","why":"It uses the Table 7 difference and links amino acid change to shape and function.","rev":"Optional: name the DNA base order idea more directly."}]}];

})();

<script id="paper-js">
(function(){
'use strict';
var APP_TITLE='Score Like a Scorer';
var GROUP_LABEL='';
var savedTitle=document.title;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function bw(svg){
  return svg.replace(/(fill|stroke)="#([0-9a-fA-F]{3,6})"/g,function(m,a,h){
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);

}
function figTitle(html){

  var cap=d.querySelector('caption'); if(cap) return cap.textContent;
  var tx=d.querySelector('svg text'); return tx?tx.textContent:'the figure';
}
function figHtml(html){ return '<div class="tscroll">'+(html.indexOf('<svg')===0?bw(html):html)+'</div>'; }
function docUrl(kind,g){ var d=window.PAPER_DOCS||{}, m=d[kind]||{}; var u=m[g]||m.all||''; return /^https:\/\//.test(u)?u:''; }
function bar(l1,l2){ return '<div class="p-bar"><div class="l1">'+esc(l1)+'</div><div class="l2">'+esc(l2)+'</div></div>'; }
function chips(a){ return '<div class="p-chips">'+a.map(function(x){ return '<div class="p-chip"><div class="cl">'+esc(x[0])+'</div><div class="cv">'+esc(x[1])+'</div></div>'; }).join('')+'</div>'; }
function nameLine(){ return '<div class="p-name">Name ______________________ &nbsp; Date ____________ &nbsp; Class/Period ______</div>'; }

var PAGE_FULL=Math.round(10.15*96), PAGE_C=PAGE_FULL-Math.round(0.08*96);
function mh(el){ var r=el.getBoundingClientRect(), cs=getComputedStyle(el); return r.height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0); }
function growersOf(el){
  var out=[]; [].forEach.call(el.querySelectorAll('.p-box[data-g]'),function(b){ var base=b.getBoundingClientRect().height; out.push({el:b,type:'box',base:base,cap:Math.max(0,Math.min(base*1.5,240-base)),shr:base*(el.classList&&el.classList.contains('p-refl')?0.2:0.2)}); });
  [].forEach.call(el.querySelectorAll('svg.graph'),function(sv){ var rc=sv.getBoundingClientRect(); if(rc.height>0&&rc.width>0) out.push({el:sv,type:'svg',base:rc.height,w:rc.width,cap:rc.height*Math.max(0,(720/rc.width)-1),shr:0}); });
  [].forEach.call(el.querySelectorAll('table.data'),function(tb){ var rws=tb.rows.length; if(rws>1) out.push({el:tb,type:'tbl',base:0,rows:rws,cap:rws*5,shr:0}); });
  if(el.getAttribute('data-stretch')) [].forEach.call(el.children,function(ch,ci,all){ if(ci===all.length-1) return; out.push({el:ch,type:'mar',base:parseFloat(getComputedStyle(ch).marginBottom)||0,cap:30,shr:0}); });
  return out;
}
function planPages(U,C,fin){
  var n=U.length, best=[0], from=[0], i, j; for(j=1;j<=n;j++) best[j]=Infinity;
  for(j=1;j<=n;j++){
    if(j<n && U[j-1].noBreak) continue;
    var H=0,S=0,G=0;
    for(i=j-1;i>=0;i--){
      H+=U[i].H; S+=U[i].S; G+=U[i].G;
      if(H-S>C) break;
      if(i>0 && U[i-1].noBreak) continue;
      if(best[i]===Infinity) continue;
      var HH=H+((U[i].row&&U[i].k>1)?U[i].th:0), blank=C-HH, un=0, ab=0, cost;
      if(blank>=0){ un=Math.max(0,blank-G); ab=Math.min(blank,G); }
      if(j===n&&fin){ cost=0.5+0.5*Math.pow(Math.max(blank,0)/C,2); }
      else { cost=0.5+100*Math.pow(un/C,2)+0.3*(ab/C)+(un/C>0.1?3:0)+(blank<0?0.1*(-blank)/C:0); }
      if(best[i]+cost<best[j]){ best[j]=best[i]+cost; from[j]=i; }
    }
  }
  if(best[n]===Infinity) return null;
  var pages=[]; j=n; while(j>0){ pages.unshift([from[j],j]); j=from[j]; }
  pages.cost=best[n];
  return pages;
}
function layout(html){
  var m=document.createElement('div'); m.className='paper p-measure'; m.innerHTML=html; document.body.appendChild(m);
  var sheets=[].slice.call(m.querySelectorAll('.sheet')).filter(function(x){ return !x.classList.contains('p-key'); });
  var gp=0, stats=[], figPage={}, pagesAll=[];
  sheets.forEach(function(sh,si){
    var fin=(si===sheets.length-1);
    var U=describe(sh); if(!U.length) return;
    var pl=planPages(U,PAGE_C,fin);
    if(window.ALT_ORDERS){ var AO=window.ALT_ORDERS(U); var base0=U; for(var ai=0;ai<AO.length;ai++){ var pl2=planPages(AO[ai],PAGE_C,fin); if(pl2&&(!pl||pl2.cost<pl.cost-0.01)){ U=AO[ai]; pl=pl2; } } }
     if(!pl){ gp+=1; return; }
    var shell=null;
    var pageEls=[];
    pl.forEach(function(rg){
      var pg=document.createElement('div'); pg.className='p-page'; sh.appendChild(pg); gp++;
      var tb=null, grow=[];
      for(var k=rg[0];k<rg[1];k++){
        var u=U[k];
        if(u.row){
          if(!tb){ var nt=u.table.cloneNode(false); nt.appendChild(u.table.querySelector('colgroup').cloneNode(true)); nt.appendChild(u.table.tHead.cloneNode(true)); tb=document.createElement('tbody'); nt.appendChild(tb); pg.appendChild(nt); }
          tb.appendChild(u.el);
        } else { tb=null; pg.appendChild(u.el); if(u.el.getAttribute('data-fig')) figPage[u.el.getAttribute('data-fig')]=gp; }
        u.gr.forEach(function(g){ grow.push(g); });
      }
      pageEls.push({el:pg,grow:grow,no:gp,last:fin&&rg===pl[pl.length-1]});
    });
    U.forEach(function(u){ if(u.table&&u.table.parentNode) u.table.parentNode.removeChild(u.table); });
    [].forEach.call(sh.querySelectorAll('table.p-rt'),function(t){ if(!t.closest('.p-page')) t.parentNode.removeChild(t); });
    pagesAll=pagesAll.concat(pageEls);
  });
  // fill page numbers
  [].forEach.call(m.querySelectorAll('.p-pg'),function(sp){ sp.textContent=String(figPage[sp.getAttribute('data-fig')]||''); });
  // grow or shrink writing boxes to fill each page
  pagesAll.forEach(function(P){
    var cur0=P.el.getBoundingClientRect().height;
    if(!P.last && P.grow.length){
      P.grow.forEach(function(g){ if(g.type==='row'){ g.base=g.el.parentNode.getBoundingClientRect().height; g.cap=Math.max(0,Math.min(151,240-g.base)); } });
      var blank=PAGE_C-cur0, capS=0, shrS=0; P.grow.forEach(function(g){ capS+=g.cap; shrS+=g.shr; });
      var gv=P.grow.map(function(g){ return blank>=0 ? (capS?g.cap*Math.min(1,blank/capS):0) : (shrS?-g.shr*Math.min(1,-blank/shrS):0); });
      for(var it=0;it<4;it++){
        P.grow.forEach(function(g,i){ if(g.type==='mar') g.el.style.marginBottom=(g.base+gv[i])+'px'; else if(g.type==='tbl'){ var per=gv[i]/g.rows/2; [].forEach.call(g.el.querySelectorAll('th,td'),function(cell){ cell.style.paddingTop=(2.67+per)+'px'; cell.style.paddingBottom=(2.67+per)+'px'; }); } else if(g.type==='svg'){ g.el.style.maxWidth=(g.w*(g.base+gv[i])/g.base)+'px'; } else g.el.style.height=(g.base+gv[i])+'px'; });
        var h=P.el.getBoundingClientRect().height, over=h-PAGE_C;
        if(over<=0.5) break;
        var tot=0; gv.forEach(function(v,i){ tot+=Math.max(0,gv[i]+P.grow[i].shr); });
        if(!tot) break;
        gv=gv.map(function(v,i){ var room=Math.max(0,v+P.grow[i].shr); return v-Math.min(room,over*room/tot); });
      }
    }
    var hh=P.el.getBoundingClientRect().height;
    P.el.setAttribute('data-blank',((PAGE_FULL-hh)/PAGE_FULL).toFixed(3));
    stats.push({page:P.no,blank:(PAGE_FULL-hh)/PAGE_FULL,over:hh>PAGE_FULL});
  });
  var out=m.innerHTML; document.body.removeChild(m);
  return {html:out,stats:stats};
}
var token=0;

var GROUPS=SCORING.map(function(it,i){ var t=TASKS.filter(function(x){return x.id===it.task;})[0]; return {id:'q'+(i+1),label:'Question '+(i+1)+': '+t.type}; });

var cur={group:'all',key:false,starters:false};
